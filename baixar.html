<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar CONQUISTADOR DE WAIFU'S</title>
<meta name="theme-color" content="#0d0b10">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d0b10; color: #ffebca; font-family: Georgia, serif; padding: 20px;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
    background: #171019; border: 2px solid #c9a462; border-radius: 16px; padding: 28px 22px;
    box-shadow: 0 0 30px rgba(255, 46, 136, .25);
  }
  .card img { width: 120px; height: 120px; border-radius: 24px; border: 2px solid #c9a462; object-fit: cover; }
  h1 { font-size: 22px; margin: 16px 0 6px; color: #ffd98a; }
  p { font-size: 14px; line-height: 1.5; opacity: .85; margin-bottom: 20px; }
  a.btn {
    display: block; padding: 16px; border-radius: 12px; text-decoration: none;
    background: linear-gradient(180deg, #ff2e88, #b3125a); color: #fff;
    font: bold 18px Georgia, serif; letter-spacing: .5px;
    box-shadow: 0 4px 18px rgba(255, 46, 136, .45);
  }
  a.btn:active { transform: scale(.97); }
  a.play {
    display: block; margin-top: 12px; padding: 12px; border-radius: 12px; text-decoration: none;
    border: 1px solid #c9a462; color: #ffd98a; font: bold 15px Georgia, serif;
  }
  small { display: block; margin-top: 16px; font-size: 12px; opacity: .6; }
</style>
</head>
<body>
  <div class="card">
    <img src="icon-512.png" alt="CONQUISTADOR DE WAIFU'S">
    <h1>CONQUISTADOR DE WAIFU'S</h1>
    <p>Baixe o jogo e jogue direto no celular, sem precisar de internet depois.</p>
    <a class="btn" href="Index.html" download="Index.html">⬇ Baixar o jogo</a>
    <a class="play" href="Index.html">▶ Jogar no navegador</a>
    <small>Depois de baixar, é só abrir o arquivo no navegador do celular.</small>
  </div>
</body>
</html>
