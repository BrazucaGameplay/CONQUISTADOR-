  (function (root) {

    function cloneData(value) {
      if (value === undefined) return undefined;
      if (typeof structuredClone === 'function') {

      }
      return value === null ? null : JSON.parse(JSON.stringify(value));
    }

    // Event contracts for future systems:
    // entity:die { entityId, killerId, xp }; entity:moved { id, kind, tile };
    // status:changed { entityId, reason, status }; level:changed { entityId, level, xp };
    // progress:changed { section: pets|waifus|flags|dungeons|items, data };
    // save:request { reason }. LevelSystem is the only entity:die subscriber.
    class EventBus {
      constructor() { this.listeners = new Map(); }
      on(eventName, handler, options = {}) {
        if (typeof eventName !== 'string' || !eventName || typeof handler !== 'function') {
          throw new TypeError('EventBus.on exige nome de evento e função.');
        }
        const entry = { handler, once: options.once === true, active: true };
        if (!this.listeners.has(eventName)) this.listeners.set(eventName, new Set());
        this.listeners.get(eventName).add(entry);
        return () => this.off(eventName, handler, entry);
      }
      once(eventName, handler) { return this.on(eventName, handler, { once: true }); }
      off(eventName, handler, exactEntry = null) {
        const entries = this.listeners.get(eventName);
        if (!entries) return false;
        let removed = false;
        for (const entry of Array.from(entries)) {
          if ((exactEntry && entry === exactEntry) || (!exactEntry && entry.handler === handler)) {
            entry.active = false;
            entries.delete(entry);
            removed = true;
          }
        }
        if (!entries.size) this.listeners.delete(eventName);
        return removed;
      }
      emit(eventName, payload = {}) {
        const entries = this.listeners.get(eventName);
        if (!entries || !entries.size) return 0;
        let delivered = 0;
        for (const entry of Array.from(entries)) {
          if (!entry.active) continue;
          if (entry.once) this.off(eventName, entry.handler, entry);
          try {
            entry.handler(payload);
            delivered += 1;
          } catch (error) {
            console.error(`Erro em listener do evento ${eventName}:`, error);
          }

    class EntityManager {
      constructor(eventBus) {
        this.eventBus = eventBus;
        this.entities = new Map();
        this.nextId = 1;
      }
      create(definition) {

        if (this.entities.has(id)) throw new Error(`Entidade duplicada: ${id}`);

    // Esquema único de atributos para jogador e monstros. Os aliases legados

    const STATUS_KEYS = [

      'penetration', 'attackSpeed', 'moveSpeed',
      'hpRegenOutOfCombat', 'energyRegen'
    ];
    const STATUS_ALIASES = Object.freeze({

      strength: 'attack', speed: 'moveSpeed'
    });
    class StatusSystem {
      constructor(eventBus) {

        const maxEnergy = this.numberOr(source.maxEnergy ?? source.maxMp, 50, 0);
        const record = {
          hp: this.numberOr(source.hp, maxHp, 0, maxHp), maxHp,
          energy: this.numberOr(source.energy ?? source.mp, maxEnergy, 0, maxEnergy),
          maxEnergy,
          attack: this.numberOr(source.attack ?? source.strength, 10, 0),
          defense: this.numberOr(source.defense, 5, 0),
          penetration: this.numberOr(source.penetration, 0, 0),
          attackSpeed: this.numberOr(source.attackSpeed, 1, 0),

        const canonical = STATUS_ALIASES[stat] || stat;
        if (!STATUS_KEYS.includes(canonical)) return null;

          energy: this.numberOr(savedStats.energy ?? savedStats.mp, maxEnergy, 0, maxEnergy),

    class LevelSystem {
      constructor(eventBus, options = {}) {
        this.eventBus = eventBus;
        this.playerEntityId = options.playerEntityId || 'player';
        this.curve = options.curve || { baseXp: 100, exponent: 1.5 };
        this.progress = new Map();
        this.progress.set(this.playerEntityId, { level: 1, xp: 0 });

        this.unsubscribeDeath = this.eventBus.on('entity:die', event => {
          if (!event || event.killerId !== this.playerEntityId) return;
          const reward = Number(event.xp);
          if (Number.isFinite(reward) && reward > 0) this.addExperience(this.playerEntityId, reward);
        });
      }

      }
      restore(entityId, saved) {

        // the current level threshold after a curve revision.

          xp -= this.xpToNext(level);
          level += 1;
          guard += 1;
        }
        this.progress.set(entityId, { level, xp });
        this.eventBus.emit('level:changed', { entityId, ...this.snapshot(entityId), reason: 'restored' });
        return true;

    class SaveSystem {
      constructor(config, eventBus) {

        this.backupKey = config.backupKey;
        this.previousBackupKey = config.previousBackupKey;
        this.worldId = config.worldId;

        this.legacyRaw = null;
        this.backupConfirmed = false;
        this.unreadable = false;
        this.replacementLocked = false;
        this.replacementAuthorized = false;
        this.progressData = { pets: [], waifus: { unlocked: [], levels: {}, equipped: [] }, flags: {}, dungeons: {}, items: [] };
        this.lastLoadedData = null;
      }
      readPrimary() {
        try { this.unreadable = false; return { ok: true, raw: root.localStorage.getItem(this.primaryKey) }; }

        this.replacementAuthorized = false;

      }

          if (existing) root.localStorage.setItem(this.previousBackupKey, existing);
          root.localStorage.setItem(this.backupKey, raw);

          ? { x: data.player.tile.x, y: data.player.tile.y } : null;
        normalized.status = data.status && typeof data.status === 'object' ? cloneData(data.status) : { player: null };
        normalized.level = data.level && typeof data.level === 'object' ? cloneData(data.level) : { level: 1, xp: 0 };

          ? cloneData(data.waifus) : { unlocked: [], levels: {}, equipped: [] };
        normalized.flags = data.flags && typeof data.flags === 'object' && !Array.isArray(data.flags) ? cloneData(data.flags) : {};
        normalized.dungeons = data.dungeons && typeof data.dungeons === 'object' && !Array.isArray(data.dungeons) ? cloneData(data.dungeons) : {};

        this.progressData = { pets: cloneData(data.pets), waifus: cloneData(data.waifus), flags: cloneData(data.flags), dungeons: cloneData(data.dungeons), items: cloneData(data.items) };

        const data = this.defaultV4(snapshot.player && snapshot.player.position);
        data.savedAt = Number(snapshot.savedAt) || Date.now();
        data.player = cloneData(snapshot.player || data.player);
        data.player.id = data.player.id || 'player';
        data.status = cloneData(snapshot.status || data.status);
        data.level = cloneData(snapshot.level || data.level);
        const progress = this.getProgressData();
        data.pets = Array.isArray(snapshot.pets) ? cloneData(snapshot.pets) : progress.pets;
        data.waifus = snapshot.waifus && typeof snapshot.waifus === 'object' ? cloneData(snapshot.waifus) : progress.waifus;
        data.flags = snapshot.flags && typeof snapshot.flags === 'object' ? cloneData(snapshot.flags) : progress.flags;
        data.dungeons = snapshot.dungeons && typeof snapshot.dungeons === 'object' ? cloneData(snapshot.dungeons) : progress.dungeons;
        data.items = Array.isArray(snapshot.items) ? cloneData(snapshot.items) : progress.items;
        try {
          root.localStorage.setItem(this.primaryKey, JSON.stringify(data));
          const verify = root.localStorage.getItem(this.primaryKey);
          const parsed = verify ? JSON.parse(verify) : null;
          if (!parsed || parsed.version !== 4 || parsed.world !== this.worldId ||
              !parsed.player || !parsed.player.position ||
              parsed.player.position.x !== data.player.position.x ||
              parsed.player.position.y !== data.player.position.y) return false;
          this.legacyRaw = null;
          this.backupConfirmed = true;
          this.replacementLocked = false;
          this.replacementAuthorized = false;
          this.lastLoadedData = data;
          this.progressData = { pets: cloneData(data.pets), waifus: cloneData(data.waifus), flags: cloneData(data.flags), dungeons: cloneData(data.dungeons), items: cloneData(data.items) };
          this.eventBus.emit('save:written', { version: 4, savedAt: data.savedAt });
          return true;
        } catch (error) {
          console.warn('SaveSystem: falha ao gravar save V4.', error);
          return false;
        }
      }
    }

    // MonsterSystem is an extension module: it can query the public world API,
    // use EntityManager/StatusSystem, and communicate through EventBus. It never
    // receives the collision grids, the SaveSystem, or mutable world internals.
    class MonsterSystem {
      constructor(api, options = {}) {
        if (!api || !api.events || !api.entities || !api.status || !api.world || !api.progress) {
          throw new TypeError('MonsterSystem exige a API pública completa.');
        }
        this.api = api;
        this.scene = options.scene;
        if (!this.scene || !this.scene.add || !this.scene.events) {
          throw new TypeError('MonsterSystem exige uma cena Phaser ativa.');
        }
        this.data = api.data;
        this.events = api.events;
        this.entities = api.entities;
        this.status = api.status;
        this.world = api.world;
        this.progress = api.progress;
        this.monsters = new Map();
        this.drops = new Map();
        this.now = 0;
        this.chunkGrid = Object.freeze({
          chunkSize: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.chunkSize || 30)),
          columns: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.columns || 1)),
          rows: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.rows || 1)),
          width: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.width || 30)),
          height: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.height || 30))
        });
        this.maxMonstersPerChunk = Math.max(1, Math.floor(options.maxMonstersPerChunk || 6));
        this.maxPerMonsterType = Math.max(1, Math.floor(options.maxPerMonsterType || 2));
        this.monsterTypes = Object.freeze(['slime', 'monkey', 'rat']);
        this.respawnDelayMs = Math.max(1000, Math.floor(options.respawnDelayMs || 30000));
        this.spawnRetryDelayMs = 5000;
        this.nextMonsterSequence = 1;
        this.chunkRespawns = new Map();
        this.chunkPopulation = new Map();
        this.lastPlayerAttackAt = -Infinity;
        this.playerAttackCooldownMs = Number.isFinite(options.playerAttackCooldownMs)
          ? Math.max(0, options.playerAttackCooldownMs) : 420;
        this.attackRange = 48;
        this.playerApproachRange = 260;
        this.playerAttackWindupMs = 180;
        this.pendingPlayerAttack = null;
        this.approachTargetId = null;
        this.lastApproachRequestAt = -Infinity;
        this.manualDestinationActive = false;
        this.aggroRange = 260;
        this.monsterAttackRange = 24;
        this.monsterAttackCooldownMs = 1350;
        this.tileSize = Number.isFinite(options.tileSize) ? options.tileSize : 16;
        this.active = true;
        this.message = '';
        this.messageUntil = 0;
        this.texturesReady = false;
        this.createMonsterTextures();
        this.createUI();
        this.unsubscribers = [
          this.events.on('player:destination-set', () => {
            this.manualDestinationActive = true;
            // Discard only combat intent. Never send combat-stop here because
            // that event clears the WorldScene path, including the user's route.
            this.pendingPlayerAttack = null;
            this.approachTargetId = null;
          }),
          this.events.on('player:destination-cleared', () => {
            this.manualDestinationActive = false;
            this.approachTargetId = null;
            this.pendingPlayerAttack = null;
          }),
          this.events.on('status:changed', event => {
            if (event && (event.entityId === 'player' || this.monsters.has(event.entityId))) this.refreshUI();
          }),
          this.events.on('level:changed', event => {
            if (event && event.entityId === 'player') this.refreshUI();
          }),
          this.events.on('save:written', () => {
            this.finalizePendingDrops();
            this.refreshUI();
          })
        ];
        this.boundUpdate = (time, delta) => this.update(time, delta);
        this.boundDestroy = () => this.destroy();
        this.scene.events.on('update', this.boundUpdate);
        this.scene.events.once('shutdown', this.boundDestroy);
        this.refreshUI();
      }

          image.src = spriteSources[type];
        }
      }

      createUI() {

        root.setAttribute('aria-label', 'Interface de combate');
        root.style.position = 'fixed';
        root.style.left = '8px';

        root.style.display = 'flex';
        root.style.flexDirection = 'column';
        root.style.alignItems = 'flex-start';
        root.style.gap = '5px';

        // Cooldown indicator: a sword inside a circular ring. The ring fills

        autoAttackBadge.style.bottom = 'max(18px, env(safe-area-inset-bottom))';
        autoAttackBadge.style.zIndex = '30';
        autoAttackBadge.style.width = '56px';
        autoAttackBadge.style.height = '56px';
        autoAttackBadge.style.padding = '4px';
        autoAttackBadge.style.display = 'grid';
        autoAttackBadge.style.placeItems = 'center';
        autoAttackBadge.style.borderRadius = '50%';
        autoAttackBadge.style.background = 'conic-gradient(from -90deg, #dfc47d 100%, rgba(90,78,57,.38) 100%)';
        autoAttackBadge.style.boxShadow = '0 2px 9px rgba(0,0,0,.55), 0 0 0 1px rgba(221,196,128,.62)';

      }

      updateAutoAttackIndicator() {
        if (!this.autoAttackBadge) return;
        const cooldown = Math.max(1, this.playerAttackCooldownMs || 420);
        const elapsed = Math.max(0, this.now - this.lastPlayerAttackAt);
        const progress = Math.max(0, Math.min(1, elapsed / cooldown));
        const percent = (progress * 100).toFixed(1);
        const muted = progress >= 1;
        this.autoAttackBadge.style.background =
          `conic-gradient(from -90deg, #dfc47d ${percent}%, rgba(90,78,57,.38) ${percent}% 100%)`;
        this.autoAttackBadge.style.opacity = muted ? '1' : '0.96';
        if (this.autoAttackInner) {
          this.autoAttackInner.style.color = muted ? '#f4dfaa' : '#c8b98e';
          this.autoAttackInner.style.filter = muted ? 'none' : 'saturate(.72)';
        }
      }

      getChunkId(chunkX, chunkY) {
        return `${chunkX}:${chunkY}`;
      }

      getChunkForTile(tile) {
        if (!tile || !Number.isInteger(tile.x) || !Number.isInteger(tile.y) ||
            tile.x < 0 || tile.y < 0 ||
            tile.x >= this.chunkGrid.width || tile.y >= this.chunkGrid.height) return null;
        const chunkX = Math.floor(tile.x / this.chunkGrid.chunkSize);
        const chunkY = Math.floor(tile.y / this.chunkGrid.chunkSize);
        if (chunkX >= this.chunkGrid.columns || chunkY >= this.chunkGrid.rows) return null;
        return {
          chunkX,
          chunkY,
          id: this.getChunkId(chunkX, chunkY)
        };
      }

      getChunkPopulationState(chunkId) {
        let state = this.chunkPopulation.get(chunkId);
        if (!state) {
          state = {
            initialSpawnAttempted: false,
            initialFillPending: false,
            initialRetryAt: 0,
            totalSpawned: 0
          };
          this.chunkPopulation.set(chunkId, state);
        }
        return state;
      }

      getAliveCountForChunk(chunkId, monsterId = null) {
        let count = 0;
        for (const record of this.monsters.values()) {
          if (record.alive && record.originChunkId === chunkId &&
              (!monsterId || record.monsterId === monsterId)) count += 1;
        }
        return count;
      }

      getSpawnCandidates(chunkX, chunkY) {
        const startX = chunkX * this.chunkGrid.chunkSize;
        const startY = chunkY * this.chunkGrid.chunkSize;
        const endX = Math.min(startX + this.chunkGrid.chunkSize, this.chunkGrid.width);
        const endY = Math.min(startY + this.chunkGrid.chunkSize, this.chunkGrid.height);
        const playerTile = this.world.getPlayerBodyTile();
        const candidates = [];

        // Keep a one-tile margin inside chunk/world borders; the player-footprint
        // walkability API remains authoritative for every candidate.
        for (let y = startY + 1; y < endY - 1; y += 1) {
          for (let x = startX + 1; x < endX - 1; x += 1) {
            if (!this.world.isWalkable(x, y, 'player')) continue;
            if (playerTile && Math.max(Math.abs(playerTile.x - x), Math.abs(playerTile.y - y)) < 4) continue;

            // Avoid overlapping newly spawned groups and existing monsters,
            // including monsters that have wandered in from another chunk.
            const tooClose = Array.from(this.monsters.values()).some(record =>
              record.alive && Math.max(
                Math.abs(record.tile.x - x),
                Math.abs(record.tile.y - y)
              ) < 3
            );
            if (!tooClose) candidates.push({ x, y });
          }
        }

        // Deterministic per-chunk shuffle: repeatable placement without
        // Math.random(), making bugs and spawn patterns reproducible.
        let seed = (((chunkX + 1) * 73856093) ^ ((chunkY + 1) * 19349663) ^ 0x5f3759df) >>> 0;
        const random = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        for (let i = candidates.length - 1; i > 0; i -= 1) {
          const j = Math.floor(random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        return candidates;
      }

      getMonsterFacing(dx, dy) {
        // Eight sectors in the same clockwise convention used by the player.
        const angle = Math.atan2(dy, dx);
        return (Math.round((angle + Math.PI * 2) / (Math.PI / 4)) % 8);
      }

      setMonsterAnimation(record, state, dx = 0, dy = 0) {
        if (!record || !record.sprite || !record.sprite.active) return;
        const sprite = record.sprite;
        const animation = record.animation || (record.animation = {
          state: null, facing: 0, tween: null,
          baseScaleX: sprite.scaleX || 1, baseScaleY: sprite.scaleY || 1
        });
        const facing = (dx || dy) ? this.getMonsterFacing(dx, dy) : animation.facing;
        if (dx || dy) {
          animation.facing = facing;
          // The original monster art is a single-view sprite. Mirror it for
          // west-facing sectors and retain the eight-sector facing state.
          sprite.setFlipX(facing === 3 || facing === 4 || facing === 5);
        }
        if (animation.state === state) return;
        if (animation.tween && animation.tween.isPlaying()) animation.tween.stop();
        animation.tween = null;
        animation.state = state;
        const baseX = animation.baseScaleX;
        const baseY = animation.baseScaleY;
        sprite.setScale(baseX, baseY);
        sprite.setAngle(0);

        if (state === 'idle') {
          // Idle cadence mirrors the hero's 2-frame / 2 FPS loop.
          animation.tween = this.scene.tweens.add({
            targets: sprite,
            scaleX: { from: baseX * 0.985, to: baseX * 1.015 },
            scaleY: { from: baseY * 0.96, to: baseY * 1.04 },
            duration: 500, yoyo: true, repeat: -1, ease: 'Sine.InOut'
          });
        } else if (state === 'walk') {
          // Walk cadence mirrors the hero's 3-frame / 8 FPS loop.
          animation.tween = this.scene.tweens.add({
            targets: sprite,
            scaleX: { from: baseX * 1.06, to: baseX * 0.94 },
            scaleY: { from: baseY * 0.90, to: baseY * 1.10 },
            angle: { from: -3, to: 3 },
            duration: 125, yoyo: true, repeat: -1, ease: 'Sine.InOut'
          });
        } else if (state === 'attack') {
          // Three visual beats (wind-up, strike, recovery), with no change
          // to damage, range, cooldown, or attack timing.
          animation.tween = this.scene.tweens.add({
            targets: sprite,
            scaleX: { from: baseX * 0.88, to: baseX * 1.22 },
            scaleY: { from: baseY * 1.12, to: baseY * 0.82 },
            angle: { from: -5, to: 5 },
            duration: 100, yoyo: true, repeat: 1, ease: 'Quad.Out',
            onComplete: () => {
              if (!sprite.active || !record.alive) return;
              animation.state = null;
              this.setMonsterAnimation(record, 'idle');
            }
          });
        }
      }

      spawnOneMonsterForChunk(chunkX, chunkY, monsterId) {
        const chunkId = this.getChunkId(chunkX, chunkY);
        if (this.getAliveCountForChunk(chunkId) >= this.maxMonstersPerChunk) return false;
        const definition = this.data.MONSTERS[monsterId];
        if (!definition || !this.monsterTextureKeys[monsterId]) return false;
        if (this.getAliveCountForChunk(chunkId, monsterId) >= this.maxPerMonsterType) return false;

        const candidates = this.getSpawnCandidates(chunkX, chunkY);
        const tile = candidates[0];
        if (!tile) return false;

        const sequence = this.nextMonsterSequence++;
        const id = `monster-${monsterId}-${chunkX}-${chunkY}-${String(sequence).padStart(4, '0')}`;
        const x = (tile.x + 0.5) * this.tileSize;
        const y = (tile.y + 0.5) * this.tileSize;

        this.entities.create({
          id,
          kind: 'monster',
          tile,
          statusId: id,
          data: {
            monsterId,
            originChunkId: chunkId,
            originChunkX: chunkX,
            originChunkY: chunkY
          }
        });
        this.status.register(id, {
          hp: definition.hp, maxHp: definition.hp,
          energy: 0, maxEnergy: 0,
          attack: definition.attack ?? definition.damage ?? 0,
          defense: definition.defense || 0,
          penetration: definition.penetration || 0,
          attackSpeed: definition.attackSpeed || 1,
          moveSpeed: definition.moveSpeed ?? definition.speed ?? 0,
          hpRegenOutOfCombat: definition.hpRegenOutOfCombat || 0,
          energyRegen: definition.energyRegen || 0
        });

        const sprite = this.scene.add.image(x, y, this.monsterTextureKeys[monsterId]);
        sprite.setDisplaySize(definition.displayWidth || 30, definition.displayHeight || 24);
        sprite.setOrigin(0.5, 0.86);
        sprite.setDepth(y + 10);
        const record = {
          id,
          monsterId,
          definition,
          tile: { x: tile.x, y: tile.y },
          sprite,
          animation: {
            state: null, facing: 0, tween: null,
            baseScaleX: sprite.scaleX || 1, baseScaleY: sprite.scaleY || 1
          },
          path: [],
          targetKey: null,
          nextPathAt: 0,
          nextAttackAt: 0,
          alive: true,
          lastEntityTileKey: `${tile.x},${tile.y}`,
          // Immutable ownership: never recompute from the monster's current tile.
          originChunkId: chunkId,
          originChunkX: chunkX,
          originChunkY: chunkY
        };
        this.monsters.set(id, record);
        this.setMonsterAnimation(record, 'idle');
        const population = this.getChunkPopulationState(chunkId);
        population.totalSpawned += 1;
        this.events.emit('monster:spawned', {
          entityId: id,
          monsterId,
          tile,
          originChunkId: chunkId,
          originChunkX: chunkX,
          originChunkY: chunkY
        });
        return true;
      }

      populateAllChunks() {
        for (let chunkY = 0; chunkY < this.chunkGrid.rows; chunkY += 1) {
          for (let chunkX = 0; chunkX < this.chunkGrid.columns; chunkX += 1) {
            const chunkId = this.getChunkId(chunkX, chunkY);
            const population = this.getChunkPopulationState(chunkId);
            if (population.initialSpawnAttempted) continue;
            population.initialSpawnAttempted = true;
            for (const monsterId of this.monsterTypes) {
              for (let count = 0; count < this.maxPerMonsterType; count += 1) {
                if (!this.spawnOneMonsterForChunk(chunkX, chunkY, monsterId)) break;
              }
            }
            if (this.getAliveCountForChunk(chunkId) < this.maxMonstersPerChunk) {
              population.initialFillPending = true;
              population.initialRetryAt = this.now + this.spawnRetryDelayMs;
            }
          }
        }
      }

      updateInitialChunkFill() {
        for (const [chunkId, population] of this.chunkPopulation.entries()) {
          if (!population.initialFillPending || this.now < population.initialRetryAt) continue;
          const [chunkX, chunkY] = chunkId.split(':').map(Number);
          const queue = this.chunkRespawns.get(chunkId);
          let needsRetry = false;

          for (const monsterId of this.monsterTypes) {
            const queued = queue && queue.pendingByMonster ? (queue.pendingByMonster[monsterId] || 0) : 0;
            let available = this.maxPerMonsterType -
              this.getAliveCountForChunk(chunkId, monsterId) - queued;
            while (available > 0) {
              if (!this.spawnOneMonsterForChunk(chunkX, chunkY, monsterId)) {
                needsRetry = true;
                break;
              }
              available -= 1;
            }
          }

          const totalAlive = this.getAliveCountForChunk(chunkId);
          const totalQueued = queue ? queue.pending : 0;
          if (totalAlive + totalQueued >= this.maxMonstersPerChunk) {
            population.initialFillPending = false;
          } else {
            population.initialRetryAt = this.now + this.spawnRetryDelayMs;
          }
        }
      }

      scheduleChunkRespawn(record) {
        if (!record || !record.originChunkId || !this.monsterTypes.includes(record.monsterId)) return false;
        const chunkId = record.originChunkId;
        let queue = this.chunkRespawns.get(chunkId);
        if (!queue) {
          queue = {
            chunkX: record.originChunkX,
            chunkY: record.originChunkY,
            pending: 0,
            pendingByMonster: { slime: 0, monkey: 0, rat: 0 },
            nextAt: this.now + this.respawnDelayMs
          };
          this.chunkRespawns.set(chunkId, queue);
        }
        const currentAlive = this.getAliveCountForChunk(chunkId);
        const reserved = queue.pending;
        if (currentAlive + reserved >= this.maxMonstersPerChunk) return false;
        queue.pending += 1;
        queue.pendingByMonster[record.monsterId] =
          (queue.pendingByMonster[record.monsterId] || 0) + 1;
        this.events.emit('monster:respawn-queued', {
          originChunkId: chunkId,
          monsterId: record.monsterId,
          pending: queue.pending,
          respawnAt: queue.nextAt
        });
        return true;
      }

      updateChunkRespawns() {
        for (const [chunkId, queue] of Array.from(this.chunkRespawns.entries())) {
          if (!queue || queue.pending <= 0) {
            this.chunkRespawns.delete(chunkId);
            continue;
          }
          if (this.now < queue.nextAt) continue;

          if (this.getAliveCountForChunk(chunkId) >= this.maxMonstersPerChunk) {
            // The chunk is temporarily full: preserve the death reservation
            // and its species, then retry when a slot may become available.
            queue.nextAt = this.now + this.spawnRetryDelayMs;
            continue;
          }

          const monsterId = this.monsterTypes.find(type =>
            queue.pendingByMonster && queue.pendingByMonster[type] > 0
          );
          if (!monsterId) {
            this.chunkRespawns.delete(chunkId);
            continue;
          }

          const spawned = this.spawnOneMonsterForChunk(queue.chunkX, queue.chunkY, monsterId);
          if (!spawned) {
            // Retain the species reservation and retry later if no safe tile exists.
            queue.nextAt = this.now + this.spawnRetryDelayMs;
            continue;
          }

          queue.pending -= 1;
          queue.pendingByMonster[monsterId] -= 1;
          if (queue.pending <= 0) {
            this.chunkRespawns.delete(chunkId);
          } else {
            queue.nextAt = this.now + this.respawnDelayMs;
          }
          this.events.emit('monster:respawned', {
            originChunkId: chunkId,
            monsterId,
            pending: queue.pending
          });
        }
      }

      getPlayerPoint() {
        const tile = this.world.getPlayerBodyTile();
        if (!tile) return null;
        return { tile, x: (tile.x + 0.5) * this.tileSize, y: (tile.y + 0.5) * this.tileSize };
      }

      getLivingMonster() {
        for (const record of this.monsters.values()) if (record.alive) return record;
        return null;
      }

      getNearestMonsterInRange(playerPoint) {
        if (!playerPoint) return null;
        let nearest = null;
        let nearestDistance = Infinity;
        for (const record of this.monsters.values()) {
          if (!record.alive || !record.sprite || !record.sprite.active) continue;
          const distance = Math.hypot(
            record.sprite.x - playerPoint.x,
            record.sprite.y - playerPoint.y
          );
          if (distance <= this.attackRange && distance < nearestDistance) {
            nearest = record;
            nearestDistance = distance;
          }
        }
        return nearest;
      }

      getNearestMonsterForApproach(playerPoint) {
        if (!playerPoint) return null;
        let nearest = null;
        let nearestDistance = Infinity;
        for (const record of this.monsters.values()) {
          if (!record.alive || !record.sprite || !record.sprite.active) continue;
          const distance = Math.hypot(
            record.sprite.x - playerPoint.x,
            record.sprite.y - playerPoint.y
          );
          if (distance <= this.playerApproachRange && distance < nearestDistance) {
            nearest = record;
            nearestDistance = distance;
          }
        }
        return nearest;
      }

      autoAttackNearbyMonster() {
        if (!this.active) return false;
        if (this.manualDestinationActive) {
          this.pendingPlayerAttack = null;
          this.approachTargetId = null;
          return false;
        }
        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return false;

        const target = this.getNearestMonsterForApproach(playerPoint);
        if (!target) {
          if (this.approachTargetId) {
            this.events.emit('player:combat-stop', { targetId: this.approachTargetId });
            this.approachTargetId = null;
          }
          return false;
        }

        const distance = Math.hypot(
          target.sprite.x - playerPoint.x,
          target.sprite.y - playerPoint.y
        );

        if (distance > this.attackRange - 5) {
          this.pendingPlayerAttack = null;
          if (this.approachTargetId !== target.id ||
              this.now - this.lastApproachRequestAt >= 700) {
            this.approachTargetId = target.id;
            this.lastApproachRequestAt = this.now;
            this.events.emit('player:combat-move-request', {
              targetId: target.id,
              tileX: target.tile.x,
              tileY: target.tile.y
            });
          }
          return false;
        }

        if (this.approachTargetId) {
          this.events.emit('player:combat-stop', { targetId: this.approachTargetId });
          this.approachTargetId = null;
        }
        if (this.pendingPlayerAttack || this.now - this.lastPlayerAttackAt < this.playerAttackCooldownMs) {
          return false;
        }
        return this.playerAttack(target);
      }

      playerAttack(targetRecord = null) {
        if (!this.active || this.pendingPlayerAttack) return false;
        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return false;
        const record = targetRecord || this.getNearestMonsterInRange(playerPoint);
        if (!record || !record.alive || !record.sprite || !record.sprite.active) return false;
        const distance = Math.hypot(record.sprite.x - playerPoint.x, record.sprite.y - playerPoint.y);
        if (distance > this.attackRange) return false;

        this.lastPlayerAttackAt = this.now;
        this.pendingPlayerAttack = {
          targetId: record.id,
          hitAt: this.now + this.playerAttackWindupMs
        };
        this.events.emit('player:combat-attack-animation', {
          targetId: record.id,
          x: record.sprite.x,
          y: record.sprite.y
        });
        return true;
      }

      resolvePendingPlayerAttack() {
        const pending = this.pendingPlayerAttack;
        if (!pending || this.now < pending.hitAt) return false;
        this.pendingPlayerAttack = null;
        const record = this.monsters.get(pending.targetId);
        if (!record || !record.alive || !record.sprite || !record.sprite.active) return false;

        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return false;
        const distance = Math.hypot(record.sprite.x - playerPoint.x, record.sprite.y - playerPoint.y);
        if (distance > this.attackRange + 8) return false;

        const strength = this.status.getStat('player', 'attack') || 1;
        const defense = this.status.getStat(record.id, 'defense') || 0;
        const damage = Math.max(1, strength - defense);
        const result = this.status.applyDamage(record.id, damage);
        if (!result) return false;

        this.showMonsterHitEffect(record);
        this.events.emit('combat:hit', {
          attackerId: 'player',
          targetId: record.id,
          damage,
          remainingHp: result.hp
        });
        if (result.defeated) this.killMonster(record, 'player');
        this.refreshUI();
        return true;
      }

      showMonsterHitEffect(record) {
        if (!record || !record.sprite || !record.sprite.active) return;
        const sprite = record.sprite;
        sprite.setTintFill(0xff6666);
        this.scene.time.delayedCall(65, () => {
          if (sprite.active) sprite.clearTint();
        });

        // Small, localized impact burst: three tiny red sparks and a brief
        // warm flash, visually contained within the monster's sprite bounds.
        const burst = this.scene.add.circle(
          sprite.x,
          sprite.y - 5,
          3,
          0xffd18a,
          0.9
        );
        burst.setDepth(sprite.depth + 5);
        this.scene.tweens.add({
          targets: burst,
          scale: 1.7,
          alpha: 0,
          duration: 115,
          ease: 'Quad.Out',
          onComplete: () => burst.destroy()
        });

        for (let i = 0; i < 3; i += 1) {
          const angle = (-Math.PI * 0.8) + (i / 2) * (Math.PI * 0.6);
          const particle = this.scene.add.circle(
            sprite.x,
            sprite.y - 5,
            1.25,
            i === 1 ? 0xf06a62 : 0xc83e42,
            0.95
          );
          particle.setDepth(sprite.depth + 6);
          this.scene.tweens.add({
            targets: particle,
            x: sprite.x + Math.cos(angle) * 5,
            y: sprite.y - 5 + Math.sin(angle) * 5,
            alpha: 0,
            scale: 0.45,
            duration: 135,
            ease: 'Quad.Out',
            onComplete: () => particle.destroy()
          });
        }

        // Minimal recoil: only a 2px nudge, without shifting the entity tile.
        this.scene.tweens.killTweensOf(sprite);
        const playerPoint = this.getPlayerPoint();
        const dx = sprite.x - (playerPoint ? playerPoint.x : sprite.x);
        const dy = sprite.y - (playerPoint ? playerPoint.y : sprite.y);
        const length = Math.max(1, Math.hypot(dx, dy));
        this.scene.tweens.add({
          targets: sprite,
          x: sprite.x + (dx / length) * 2,
          y: sprite.y + (dy / length) * 2,
          duration: 45,
          yoyo: true,
          ease: 'Quad.Out'
        });
      }

      killMonster(record, killerId) {
        if (!record || !record.alive) return false;
        record.alive = false;
        if (record.animation && record.animation.tween && record.animation.tween.isPlaying()) {
          record.animation.tween.stop();
        }
        if (this.approachTargetId === record.id) {
          this.events.emit('player:combat-stop', { targetId: record.id });
          this.approachTargetId = null;
        }
        if (this.pendingPlayerAttack && this.pendingPlayerAttack.targetId === record.id) {
          this.pendingPlayerAttack = null;
        }
        const tile = { x: record.tile.x, y: record.tile.y };
        this.scheduleChunkRespawn(record);
        // LevelSystem is the only entity:die subscriber that awards XP.
        this.events.emit('entity:die', {
          entityId: record.id,
          killerId,
          monsterId: record.monsterId,
          xp: record.definition.xp,
          tile
        });
        this.events.emit('monster:died', { entityId: record.id, monsterId: record.monsterId, killerId, tile });
        this.createDrop(record);
        this.entities.remove(record.id); // StatusSystem cleans up this entity's status.
        this.monsters.delete(record.id);
        if (record.sprite && record.sprite.active) {
          const deathSprite = record.sprite;
          this.scene.tweens.killTweensOf(deathSprite);
          this.scene.tweens.add({
            targets: deathSprite,
            alpha: 0,
            scaleX: 0.35,
            scaleY: 0.35,
            angle: (deathSprite.x % 2 ? 12 : -12),
            duration: 260,
            ease: 'Back.In',
            onComplete: () => deathSprite.destroy()
          });
        }

        return true;
      }

      createDrop(record) {
        const itemId = record.definition.dropId;
        const dropDefinition = itemId && this.data.ITEMS[itemId];
        if (!dropDefinition) return false;
        const dropId = `drop-${record.id}-${itemId}`;
        const glyphByMonster = { slime: '◆', monkey: '✦', rat: '●' };
        const colorByMonster = { slime: '#a8f3d1', monkey: '#e7bd83', rat: '#d2c9d8' };
        const sprite = this.scene.add.text(
          record.sprite.x, record.sprite.y - 8, glyphByMonster[record.monsterId] || '◆', {
            fontFamily: 'system-ui, sans-serif', fontSize: '18px',
            color: colorByMonster[record.monsterId] || '#ffffff',
            stroke: '#30251c', strokeThickness: 3
          }
        );
        sprite.setDepth(record.sprite.y + 20);

          id: dropId,
          itemId,
          quantity: 1,
          x: record.sprite.x,
          y: record.sprite.y,
          sprite
        });
        this.events.emit('item:dropped', {
          dropId, itemId, quantity: 1, tile: record.tile, sourceMonsterId: record.monsterId
        });

        return true;
      }

      collectNearbyDrops() {
        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return;
        for (const drop of this.drops.values()) {
          if (drop.pendingCommit || this.now < (drop.retryAt || 0)) continue;
          if (Math.hypot(drop.x - playerPoint.x, drop.y - playerPoint.y) > 48) continue;
          const currentItems = this.progress.get('items') || [];
          const items = Array.isArray(currentItems) ? currentItems.map(item => ({ ...item })) : [];
          const existing = items.find(item => item && item.id === drop.itemId);
          if (existing) existing.quantity = Math.max(0, Number(existing.quantity) || 0) + drop.quantity;
          else items.push({ id: drop.itemId, quantity: drop.quantity });
          // Keep the ground drop until SaveSystem V4 confirms the inventory write.
          // If the protected save gate is closed, the drop remains available.
          const result = this.progress.update('items', items);
          if (result === 'pending' || result === true) {
            drop.pendingCommit = true;
            drop.pendingSince = this.now;
          } else {
            drop.retryAt = this.now + 1000;
            this.setMessage('Drop aguardando salvamento seguro.', 1800);
          }
        }
      }

      finalizePendingDrops() {
        for (const [dropId, drop] of Array.from(this.drops.entries())) {
          if (!drop.pendingCommit) continue;
          if (drop.sprite && drop.sprite.destroy) drop.sprite.destroy();
          this.drops.delete(dropId);
          this.events.emit('item:collected', {
            itemId: drop.itemId, quantity: drop.quantity, source: 'monster-drop'
          });
          const item = this.data.ITEMS[drop.itemId];
          this.setMessage(`${item ? item.name : drop.itemId} +${drop.quantity}`, 2400);
        }
      }

      setMessage(message, duration = 1800) {
        this.message = String(message || '');
        this.messageUntil = this.now + Math.max(0, duration);
        this.refreshUI();
      }

      refreshUI() {
        if (!this.playerLine || !this.monsterLine) return;
        const hp = this.status.getStat('player', 'hp') ?? 0;
        const maxHp = this.status.getStat('player', 'maxHp') ?? 0;
        const level = this.api.levels.snapshot('player');
        this.playerLine.textContent = `HP ${Math.ceil(hp)}/${Math.ceil(maxHp)}  •  Nv ${level.level}  •  XP ${level.xp}/${level.xpToNext}`;
        const livingMonsters = Array.from(this.monsters.values()).filter(record => record.alive);
        if (livingMonsters.length) {
          const target = livingMonsters[0];
          const targetHp = this.status.getStat(target.id, 'hp') ?? 0;
          this.monsterLine.textContent = `MONSTROS ${livingMonsters.length}  •  ALVO ${Math.ceil(targetHp)}/${target.definition.hp} HP`;
        } else {
          const pendingDrop = Array.from(this.drops.values()).some(drop => drop.pendingCommit);
          this.monsterLine.textContent = pendingDrop
            ? 'SEM MONSTROS  •  salvando drops…'
            : 'SEM MONSTROS  •  aguardando respawn';
        }
        this.messageLine.textContent = this.now <= this.messageUntil ? this.message : '';
      }

      updateMonster(record, playerPoint, time, delta) {
        if (!record.alive || !record.sprite || !record.sprite.active) return;
        const dxToPlayer = playerPoint.x - record.sprite.x;
        const dyToPlayer = playerPoint.y - record.sprite.y;
        const distance = Math.hypot(dxToPlayer, dyToPlayer);
        if (distance > this.aggroRange) {
          record.path = [];
          record.targetKey = null;
          this.setMonsterAnimation(record, 'idle');
          return;
        }
        if (distance <= this.monsterAttackRange) {
          record.path = [];
          if (record.animation && record.animation.state !== 'attack') {
            this.setMonsterAnimation(record, 'idle');
          }
          if (time >= record.nextAttackAt) {
            record.nextAttackAt = time + this.monsterAttackCooldownMs;
            this.setMonsterAnimation(record, 'attack', dxToPlayer, dyToPlayer);
            const result = this.status.applyDamage('player', record.definition.damage);
            if (result) {
              this.events.emit('monster:attack', {
                entityId: record.id, targetId: 'player', damage: record.definition.damage,
                remainingHp: result.hp
              });
            }
          }
          return;
        }

        const targetKey = `${playerPoint.tile.x},${playerPoint.tile.y}`;
        if (record.targetKey !== targetKey || time >= record.nextPathAt) {
          const start = {
            x: Math.floor(record.sprite.x / this.tileSize),
            y: Math.floor(record.sprite.y / this.tileSize)
          };
          const route = this.world.findPath(start, playerPoint.tile, { profile: 'player' });
          record.path = Array.isArray(route) ? route.map(tile => ({ x: tile.x, y: tile.y })) : [];
          record.targetKey = targetKey;
          record.nextPathAt = time + 650;
        }
        const stepSeconds = Math.max(0, Math.min(delta, 100)) / 1000;
        let target = record.path[0];
        while (target) {
          const targetX = (target.x + 0.5) * this.tileSize;
          const targetY = (target.y + 0.5) * this.tileSize;
          const dx = targetX - record.sprite.x;
          const dy = targetY - record.sprite.y;
          const distanceToWaypoint = Math.hypot(dx, dy);
          if (distanceToWaypoint <= 2) {
            record.path.shift();
            target = record.path[0];
            continue;
          }
          const monsterSpeed = this.status.getStat(record.id, 'speed') ?? record.definition.speed;
          const travel = Math.min(distanceToWaypoint, monsterSpeed * stepSeconds);
          record.sprite.setPosition(
            record.sprite.x + dx / distanceToWaypoint * travel,
            record.sprite.y + dy / distanceToWaypoint * travel
          );
          this.setMonsterAnimation(record, 'walk', dxToPlayer, dyToPlayer);
          record.sprite.setDepth(record.sprite.y + 10);
          break;
        }
        if (!target && record.animation && record.animation.state !== 'attack') {
          this.setMonsterAnimation(record, 'idle');
        }
        const tile = {
          x: Math.floor(record.sprite.x / this.tileSize),
          y: Math.floor(record.sprite.y / this.tileSize)
        };
        const tileKey = `${tile.x},${tile.y}`;
        if (tileKey !== record.lastEntityTileKey) {
          record.lastEntityTileKey = tileKey;
          record.tile = tile;
          this.entities.updateTile(record.id, tile);
        }
      }

      update(time, delta) {
        if (!this.active) return;
        this.now = Number.isFinite(time) ? time : this.now + (Number(delta) || 0);
        this.updateAutoAttackIndicator();
        this.updateInitialChunkFill();
        this.updateChunkRespawns();
        const playerPoint = this.getPlayerPoint();
        if (playerPoint) {
          for (const record of Array.from(this.monsters.values())) {
            this.updateMonster(record, playerPoint, this.now, Number(delta) || 0);
          }
          this.resolvePendingPlayerAttack();
          this.autoAttackNearbyMonster();
          this.collectNearbyDrops();
        }
        if (this.now > this.messageUntil && this.message) {
          this.message = '';
          this.refreshUI();
        }
      }

      destroy() {
        if (!this.active) return;
        this.active = false;
        for (const unsubscribe of this.unsubscribers || []) unsubscribe();
        this.unsubscribers = [];
        if (this.scene && this.scene.events) {
          this.scene.events.off('update', this.boundUpdate);
          this.scene.events.off('shutdown', this.boundDestroy);
        }
        for (const record of this.monsters.values()) {
          if (record.sprite && record.sprite.destroy) record.sprite.destroy();
          this.entities.remove(record.id);
        }
        for (const drop of this.drops.values()) if (drop.sprite && drop.sprite.destroy) drop.sprite.destroy();
        this.monsters.clear();
        this.drops.clear();
        this.pendingPlayerAttack = null;
        this.approachTargetId = null;
        if (this.uiRoot && this.uiRoot.remove) this.uiRoot.remove();
        if (this.autoAttackBadge && this.autoAttackBadge.remove) this.autoAttackBadge.remove();
      }
    }

    const GameData = Object.freeze({
      MONSTERS: Object.freeze({
        // First end-to-end proof entity. Balance values are intentionally exact
        // to the approved test specification: 30 HP, 5 damage, 10 XP, speed 50.
        slime: Object.freeze({
          id: 'slime', name: 'Slime', hp: 30, damage: 5, defense: 0,
          xp: 10, speed: 50, dropId: 'slime_gel', displayWidth: 30, displayHeight: 24
        }),
        monkey: Object.freeze({
          id: 'monkey', name: 'Macaco', hp: 45, damage: 7, defense: 1,
          xp: 15, speed: 65, dropId: 'monkey_fur', displayWidth: 30, displayHeight: 32
        }),
        rat: Object.freeze({
          id: 'rat', name: 'Rato', hp: 20, damage: 4, defense: 0,
          xp: 7, speed: 75, dropId: 'rat_tail', displayWidth: 32, displayHeight: 22
        })
      }),
      PETS: Object.freeze({}),
      WAIFUS: Object.freeze({}),
      DUNGEONS: Object.freeze({}),
      ITEMS: Object.freeze({
        slime_gel: Object.freeze({ id: 'slime_gel', name: 'Gel de Slime', category: 'material' }),
        monkey_fur: Object.freeze({ id: 'monkey_fur', name: 'Pelo de Macaco', category: 'material' }),
        rat_tail: Object.freeze({ id: 'rat_tail', name: 'Cauda de Rato', category: 'material' })
      }),
      LEVEL_CURVE: Object.freeze({ baseXp: 100, exponent: 1.5 })
    });

    root.CONQUISTADOR_V13_SYSTEMS = Object.freeze({
      EventBus, EntityManager, StatusSystem, LevelSystem, SaveSystem, MonsterSystem, GameData,
      schemaVersion: 4
    });
  })(window);
  </script>

        const quantityMax = this.el('div', {
          marginBottom: '18px',
          color: '#9f927e',
          font: '12px/1.2 Georgia, serif',
          textAlign: 'center'
        });
        const dialogActions = this.el('div', {
          display: 'flex',
          gap: '10px',
          marginTop: '4px'
        });
        const makeActionButton = (label, destructive) => {
          const button = this.el('button', {
            flex: '1',
            minHeight: '42px',
            padding: '0 10px',
            border: destructive
              ? '1px solid rgba(204,135,113,.9)'
              : '1px solid rgba(204,180,133,.75)',
            borderRadius: '22px',
            background: destructive
              ? 'linear-gradient(180deg, rgba(111,52,42,.98), rgba(59,25,23,.98))'
              : 'linear-gradient(180deg, rgba(74,62,50,.98), rgba(31,27,23,.98))',
            color: destructive ? '#ffe6dc' : '#eadcc2',
            font: 'bold 11px/1 Georgia, serif',
            letterSpacing: '.07em',
            textShadow: '0 1px 2px #000',
            boxShadow: '0 2px 8px rgba(0,0,0,.45)',
            touchAction: 'manipulation',
            cursor: 'pointer'
          });
          button.type = 'button';
          button.textContent = label;
          return button;
        };
        const cancelDelete = makeActionButton('CANCELAR', false);
        const confirmDelete = makeActionButton('CONFIRMAR', true);
        dialogActions.append(cancelDelete, confirmDelete);
        dialog.append(dialogTitle, dialogItemName, quantityCaption, quantityControls, quantityMax, dialogActions);
        dialogShade.appendChild(dialog);
        panel.appendChild(dialogShade);

        this.dialogShade = dialogShade;
        this.dialogItemName = dialogItemName;
        this.quantityValue = quantityValue;
        this.quantityMax = quantityMax;
        this.quantityMinus = quantityMinus;
        this.quantityPlus = quantityPlus;
        this.cancelDeleteButton = cancelDelete;
        this.confirmDeleteButton = confirmDelete;
        this.quantityDialogItemId = null;
        this.quantityDialogAmount = 1;
        this.quantityDialogMaximum = 1;

        this.quantityMinusHandler = () => this.setDialogQuantity(this.quantityDialogAmount - 1);
        this.quantityPlusHandler = () => this.setDialogQuantity(this.quantityDialogAmount + 1);
        this.cancelDeleteHandler = () => this.closeQuantityDialog();
        this.confirmDeleteHandler = () => this.confirmQuantityDeletion();
        quantityMinus.addEventListener('click', this.quantityMinusHandler);
        quantityPlus.addEventListener('click', this.quantityPlusHandler);
        cancelDelete.addEventListener('click', this.cancelDeleteHandler);
        confirmDelete.addEventListener('click', this.confirmDeleteHandler);
        dialogShade.addEventListener('click', event => {
          if (event.target === dialogShade) this.closeQuantityDialog();
        });

        backdrop.appendChild(panel);
        this.document.body.append(openButton, backdrop);

        this.openButton = openButton;
        this.closeButton = close;
        this.backdrop = backdrop;
        this.panel = panel;
        this.content = content;
        this.emptyState = empty;
        this.actionBar = actionBar;
        this.selectedLabel = selectedLabel;
        this.deleteButton = deleteButton;
        this.backdropHandler = event => {
          if (event.target === backdrop) this.setOpen(false);
        };
        backdrop.addEventListener('click', this.backdropHandler);
        this.keyHandler = event => {
          if (this.opened && event.key === 'Escape') this.setOpen(false);
        };
        this.document.addEventListener('keydown', this.keyHandler);
      }

      getItems() {
        const items = this.api.progress.get('items');
        return Array.isArray(items) ? items : [];
      }

      getItemDefinition(itemId) {
        const definitions = this.api.data.ITEMS || {};
        return definitions[itemId] || { id: itemId, name: itemId, category: 'material' };
      }

      getIcon(item) {
        const icon = this.el('div', {
          width: '58px',
          height: '58px',
          margin: '0 auto 7px',
          display: 'grid',
          placeItems: 'center',
          color: item.id === 'slime_gel' ? '#9df4dc' : '#e8d5a9',
          font: '42px/1 "Arial Unicode MS", "DejaVu Sans", sans-serif',
          textShadow: item.id === 'slime_gel'
            ? '0 0 5px #48bda7, 0 0 12px rgba(53,225,192,.6), 2px 3px 2px #000'
            : '0 2px 3px #000, 0 0 8px rgba(230,203,150,.35)',
          filter: 'drop-shadow(0 3px 2px rgba(0,0,0,.85))'
        });
        icon.textContent = item.id === 'slime_gel' ? '◆' : '✦';
        return icon;
      }

      refresh() {
        if (!this.active || !this.content) return;
        const grouped = new Map();
        for (const saved of this.getItems()) {
          if (!saved || typeof saved.id !== 'string' || !saved.id) continue;
          const quantity = Math.max(0, Math.floor(Number(saved.quantity) || 0));
          if (quantity > 0) grouped.set(saved.id, (grouped.get(saved.id) || 0) + quantity);
        }

        const items = Array.from(grouped, ([id, quantity]) => ({
          id,
          quantity,
          definition: this.getItemDefinition(id)
        })).sort((a, b) => {
          const categoryCompare = String(a.definition.category || 'material')
            .localeCompare(String(b.definition.category || 'material'), 'pt-BR');
          return categoryCompare || String(a.definition.name || a.id)
            .localeCompare(String(b.definition.name || b.id), 'pt-BR');
        });

        while (this.content.children.length > 1) {
          this.content.removeChild(this.content.lastChild);
        }
        if (this.selectedItemId && !items.some(item => item.id === this.selectedItemId)) {
          this.selectedItemId = null;
        }
        this.emptyState.style.display = items.length ? 'none' : 'block';
        this.updateSelectionBar(items);
        if (!items.length) return;

        const categories = new Map();
        for (const item of items) {
          const category = String(item.definition.category || 'material').toLowerCase();
          if (!categories.has(category)) categories.set(category, []);
          categories.get(category).push(item);
        }

        const categoryNames = {
          material: 'MATERIAIS',
          consumable: 'CONSUMÍVEIS',
          potion: 'POÇÕES',
          booster: 'APRIMORAMENTOS',
          equipment: 'EQUIPAMENTOS',
          quest: 'MISSÃO'
        };

        for (const [category, categoryItems] of categories) {
          const section = this.el('section', {
            margin: '8px 2px 22px'
          });
          const heading = this.el('div', {
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            gap: '12px',
            margin: '4px 3px 16px',
            color: '#e9d8b7',
            font: 'bold 17px/1.2 Georgia, "Times New Roman", serif',
            letterSpacing: '.045em',
            textAlign: 'center',
            textShadow: '0 2px 3px #000'
          });
          const left = this.el('span', {
            height: '1px',
            flex: '1 1 20px',
            maxWidth: '70px',
            background: 'linear-gradient(90deg, transparent, rgba(194,169,125,.65))'
          });
          const label = this.el('span');
          label.textContent = categoryNames[category] || category.replace(/[_-]/g, ' ').toUpperCase();
          const right = this.el('span', {
            height: '1px',
            flex: '1 1 20px',
            maxWidth: '70px',
            background: 'linear-gradient(90deg, rgba(194,169,125,.65), transparent)'
          });
          heading.append(left, label, right);

          const grid = this.el('div', {
            display: 'grid',
            gridTemplateColumns: 'repeat(4, minmax(0, 1fr))',
            columnGap: '5px',
            rowGap: '19px',
            alignItems: 'start'
          });
          for (const item of categoryItems) {
            const isSelected = this.selectedItemId === item.id;
            const cell = this.el('button', {
              minWidth: '0',
              minHeight: '112px',
              padding: '5px 2px 7px',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'flex-start',
              textAlign: 'center',
              color: '#eee6d7',
              border: isSelected ? '1px solid rgba(229,196,126,.95)' : '1px solid transparent',
              borderRadius: '8px',
              background: isSelected
                ? 'linear-gradient(180deg, rgba(126,96,51,.32), rgba(64,48,31,.24))'
                : 'transparent',
              boxShadow: isSelected ? 'inset 0 0 15px rgba(224,185,112,.14), 0 0 8px rgba(221,190,125,.15)' : 'none',
              font: 'inherit',
              cursor: 'pointer',
              touchAction: 'manipulation',
              WebkitTapHighlightColor: 'transparent'
            });
            cell.type = 'button';
            cell.setAttribute('aria-pressed', String(isSelected));
            cell.setAttribute('aria-label', `${item.definition.name || item.id}, quantidade ${item.quantity}${isSelected ? ', selecionado' : ''}`);
            cell.addEventListener('click', () => {
              this.selectedItemId = this.selectedItemId === item.id ? null : item.id;
              this.refresh();
            });
            const icon = this.getIcon(item);
            const name = this.el('div', {
              maxWidth: '100%',
              color: '#eee6d7',
              font: '14px/1.18 Georgia, "Times New Roman", serif',
              overflowWrap: 'anywhere',
              textShadow: '0 2px 3px #000'
            });
            name.textContent = item.definition.name || item.id;
            const quantity = this.el('div', {
              marginTop: '3px',
              color: '#c9bfae',
              font: '12px/1.1 Georgia, "Times New Roman", serif',
              fontVariantNumeric: 'tabular-nums',
              textShadow: '0 1px 2px #000'
            });
            quantity.textContent = `(${item.quantity.toLocaleString('pt-BR')})`;
            cell.append(icon, name, quantity);
            grid.appendChild(cell);
          }
          section.append(heading, grid);
          this.content.appendChild(section);
        }
      }

      openQuantityDialog(itemId, maximum) {
        this.quantityDialogItemId = itemId;
        this.quantityDialogMaximum = Math.max(1, Math.floor(Number(maximum) || 1));
        this.quantityDialogAmount = this.quantityDialogMaximum;
        const definition = this.getItemDefinition(itemId);
        this.dialogItemName.textContent = definition.name || itemId;
        this.quantityMax.textContent = `Disponível: ${this.quantityDialogMaximum.toLocaleString('pt-BR')}`;
        this.setDialogQuantity(this.quantityDialogAmount);
        this.dialogShade.style.display = 'flex';
      }

      setDialogQuantity(value) {
        const max = Math.max(1, this.quantityDialogMaximum || 1);
        this.quantityDialogAmount = Math.max(1, Math.min(max, Math.floor(Number(value) || 1)));
        this.quantityValue.textContent = this.quantityDialogAmount.toLocaleString('pt-BR');
        this.quantityMinus.disabled = this.quantityDialogAmount <= 1;
        this.quantityPlus.disabled = this.quantityDialogAmount >= max;
        this.quantityMinus.style.opacity = this.quantityMinus.disabled ? '.35' : '1';
        this.quantityPlus.style.opacity = this.quantityPlus.disabled ? '.35' : '1';
      }

      closeQuantityDialog() {
        this.dialogShade.style.display = 'none';
        this.quantityDialogItemId = null;
      }

      confirmQuantityDeletion() {
        const itemId = this.quantityDialogItemId;
        const amount = this.quantityDialogAmount;
        if (!itemId || amount < 1) return false;
        const current = this.getItems();
        let available = 0;
        for (const saved of current) {
          if (saved && saved.id === itemId) {
            available += Math.max(0, Math.floor(Number(saved.quantity) || 0));
          }
        }
        if (available < amount) {
          this.closeQuantityDialog();
          this.selectedItemId = null;
          this.refresh();
          return false;
        }
        let toRemove = amount;
        const remaining = [];
        for (const saved of current) {
          if (!saved) continue;
          if (saved.id !== itemId || toRemove <= 0) {
            remaining.push({ ...saved });
            continue;
          }
          const oldQuantity = Math.max(0, Math.floor(Number(saved.quantity) || 0));
          const removedHere = Math.min(oldQuantity, toRemove);
          const nextQuantity = oldQuantity - removedHere;
          toRemove -= removedHere;
          if (nextQuantity > 0) remaining.push({ ...saved, quantity: nextQuantity });
        }
        const found = toRemove === 0;
        if (!found) {
          this.closeQuantityDialog();
          this.selectedItemId = null;
          this.refresh();
          return false;
        }
        const result = this.api.progress.update('items', remaining);
        if (result === 'pending' || result === true) {
          this.closeQuantityDialog();
          this.selectedItemId = null;
          this.refresh();
          return true;
        }
        return false;
      }

      updateSelectionBar(items) {
        const selected = items.find(item => item.id === this.selectedItemId);
        this.actionBar.style.display = selected ? 'flex' : 'none';
        if (!selected) return;
        this.selectedLabel.textContent = selected.definition.name || selected.id;
        this.deleteButton.disabled = false;
        this.deleteButton.style.opacity = '1';
      }

      requestDeleteSelected() {
        if (!this.active || !this.selectedItemId) return false;
        const selectedId = this.selectedItemId;
        const current = this.getItems();
        const selected = current.find(item => item && item.id === selectedId);
        if (!selected) {
          this.selectedItemId = null;
          this.refresh();
          return false;
        }

        this.openQuantityDialog(selectedId, selected.quantity);
        return true;
      }

      setOpen(open) {
        if (!this.active) return;
        this.opened = Boolean(open);
        if (!this.opened && this.dialogShade) this.closeQuantityDialog();
        this.backdrop.style.display = this.opened ? 'flex' : 'none';
        this.openButton.setAttribute('aria-expanded', String(this.opened));
        if (this.opened) this.refresh();
      }

      destroy() {
        if (!this.active) return;
        this.active = false;
        for (const unsubscribe of this.unsubscribers || []) unsubscribe();
        this.unsubscribers = [];
        if (this.openButton) this.openButton.removeEventListener('click', this.openHandler);
        if (this.closeButton) this.closeButton.removeEventListener('click', this.closeHandler);
        if (this.deleteButton) this.deleteButton.removeEventListener('click', this.deleteHandler);
        if (this.quantityMinus) this.quantityMinus.removeEventListener('click', this.quantityMinusHandler);
        if (this.quantityPlus) this.quantityPlus.removeEventListener('click', this.quantityPlusHandler);
        if (this.cancelDeleteButton) this.cancelDeleteButton.removeEventListener('click', this.cancelDeleteHandler);
        if (this.confirmDeleteButton) this.confirmDeleteButton.removeEventListener('click', this.confirmDeleteHandler);
        if (this.backdrop) this.backdrop.removeEventListener('click', this.backdropHandler);
        if (this.document && this.keyHandler) this.document.removeEventListener('keydown', this.keyHandler);
        if (this.openButton && this.openButton.remove) this.openButton.remove();
        if (this.backdrop && this.backdrop.remove) this.backdrop.remove();
      }
    }

    root.CONQUISTADOR_V15_SYSTEMS = Object.freeze({ InventorySystem });
  })(window);
  </script>

    <script id="conquistador-bestiary-v1">
  (function (root) {
    'use strict';
    class BestiarySystem {
      constructor(api, options = {}) {
        if (!api || !api.events || !api.progress || !api.data) {
          throw new TypeError('BestiarySystem exige events, progress e data.');
        }
        this.api = api;
        this.document = options.document || root.document;
        this.active = true;
        this.opened = false;
        this.category = 'monsters';
        this.killCounts = this.readKillCounts();
        this.createUI();
        this.unsubscribers = [
          this.api.events.on('monster:died', event => this.recordKill(event)),
          this.api.events.on('save:written', () => this.refresh())
        ];
        this.refresh();
      }

      el(tag, styles = {}, className = '') {
        const node = this.document.createElement(tag);
        Object.assign(node.style, styles);
        if (className) node.className = className;
        return node;
      }

      readKillCounts() {
        const flags = this.api.progress.get('flags');
        const bestiary = flags && typeof flags === 'object' ? flags.bestiary : null;
        const counts = bestiary && typeof bestiary.monsters === 'object' ? bestiary.monsters : {};
        const result = {};
        for (const [id, count] of Object.entries(counts)) {
          result[id] = Math.max(0, Math.floor(Number(count) || 0));
        }
        return result;
      }

      recordKill(event) {
        if (!this.active || !event || event.killerId !== 'player' ||
            typeof event.monsterId !== 'string') return;
        this.killCounts[event.monsterId] = (this.killCounts[event.monsterId] || 0) + 1;
        const currentFlags = this.api.progress.get('flags');
        const flags = currentFlags && typeof currentFlags === 'object' ? { ...currentFlags } : {};
        const oldBestiary = flags.bestiary && typeof flags.bestiary === 'object'
          ? flags.bestiary : {};
        flags.bestiary = {
          ...oldBestiary,
          monsters: { ...(oldBestiary.monsters || {}), [event.monsterId]: this.killCounts[event.monsterId] }
        };
        this.api.progress.update('flags', flags);
        this.refresh();
      }

      createUI() {
        const button = this.el('button', {
          position: 'fixed',
          top: 'max(98px, calc(env(safe-area-inset-top) + 98px))',
          right: 'max(12px, env(safe-area-inset-right))',
          zIndex: '40',
          padding: '7px 13px',
          minHeight: '38px',
          border: '1px solid rgba(221,196,128,.82)',
          borderRadius: '20px',
          background: 'linear-gradient(180deg, rgba(55,43,31,.96), rgba(22,19,17,.96))',
          color: '#f4dfaa',
          font: '700 11px/1 Georgia, serif',
          letterSpacing: '.13em',
          textShadow: '0 1px 2px #000',
          boxShadow: '0 3px 12px rgba(0,0,0,.45)',
          touchAction: 'manipulation',
          cursor: 'pointer'
        });
        button.type = 'button';
        button.textContent = 'BESTIÁRIO';
        button.setAttribute('aria-label', 'Abrir bestiário');
        button.setAttribute('aria-expanded', 'false');
        this.openHandler = () => this.setOpen(!this.opened);
        button.addEventListener('click', this.openHandler);

        const backdrop = this.el('div', {
          position: 'fixed',
          inset: '0',
          zIndex: '101',
          display: 'none',
          alignItems: 'center',
          justifyContent: 'center',
          padding: 'max(12px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom))',
          background: 'rgba(0,0,0,.62)',
          backdropFilter: 'blur(1.5px)',
          WebkitBackdropFilter: 'blur(1.5px)',
          overscrollBehavior: 'contain'
        });
        const panel = this.el('section', {
          position: 'relative',
          width: 'min(100%, 540px)',
          height: 'min(88dvh, 760px)',
          display: 'flex',
          flexDirection: 'column',
          overflow: 'hidden',
          border: '2px solid rgba(190,169,125,.9)',
          borderRadius: '9px',
          outline: '1px solid rgba(28,20,14,.95)',
          outlineOffset: '-6px',
          background: 'linear-gradient(180deg, rgba(31,25,21,.96), rgba(12,12,11,.95))',
          color: '#f3ead8',
          boxShadow: '0 18px 55px rgba(0,0,0,.68), inset 0 0 38px rgba(0,0,0,.34)',
          font: '14px/1.35 Georgia, "Times New Roman", serif',
          touchAction: 'pan-y'
        });
        panel.setAttribute('role', 'dialog');
        panel.setAttribute('aria-modal', 'true');
        panel.setAttribute('aria-label', 'Bestiário');

        const header = this.el('div', {
          position: 'relative',
          flex: '0 0 auto',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          minHeight: '62px',
          padding: '8px 54px 7px'
        });
        const title = this.el('div', {
          color: '#f2e4c7',
          font: 'bold 23px/1 Georgia, serif',
          letterSpacing: '.055em',
          textAlign: 'center',
          textShadow: '0 2px 4px #000, 0 0 12px rgba(221,190,125,.18)'
        });
        title.textContent = 'BESTIÁRIO';
        const close = this.el('button', {
          position: 'absolute',
          right: '10px',
          top: '50%',
          transform: 'translateY(-50%)',
          width: '36px',
          height: '36px',
          display: 'grid',
          placeItems: 'center',
          border: '1px solid rgba(219,198,157,.72)',
          borderRadius: '50%',
          background: 'linear-gradient(145deg, rgba(86,72,61,.95), rgba(25,22,20,.98))',
          color: '#f7eddb',
          font: '26px/1 Arial, sans-serif',
          boxShadow: '0 2px 8px rgba(0,0,0,.55)',
          cursor: 'pointer',
          touchAction: 'manipulation'
        });
        close.type = 'button';
        close.textContent = '×';
        close.setAttribute('aria-label', 'Fechar bestiário');
        this.closeHandler = () => this.setOpen(false);
        close.addEventListener('click', this.closeHandler);
        header.append(title, close);

        const rule = this.el('div', {
          height: '1px',
          flex: '0 0 auto',
          margin: '0 17px 10px',
          background: 'linear-gradient(90deg, transparent, rgba(205,183,137,.65), transparent)'
        });
        const tabs = this.el('div', {
          display: 'grid',
          gridTemplateColumns: 'repeat(4, minmax(0,1fr))',
          gap: '5px',
          padding: '0 12px 12px',
          flex: '0 0 auto'
        });
        this.tabButtons = {};
        const tabDefs = [
          ['monsters','MONSTROS'],
          ['bosses','BOSS'],
          ['waifus','WAIFUS'],
          ['titans','TITANS']
        ];
        for (const [id,label] of tabDefs) {
          const tab = this.el('button', {
            minWidth: '0',

              description: 'Uma criatura gelatinosa que assumiu forma humana. Seu jeito brincalhão esconde uma natureza misteriosa e uma ligação especial com as cavernas de slime.',

  <script id="conquistador-waifu-collection-v1">
  (function (root) {
    'use strict';
    const QUALITY = [
      { id: 'plebeia', name: 'Plebeia', chance: 0.90, color: '#a9a9a9' },
      { id: 'dama', name: 'Dama', chance: 0.04, color: '#55a8e8' },
      { id: 'condessa', name: 'Condessa', chance: 0.03, color: '#b16ce2' },
      { id: 'duquesa', name: 'Duquesa', chance: 0.02, color: '#e6b84f' },
      { id: 'rainha', name: 'Rainha', chance: 0.01, color: '#b65bff' }
    ];

    class WaifuDropSystem {
      constructor(api, options = {}) {
        if (!api || !api.events || !api.progress || !api.data || !options.scene) {
          throw new TypeError('WaifuDropSystem exige API pública e cena ativa.');
        }
        this.api = api;
        this.scene = options.scene;
        this.tileSize = Number(options.tileSize) || 16;
        this.active = true;
        this.drops = new Map();
        this.sequence = 1;
        this.onDeath = event => this.handleMonsterDeath(event);
        this.onUpdate = () => this.collectNearby();
        this.onShutdown = () => this.destroy();
        this.api.events.on('monster:died', this.onDeath);
        this.scene.events.on('update', this.onUpdate);
        this.scene.events.once('shutdown', this.onShutdown);
      }

      rollQuality(randomValue = Math.random()) {
        let roll = Math.max(0, Math.min(0.999999999, Number(randomValue) || 0));
        let cumulative = 0;
        for (const quality of QUALITY) {
          cumulative += quality.chance;
          if (roll < cumulative) return quality;
        }
        return QUALITY[QUALITY.length - 1];
      }

      handleMonsterDeath(event) {
        if (!this.active || !event || event.killerId !== 'player' || event.monsterId !== 'slime') return false;
        if (Math.random() >= 0.20) return false;
        const quality = this.rollQuality();
        const x = (event.tile.x + 0.5) * this.tileSize;
        const y = (event.tile.y + 0.5) * this.tileSize;
        const id = `waifu-drop-${Date.now()}-${this.sequence++}`;
        const sprite = this.scene.add.text(x, y - 15, '♥', {
          fontFamily: 'Georgia, serif', fontSize: '23px', color: quality.color,
          stroke: '#24152f', strokeThickness: 4
        }).setOrigin(0.5).setDepth(y + 45);
        this.scene.tweens.add({
          targets: sprite, y: y - 24, duration: 520, yoyo: true, repeat: -1,
          ease: 'Sine.InOut'
        });
        this.drops.set(id, { id, quality: quality.id, x, y, sprite });
        this.api.events.emit('waifu:card-dropped', { id, waifuId: 'slime', quality: quality.id });
        return true;
      }

      collectNearby() {
        if (!this.active || !this.drops.size || !this.scene.player || !this.scene.player.active) return;
        for (const [id, drop] of Array.from(this.drops.entries())) {
          if (Math.hypot(this.scene.player.x - drop.x, this.scene.player.y - drop.y) > 48) continue;
          const current = this.api.progress.get('waifus') || {};
          const waifus = current && typeof current === 'object' ? { ...current } : {};
          const cards = Array.isArray(waifus.cards) ? waifus.cards.slice() : [];
          const card = {
            instanceId: id,
            waifuId: 'slime',
            quality: drop.quality,
            obtainedAt: Date.now()
          };
          cards.push(card);
          waifus.cards = cards;
          const result = this.api.progress.update('waifus', waifus);
          if (result === 'pending' || result === true) {
            if (drop.sprite && drop.sprite.destroy) drop.sprite.destroy();
            this.drops.delete(id);
            this.api.events.emit('waifu:card-collected', card);
          }
        }
      }

      destroy() {
        if (!this.active) return;
        this.active = false;
        this.api.events.off('monster:died', this.onDeath);
        if (this.scene && this.scene.events) {
          this.scene.events.off('update', this.onUpdate);
          this.scene.events.off('shutdown', this.onShutdown);
        }
        for (const drop of this.drops.values()) if (drop.sprite && drop.sprite.destroy) drop.sprite.destroy();
        this.drops.clear();
      }
    }

        });

        });

          background: '#211b17', color: '#f7eddb', font: '24px Arial'

      const sourceUpperObjects = layers[2].data;
      if (!Array.isArray(sourceGround) || !Array.isArray(sourceStructures) || !Array.isArray(sourceUpperObjects)) {

      }

          sourceStructures.length !== sourceWidth * sourceHeight ||
          sourceUpperObjects.length !== sourceWidth * sourceHeight) {

      }

      const bridgeIds = new Set([85, 86, 88]);
      const pickGrass = (x, y, salt = 17) => GRASS_TILES[Math.floor(stableNoise(x, y, salt) * GRASS_TILES.length)];
      const originalGround = Array.from({ length: sourceHeight }, () => Array(sourceWidth).fill(0));
      const originalStructures = Array.from({ length: sourceHeight }, () => Array(sourceWidth).fill(0));
      const originalUpperObjects = Array.from({ length: sourceHeight }, () => Array(sourceWidth).fill(0));

      for (let sy = 0; sy < sourceHeight; sy += 1) {
        for (let sx = 0; sx < sourceWidth; sx += 1) {
          const x = sx + mapOffset;
          const y = sy + mapOffset;
          const index = sy * sourceWidth + sx;

              const ny = sy + oy;

        worldHeight,
        legacyWorldHeight,
        mapOffset,
        sourceWidth,
        sourceHeight,

    // Build only the navigation/collision layer. This deliberately avoids

    // chunk during world startup.

          // definition or another terrain rule overlaps the same coordinates.
          if (isOceanCell(generator, x, y)) {

          if (isOriginalTile(x, y, generator)) {

            const sy = y - generator.mapOffset;
            const groundId = generator.originalGround[sy][sx];
            const structureId = generator.originalStructures[sy][sx];

      const originY = chunkY * size;

      const height = Math.min(size, generator.worldHeight - originY);

              (cliffMask[ly + 1][lx + 2] ? 2 : 0) |

        chunkX,
        chunkY,
        tileX: originX,
        tileY: originY,

        height,

        structures,

    function planChunkStreaming(chunkX, chunkY, columns, rows, radius, activeIds) {
      const keep = getChunkNeighborhood(chunkX, chunkY, columns, rows, radius).map(chunk => chunk.id);
      const keepSet = new Set(keep);
      const active = activeIds instanceof Set ? activeIds : new Set(activeIds || []);
      return {
        keep,
        load: keep.filter(id => !active.has(id)),
        unload: Array.from(active).filter(id => !keepSet.has(id))

    }

    function createGroundBase(scene, worldWidthTiles, worldHeightTiles, tileSize, color) {
      const worldWidthPixels = worldWidthTiles * tileSize;
      const worldHeightPixels = worldHeightTiles * tileSize;
      return scene.add.rectangle(
        worldWidthPixels / 2,
        worldHeightPixels / 2,
        worldWidthPixels,
        worldHeightPixels,

    function toPhaserTileLayer(tiledGids) {

    }

    function toCollisionLayer(blocked) {
