      const groundHas = (x, y) => inBounds(x, y) && ['floor', 'tree', 'rubble', 'pillar', 'gate'].includes(kind[y][x]);
      const ground = Array.from({ length: H }, () => Array(W).fill(0));
      for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
        const k = kind[y][x];
        if (k === 'tree') {
          ground[y][x] = GRASS_GIDS[Math.floor(dungeonHash(x, y, 47) * GRASS_GIDS.length)];
        } else if (k === 'floor' || k === 'rubble' || k === 'pillar' || k === 'gate') {
          if (k === 'floor' && dungeonHash(x, y, 49) < 0.22) {
            ground[y][x] = GRASS_GIDS[Math.floor(dungeonHash(x, y, 51) * GRASS_GIDS.length)];
          } else {
            const mask = (groundHas(x, y - 1) ? 1 : 0) | (groundHas(x + 1, y) ? 2 : 0) | (groundHas(x, y + 1) ? 4 : 0) | (groundHas(x - 1, y) ? 8 : 0);
            ground[y][x] = DIRT_BY_MASK[mask] || GRASS_GIDS[Math.floor(dungeonHash(x, y, 53) * GRASS_GIDS.length)];
          }
        }
      }
      // Paredes: quadro de pedra pela mascara dos vizinhos-parede (igual ao mundo).
      const walls = [];
      for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
        if (kind[y][x] !== 'wall') continue;
        const mask = (inBounds(x, y - 1) && kind[y - 1][x] === 'wall' ? 1 : 0) | (inBounds(x + 1, y) && kind[y][x + 1] === 'wall' ? 2 : 0) | (inBounds(x, y + 1) && kind[y + 1][x] === 'wall' ? 4 : 0) | (inBounds(x - 1, y) && kind[y][x - 1] === 'wall' ? 8 : 0);
        walls.push({ x, y, gid: CLIFF_BY_MASK[mask] || 137 });
      }
      const trees = [];
      for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
        if (kind[y][x] !== 'tree') continue;
        const h = dungeonHash(x, y, 55);
        trees.push({ x, y, gid: TREE_GIDS[Math.floor(h * TREE_GIDS.length)], scale: h < 0.20 ? 2 : h < 0.82 ? 3 : 4 });
      }
      const rubble = [];
      for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
        if (kind[y][x] !== 'rubble') continue;
        rubble.push({ x, y, gid: CLIFF_GIDS[Math.floor(dungeonHash(x, y, 57) * CLIFF_GIDS.length)] });
      }
      const pillars = DUNGEON_SCENE_CONFIG.pillars.map(p => ({ x: p.x, y: p.y, gid: 137 }));
      return {
        width: W, height: H, blocked, collision, ground, walls, trees, rubble, pillars,
        gates: rooms.filter(room => room.gate).map(room => ({ roomKey: room.key, tiles: room.gate.tiles.slice(), angle: room.gate.angle, opened: false })),
        gateTiles: gateTiles,
        arrivalTile: DUNGEON_SCENE_CONFIG.arrivalTile,
        exitTile: DUNGEON_SCENE_CONFIG.exitTile,
        bossTile: DUNGEON_SCENE_CONFIG.bossTile
      };
    }

    function dungeonFindPath(blocked, start, goal) {
      const H = blocked.length;
      const W = H ? blocked[0].length : 0;
      if (!W || !H) return [];
      if (start.x < 0 || start.x >= W || start.y < 0 || start.y >= H) return [];
      if (goal.x < 0 || goal.x >= W || goal.y < 0 || goal.y >= H) return [];
      if (blocked[goal.y][goal.x] !== 0) return [];
      const prev = Array.from({ length: H }, () => Array(W).fill(null));
      const queue = [{ x: start.x, y: start.y }];
      prev[start.y][start.x] = { x: -1, y: -1 };
      const dirs = [
        { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 },
        { x: 1, y: 1 }, { x: -1, y: 1 }, { x: 1, y: -1 }, { x: -1, y: -1 }
      ];
      while (queue.length) {
        const cur = queue.shift();
        if (cur.x === goal.x && cur.y === goal.y) break;
        for (const d of dirs) {
          const nx = cur.x + d.x;
          const ny = cur.y + d.y;
          if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
          if (blocked[ny][nx] !== 0 || prev[ny][nx]) continue;
          prev[ny][nx] = cur;
          queue.push({ x: nx, y: ny });
        }
      }
      if (!prev[goal.y][goal.x]) return [];
      const path = [];
      let cur = { x: goal.x, y: goal.y };
      while (!(cur.x === start.x && cur.y === start.y)) {
        path.unshift(cur);
        cur = prev[cur.y][cur.x];
        if (!cur || cur.x === -1) return [];
      }
      return path;
    }

    function dungeonNearestWalkable(blocked, x, y, radius = 3) {
      const H = blocked.length;
      const W = H ? blocked[0].length : 0;
      for (let r = 0; r <= radius; r += 1) {
        for (let dy = -r; dy <= r; dy += 1) {
          for (let dx = -r; dx <= r; dx += 1) {
            const nx = x + dx;
            const ny = y + dy;
            if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
            if (blocked[ny][nx] === 0) return { x: nx, y: ny };
          }
        }
      }
      return null;
    }

    class DungeonScene extends Phaser.Scene {
      constructor() {
        super('DungeonScene');
        this.layout = null;
        this.path = [];
        this.monsters = [];
        this.gates = [];
        this.exiting = false;
        this.facingRow = 0;
        this.nextPlayerAttackAt = 0;
        this.slamTelegraph = null;
        this.slamPending = null;
        this.nextBossSlamAt = 0;
        this.bossEnraged = false;
        this.bossGateLocked = false;
        this.bossGate = null;
        this.toastText = null;
        this.eventBus = null;
        this.statusSystem = null;
        this.saveSystem = null;
      }

      create(data) {
        // Estado POR VISITA: a cena e reutilizada entre entradas (o construtor
        // so roda uma vez). Sem zerar aqui, a 2a entrada nascia travada
        // (exiting=true da saida anterior) ou com monstros/caminho da visita
        // anterior (sprites ja destruidos). E por isso o bug era "as vezes".
        this.exiting = false;
        this.path = [];
        this.monsters = [];
        this.gates = [];
        this.bossRecord = null;
        this.nextPlayerAttackAt = 0;
        this.slamTelegraph = null;
        this.slamPending = null;
        this.nextBossSlamAt = 0;
        this.bossEnraged = false;
        this.bossGateLocked = false;
        this.bossGate = null;
        this.facingRow = 0;
        this.toastText = null;
        this.eventBus = GAME_RUNTIME.eventBus;
        this.statusSystem = GAME_RUNTIME.statusSystem;
        this.saveSystem = GAME_RUNTIME.saveSystem;
        this.layout = buildDungeonLayout();
        this.hideOverworldHud();
        this.events.once('shutdown', () => this.restoreOverworldHud());
        this.cameras.main.setBackgroundColor('#1d2416');
        this.physics.world.setBounds(0, 0, this.layout.width * TILE_SIZE, this.layout.height * TILE_SIZE);
        this.input.mouse.disableContextMenu();
        this.buildDungeonVisuals();
        this.buildCollisionLayer();
        this.buildGates();
        this.buildLabels();
        this.buildPlayer();
        this.buildMonsters();
        this.buildHud();
        this.physics.add.collider(this.player, this.collisionLayer);
        this.physics.add.collider(this.player, this.gateBodies);
        for (const monster of this.monsters) this.physics.add.collider(monster.sprite, this.collisionLayer);
        // V107: arrastar move a CAMERA (olhar para o lado); toque move o jogador.
        this.dungeonPan = { active: false, panning: false, startX: 0, startY: 0, lastX: 0, lastY: 0 };
        this.input.on('pointerdown', this.onDungeonPointerDown, this);
        this.input.on('pointermove', this.onDungeonPointerMove, this);
        this.input.on('pointerup', this.onDungeonPointerUp, this);
      }

      hideOverworldHud() {
        const hide = (id) => { const el = document.getElementById(id); if (el) el.style.display = 'none'; };
        hide('conquistador-main-menu');
        hide('conquistador-minimap');
        // V106: a silhueta do status FICA visivel na dungeon (abre o status).
      }

      restoreOverworldHud() {
        const show = (id, display) => { const el = document.getElementById(id); if (el) el.style.display = display; };
        show('conquistador-main-menu', 'flex');
        show('conquistador-minimap', 'block');
        show('conquistador-player-status-entry', 'flex');
      }

      buildDungeonVisuals() {
        // Chão: tilemap com GIDs REAIS do tile (caminho de terra, grama).
        // Fora das salas/corredores nao ha tile: o vazio fica PRETO, como na referencia.
        // V132 — chão da dungeon em canvas (terra/grama dos novos assets). 0 = vazio preto.
        {
          const gh = this.layout.ground.length, gw = gh ? this.layout.ground[0].length : 0;
          const key = 'v132-dungeon-ground';
          if (this.textures.exists(key)) this.textures.remove(key);
          const tex = this.textures.createCanvas(key, gw * TILE_SIZE, gh * TILE_SIZE);
          const ctx = tex.getContext();
          for (let y = 0; y < gh; y += 1) for (let x = 0; x < gw; x += 1) {
            const gid = this.layout.ground[y][x]; if (!gid) continue;
            const tk = groundTextureForDungeonTile(gid, x, y); // V140 — mesma regra da V134, agora numa unica funcao.
            const img = this.textures.get(tk).getSourceImage();
            ctx.drawImage(img, (x * TILE_SIZE) % img.width, (y * TILE_SIZE) % img.height, TILE_SIZE, TILE_SIZE, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          }
          tex.refresh();
          this.add.image(0, 0, key).setOrigin(0, 0).setDepth(0);
        }
        // Paredes: imagens de PEDRA (penhasco) com profundidade, igual ao mundo.
        for (const wall of this.layout.walls) {
          const img = this.add.image((wall.x + 0.5) * TILE_SIZE, (wall.y + 0.5) * TILE_SIZE, 'v132-stone').setDisplaySize(TILE_SIZE, TILE_SIZE);
          img.setDepth((wall.y + 1) * TILE_SIZE);
        }
        // Pilares: blocos de pedra nos flancos das portas.
        for (const pillar of this.layout.pillars) {
          const img = this.add.image((pillar.x + 0.5) * TILE_SIZE, (pillar.y + 0.5) * TILE_SIZE, 'v132-stone').setDisplaySize(TILE_SIZE, TILE_SIZE);
          img.setDepth((pillar.y + 1) * TILE_SIZE);
        }
        // Entulho: pedacos de parede caida (pedra), nao retangulo desenhado.
        for (const chunk of this.layout.rubble) {
          const img = this.add.image((chunk.x + 0.5) * TILE_SIZE, (chunk.y + 0.5) * TILE_SIZE, 'v132-stone').setDisplaySize(TILE_SIZE, TILE_SIZE);
          img.setScale(0.9);
          img.setDepth((chunk.y + 1) * TILE_SIZE);
        }
        // Arvores: os mesmos sprites do mundo, com escala e profundidade.
        for (const tree of this.layout.trees) {
          const img = this.add.image((tree.x + 0.5) * TILE_SIZE, (tree.y + 1) * TILE_SIZE, 'v132-tree-leaf');
          img.setOrigin(0.5, 1);
          img.setScale(tree.scale * 0.12);
          img.setDepth((tree.y + 1) * TILE_SIZE + 1);
        }
      }

      buildCollisionLayer() {
        if (!this.textures.exists('blank-tile')) { const t = this.textures.createCanvas('blank-tile', TILE_SIZE, TILE_SIZE); const c = t.getContext(); c.fillStyle = '#ffffff'; c.fillRect(0, 0, TILE_SIZE, TILE_SIZE); t.refresh(); }
        const data = core.toCollisionLayer(this.layout.collision);
        const map = this.make.tilemap({ data, tileWidth: TILE_SIZE, tileHeight: TILE_SIZE, insertNull: true });
        const tile = map.addTilesetImage('blank', 'blank-tile', TILE_SIZE, TILE_SIZE, 0, 0);
        const layer = map.createLayer(0, tile, 0, 0);
        layer.setAlpha(0); layer.setDepth(10000);
        map.setCollision(1, true, true, layer, true);
        this.collisionLayer = layer;
      }

      buildGates() {
        this.gateBodies = [];
        this.gateLabels = [];
        let gateIndex = 0;
        for (const gate of this.layout.gates) {
          const bodies = [];
          for (const t of gate.tiles) {
            const rect = this.add.rectangle(
              (t.x + 0.5) * TILE_SIZE, (t.y + 0.5) * TILE_SIZE, TILE_SIZE, TILE_SIZE, 0x6b4423, 0
            );
            rect.setDepth(50);
            this.physics.add.existing(rect, true);
            bodies.push(rect);
            this.gateBodies.push(rect);
          }
          // Tronco caido DE VERDADE: sprite de arvore deitado sobre o corredor.
          const cx = (gate.tiles.reduce((sum, t) => sum + t.x, 0) / gate.tiles.length + 0.5) * TILE_SIZE;
          const cy = (gate.tiles.reduce((sum, t) => sum + t.y, 0) / gate.tiles.length + 0.5) * TILE_SIZE;
          const treeGid = gateIndex === 0 ? 207 : 261;
          const tree = this.add.image(cx, cy, 'v132-tree-leaf');
          tree.setOrigin(0.5, 0.5);
          tree.setScale(0.44);
          tree.setAngle(gate.angle);
          tree.setDepth((Math.max(...gate.tiles.map(t => t.y)) + 1) * TILE_SIZE);
          gate.treeImage = tree;
          const label = this.add.text(cx, cy - 22, '🪵 TRONCO CAÍDO', {
            fontFamily: 'system-ui, sans-serif', fontSize: '8px', fontStyle: 'bold', color: '#ffe9b0',
            backgroundColor: 'rgba(20,14,8,.72)', padding: { x: 4, y: 2 }, align: 'center'
          }).setOrigin(0.5, 1).setDepth(200);
          this.gateLabels.push({ gate, bodies, label });
          gate.bodies = bodies;
          gate.label = label;
          gateIndex += 1;
        }
      }

      buildLabels() {
        // V106: sem nome flutuante nas salas (SALA 1/2/3). So SAIDA e TRONCO CAIDO.
        const exit = DUNGEON_SCENE_CONFIG.exitTile;
        const exitText = this.add.text(
          (exit.x + 0.5) * TILE_SIZE, (exit.y + 0.5) * TILE_SIZE - 14, '🚪 SAÍDA', {
            fontFamily: 'system-ui, sans-serif', fontSize: '9px', fontStyle: 'bold', color: '#ffe9b0',
            backgroundColor: 'rgba(20,14,8,.72)', padding: { x: 5, y: 3 }, align: 'center'
          }
        ).setOrigin(0.5, 1).setDepth(200);
        exitText.setInteractive({ useHandCursor: true });
        exitText.on('pointerdown', () => this.exitDungeon(false));
      }

      tileToWorld(tile) {
        return {
          x: (tile.x + 0.5) * TILE_SIZE,
          y: (tile.y + 0.5) * TILE_SIZE - PLAYER_BODY_CENTER_OFFSET_Y
        };
      }

      playerBodyTile() {
        return {
          x: Math.floor(this.player.x / TILE_SIZE),
          y: Math.floor((this.player.y + PLAYER_BODY_CENTER_OFFSET_Y) / TILE_SIZE)
        };
      }

      roomKeyOfTile(tile) {
        for (const room of DUNGEON_SCENE_CONFIG.rooms) {
          if (tile.x >= room.rect.x0 && tile.x <= room.rect.x1 &&
              tile.y >= room.rect.y0 && tile.y <= room.rect.y1) return room.key;
        }
        return null;
      }

      buildPlayer() {
        const spawn = this.tileToWorld(DUNGEON_SCENE_CONFIG.arrivalTile);
        this.player = this.physics.add.sprite(spawn.x, spawn.y, 'hero', 0);
        this.textures.get('hero').setFilter(Phaser.Textures.FilterMode.LINEAR);
        this.player.setScale(1.12);
        this.player.setOrigin(PLAYER_ORIGIN_X, PLAYER_ORIGIN_Y);
        this.player.body.setSize(PLAYER_BODY_WIDTH, PLAYER_BODY_HEIGHT);
        this.player.body.setOffset(PLAYER_BODY_OFFSET_X, PLAYER_BODY_OFFSET_Y);
        this.player.setCollideWorldBounds(true);
        this.player.setDepth(spawn.y + 12);
        this.player.anims.play('idle-0');
        const camera = this.cameras.main;
        camera.setBounds(0, 0, this.layout.width * TILE_SIZE, this.layout.height * TILE_SIZE);
        camera.centerOn(this.player.x, this.player.y);
        camera.setLerp(0.12, 0.12);
        camera.startFollow(this.player, true, 0.12, 0.12);
      }

      // V109: o boss usa o sprite novo (coroa, juba branca, colar de presas).
      // Se a textura ainda nao carregou, cai no macaco antigo.
      bossTextureKey() {
        const key = 'conquistador-boss-brutamonte-v1';
        return this.textures.exists(key) ? key : this.monkeyTextureKey();
      }

      monkeyTextureKey() {
        const key = 'conquistador-monster-monkey-v2';
        if (this.textures.exists(key)) return key;
        if (!this.textures.exists('dungeon-monkey-fallback')) {
          const g = this.make.graphics({ x: 0, y: 0, add: false });
          g.fillStyle(0x8a5a2b, 1); g.fillCircle(16, 16, 14);
          g.fillStyle(0x2b1a0e, 1); g.fillCircle(12, 12, 2);
          g.fillCircle(20, 12, 2);
          g.generateTexture('dungeon-monkey-fallback', 32, 32);
          g.destroy();
        }
        return 'dungeon-monkey-fallback';
      }

      buildMonsters() {
        const base = (GAME_RUNTIME.data.MONSTERS && GAME_RUNTIME.data.MONSTERS.monkey) || {};
        const monkeyStats = (level) => {
          const hp = Number(base.hp) || 30;
          const atk = Number(base.damage ?? base.attack) || 6;
          const def = Number(base.defense) || 0;
          const xp = Number(base.xp) || 10;
          if (level === 2) return { hp: Math.max(1, Math.round(hp * 1.5)), attack: Math.max(0, Math.round(atk * 1.25)), defense: def, xp: Math.max(0, Math.round(xp * 1.5)) };
          if (level === 3) return { hp: Math.max(1, Math.round(hp * 2.2)), attack: Math.max(0, Math.round(atk * 1.5)), defense: def + 1, xp: Math.max(0, Math.round(xp * 2)) };
          return { hp, attack: atk, defense: def, xp };
        };
        const key = this.monkeyTextureKey();
        let counter = 0;
        const spawnMonster = (tile, roomKey, stats, display, isBoss, textureKey = key) => {
          counter += 1;
          const id = 'dungeon-monster-' + counter;
          const pos = { x: (tile.x + 0.5) * TILE_SIZE, y: (tile.y + 0.5) * TILE_SIZE };
          const sprite = this.physics.add.sprite(pos.x, pos.y, textureKey, 0);
          sprite.setDisplaySize(display.width, display.height);
          sprite.setOrigin(0.5, 0.86);
          sprite.setDepth(pos.y + 10);
          // V113: o boss usa corpo proprio. Antes ele usava o mesmo corpo
          // dos macaquinhos (18x12, offset 6,9) num sprite de 58x58: o corpo
          // ficava ~1 tile ACIMA de onde o sprite parecia estar, entao o boss
          // travava no muro/na linha de arvores do topo da sala 3 e parecia
          // "nao perseguir na parte de cima". Agora o corpo fica nos pes.
          if (isBoss) {
            sprite.body.setSize(26, 16);
            sprite.body.setOffset(16, 42);
          } else {
            sprite.body.setSize(18, 12);
            sprite.body.setOffset(6, 9);
          }
          sprite.setCollideWorldBounds(true);
          const label = this.add.text(pos.x, pos.y - display.height - 2, isBoss ? 'BRUTAMONTE' : String(stats.level || ''), {
            fontFamily: 'system-ui, sans-serif', fontSize: isBoss ? '10px' : '8px',
            fontStyle: isBoss ? 'bold' : 'normal', color: isBoss ? '#ffb0b0' : '#f1f4ed',
            stroke: '#17251b', strokeThickness: 2, align: 'center'
          }).setOrigin(0.5, 1).setDepth(pos.y + 30);
          const hpBarWidth = Math.max(30, display.width + 6);
          const hpBarBg = this.add.rectangle(pos.x, pos.y + 6, hpBarWidth, 5, 0x1a0f0f, 1);
          hpBarBg.setDepth(pos.y + 31);
          hpBarBg.setStrokeStyle(1, 0x000000, 0.85);
          const hpBarFill = this.add.rectangle(pos.x - hpBarWidth / 2, pos.y + 6, hpBarWidth, 3, 0x3ddc5f, 1);
          hpBarFill.setOrigin(0, 0.5);
          hpBarFill.setDepth(pos.y + 32);
          const record = {
            id, roomKey, level: stats.level || 1, isBoss: Boolean(isBoss),
            monsterId: 'monkey', name: isBoss ? DUNGEON_SCENE_CONFIG.boss.name : 'Macaco',
            hp: stats.hp, maxHp: stats.hp, attack: stats.attack, defense: stats.defense,
            xpReward: stats.xp, speed: stats.speed || 50, attackSpeed: stats.attackSpeed || 1,
            sprite, label, hpBarBg, hpBarFill, hpBarWidth, alive: true, nextAttackAt: 0, hasAggro: false
          };
          this.monsters.push(record);
          if (isBoss) this.bossRecord = record;
          return record;
        };
        for (const room of DUNGEON_SCENE_CONFIG.rooms) {
          for (const m of room.monkeys) {
            const stats = monkeyStats(m.level);
            spawnMonster({ x: m.x, y: m.y }, room.key, {
              ...stats, level: m.level, speed: Number(base.speed) || 50,
              attackSpeed: Number(base.attackSpeed) || 1
            }, { width: 30, height: 24 }, false);
          }
        }
        const bossCfg = DUNGEON_SCENE_CONFIG.boss;
        spawnMonster(DUNGEON_SCENE_CONFIG.bossTile, 'room3', {
          hp: bossCfg.hp, attack: bossCfg.attack, defense: bossCfg.defense,
          xp: bossCfg.xp, level: bossCfg.level, speed: bossCfg.speed,
          attackSpeed: bossCfg.attackSpeed
        }, { width: bossCfg.displayWidth, height: bossCfg.displayHeight }, true, this.bossTextureKey());
      }

      buildHud() {
        // Sem titulo e sem barra de HP do jogador: canto superior limpo.
        // A barra do chefe (BRUTAMONTE) continua: ela e do chefe, nao do jogador.
        this.bossBarBg = this.add.rectangle(this.cameras.main.width / 2 - 64, 8, 128, 12, 0x1a0f0f, 1);
        this.bossBarBg.setOrigin(0, 0).setScrollFactor(0).setDepth(1000).setVisible(false);
        this.bossBarBg.setStrokeStyle(1, 0x000000, 0.85);
        this.bossBarFill = this.add.rectangle(this.cameras.main.width / 2 - 63, 9, 126, 10, 0xd43a3a, 1);
        this.bossBarFill.setOrigin(0, 0.5).setScrollFactor(0).setDepth(1001).setVisible(false);
        this.bossBarLabel = this.add.text(this.cameras.main.width / 2, 8, 'BRUTAMONTE', {
          fontFamily: 'system-ui, sans-serif', fontSize: '9px', fontStyle: 'bold', color: '#ffffff', align: 'center'
        }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(1002).setVisible(false);
        const exitBtn = this.add.text(this.cameras.main.width - 8, 8, '🚪 SAIR', {
          fontFamily: 'system-ui, sans-serif', fontSize: '11px', fontStyle: 'bold', color: '#ffe9b0',
          backgroundColor: 'rgba(20,14,8,.8)', padding: { x: 8, y: 5 }
        }).setOrigin(1, 0).setScrollFactor(0).setDepth(1000);
        exitBtn.setInteractive({ useHandCursor: true });
        exitBtn.on('pointerdown', () => this.exitDungeon(false));
        this.refreshHud();
      }

      refreshHud() {
        const boss = this.bossRecord;
        if (boss && boss.alive && boss.hp < boss.maxHp) {
          this.bossBarBg.setVisible(true);
          this.bossBarFill.setVisible(true);
          this.bossBarLabel.setVisible(true);
          this.bossBarFill.scaleX = Math.max(0, Math.min(1, boss.hp / boss.maxHp));
        } else {
          // V111: antes a barra so aparecia, nunca sumia — depois de matar
          // o boss, nome + barra grande ficavam la em cima pra sempre.
          this.bossBarBg.setVisible(false);
          this.bossBarFill.setVisible(false);
          this.bossBarLabel.setVisible(false);
        }
      }

      showToast(message, duration = 2200) {
        if (this.toastText && this.toastText.active) {
          this.toastText.destroy();
        }
        this.toastText = this.add.text(
          this.cameras.main.width / 2, 56, message, {
            fontFamily: 'Georgia, serif', fontSize: '12px', fontStyle: 'bold', color: '#ffe9b0',
            backgroundColor: 'rgba(20,14,8,.8)', padding: { x: 10, y: 6 }, align: 'center'
          }
        ).setOrigin(0.5, 0).setScrollFactor(0).setDepth(1100);
        this.tweens.add({
          targets: this.toastText, alpha: 0, delay: Math.max(0, duration - 500),
          duration: 500, onComplete: () => { if (this.toastText && this.toastText.active) this.toastText.destroy(); }
        });
      }

      damageNumber(monster, damage) {
        const text = this.add.text(monster.sprite.x, monster.sprite.y - 26, '-' + damage, {
          fontFamily: 'system-ui, sans-serif', fontSize: '11px', fontStyle: 'bold', color: '#ffe066',
          stroke: '#201a08', strokeThickness: 3
        }).setOrigin(0.5, 1).setDepth(300);
        this.tweens.add({
          targets: text, y: text.y - 14, alpha: 0, duration: 700,
          onComplete: () => { if (text.active) text.destroy(); }
        });
      }

      // V107: camera livre. Arrastar > 12px desgruda a camera do jogador e
      // move a vista; soltar sem arrastar volta a seguir e move o jogador.
      onDungeonPointerDown(pointer) {
        if (this.exiting || !this.player) return;
        this.dungeonPan.active = true;
        this.dungeonPan.panning = false;
        this.dungeonPan.startX = pointer.x;
        this.dungeonPan.startY = pointer.y;
        this.dungeonPan.lastX = pointer.x;
        this.dungeonPan.lastY = pointer.y;
      }

      onDungeonPointerMove(pointer) {
        if (!this.dungeonPan.active || !pointer.isDown || this.exiting || !this.player) return;
        const dx = pointer.x - this.dungeonPan.lastX;
        const dy = pointer.y - this.dungeonPan.lastY;
        this.dungeonPan.lastX = pointer.x;
        this.dungeonPan.lastY = pointer.y;
        if (!this.dungeonPan.panning) {
          if (Math.hypot(pointer.x - this.dungeonPan.startX, pointer.y - this.dungeonPan.startY) < 12) return;
          this.dungeonPan.panning = true;
          this.cameras.main.stopFollow();
        }
        const cam = this.cameras.main;
        const zoom = cam.zoom || 1;
        cam.scrollX -= dx / zoom;
        cam.scrollY -= dy / zoom;
      }

      onDungeonPointerUp(pointer) {
        if (!this.dungeonPan.active) return;
        const wasPanning = this.dungeonPan.panning;
        this.dungeonPan.active = false;
        this.dungeonPan.panning = false;
        if (wasPanning || this.exiting || !this.player) return;
        // Toque (sem arrastar): camera volta a seguir o jogador e ele anda.
        this.cameras.main.startFollow(this.player, true, 0.12, 0.12);
        this.onDungeonTap(pointer);
      }

      onDungeonTap(pointer) {
        if (this.exiting || !this.player) return;
        const tile = {
          x: Math.floor(pointer.worldX / TILE_SIZE),
          y: Math.floor(pointer.worldY / TILE_SIZE)
        };
        if (tile.x < 0 || tile.x >= this.layout.width || tile.y < 0 || tile.y >= this.layout.height) return;
        let goal = tile;
        if (this.layout.blocked[tile.y][tile.x] !== 0) {
          if (this.layout.gateTiles.has(tile.x + ',' + tile.y)) {
            this.showToast('🪵 O tronco caído bloqueia a passagem.', 1800);
          }
          goal = dungeonNearestWalkable(this.layout.blocked, tile.x, tile.y);
          if (!goal) return;
        }
        const start = this.playerBodyTile();
        const path = dungeonFindPath(this.layout.blocked, start, goal);
        if (path.length) this.path = path;
      }

      updatePlayerMovement() {
        if (!this.path.length) {
          this.player.body.setVelocity(0, 0);
          this.player.anims.play('idle-' + this.facingRow, true);
          return;
        }
        const target = this.path[0];
        const dest = this.tileToWorld(target);
        const dx = dest.x - this.player.x;
        const dy = dest.y - this.player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 5) {
          this.path.shift();
          if (!this.path.length) {
            this.player.body.setVelocity(0, 0);
            this.player.anims.play('idle-' + this.facingRow, true);
          }
          return;
        }
        const speed = this.statusSystem.getStat('player', 'moveSpeed') || 110;
        this.player.body.setVelocity((dx / dist) * speed, (dy / dist) * speed);
        this.player.setDepth(this.player.y + 12);
        this.facingRow = core.directionRow(dx, dy);
        this.player.anims.play('walk-' + this.facingRow, true);
      }

      updatePlayerAttack(now) {
        if (now < this.nextPlayerAttackAt) return;
        const playerRoom = this.roomKeyOfTile(this.playerBodyTile());
        let nearest = null;
        let nearestDist = Infinity;
        for (const monster of this.monsters) {
          if (!monster.alive || monster.roomKey !== playerRoom) continue;
          const dist = Math.hypot(monster.sprite.x - this.player.x, monster.sprite.y - this.player.y);
          if (dist < nearestDist) { nearestDist = dist; nearest = monster; }
        }
        // V109: Chuva de Sinos (Macaca) amplia o alcance do ataque basico na dungeon.
        const buffs = window.CONQUISTADOR_WAIFU_BUFFS;
        const ranged = buffs && Date.now() < (buffs.monkeyRangedUntil || 0);
        if (!nearest || nearestDist > (ranged ? 120 : 52)) return;
        const attack = this.statusSystem.getStat('player', 'attack') ?? 1;
        const penetration = this.statusSystem.getStat('player', 'penetration') ?? 0;
        const damage = Math.max(1, Math.round(attack - Math.max(0, nearest.defense - penetration)));
        nearest.hp = Math.max(0, nearest.hp - damage);
        this.damageNumber(nearest, damage);
        nearest.sprite.setTintFill(0xffffff);
        this.time.delayedCall(80, () => { if (nearest.sprite.active) nearest.sprite.clearTint(); });
        const attackSpeed = this.statusSystem.getStat('player', 'attackSpeed') || 1;
        this.nextPlayerAttackAt = now + 1000 / Math.max(0.1, attackSpeed);
        if (nearest.hp <= 0) this.killMonster(nearest);
      }

      updateMonsters(now) {
        const playerRoom = this.roomKeyOfTile(this.playerBodyTile());
        const playerDef = this.statusSystem.getStat('player', 'defense') ?? 0;
        for (const monster of this.monsters) {
          if (!monster.alive) continue;
          // V141 — CULLING (dungeon): fora da câmera + margem = dorme
          // ANTES de depth/rótulo/barra. Sala continua sendo território
          // (cheque abaixo), mas monstro fora da tela nem custa rótulo.
          // Boss com agro travado NÃO dorme: updateBossSlam() é separado
          // e o agro da sala 3 continua valendo ao acordar.
          {
            const cam = this.cameras && this.cameras.main;
            const view = cam && cam.worldView;
            const m = 96;
            const culled = Boolean(view) && monster.sprite &&
              (monster.sprite.x < view.x - m || monster.sprite.x > view.x + view.width + m ||
               monster.sprite.y < view.y - m || monster.sprite.y > view.y + view.height + m);
            if (culled && !(monster.isBoss && monster.hasAggro)) {
              if (monster._path && monster._path.length) monster._path = [];
              monster.sprite.body.setVelocity(0, 0);
              continue;
            }
          }
          // V114: agro do boss NAO solta mais. Pegou o agro (jogador na
          // sala 3) = persegue ate morrer. Antes, o tile do corpo do
          // jogador piscava pro corredor na beira da boca e o boss parava.
          if (monster.isBoss && playerRoom === 'room3') monster.hasAggro = true;
          monster.sprite.setDepth(monster.sprite.y + 10);
          monster.label.setDepth(monster.sprite.y + 30);
          monster.hpBarBg.setDepth(monster.sprite.y + 31);
          monster.hpBarFill.setDepth(monster.sprite.y + 32);
          monster.label.setPosition(monster.sprite.x, monster.sprite.y - monster.sprite.displayHeight - 2);
          monster.hpBarBg.setPosition(monster.sprite.x, monster.sprite.y + 6);
          monster.hpBarFill.setPosition(monster.sprite.x - monster.hpBarWidth / 2, monster.sprite.y + 6);
          monster.hpBarFill.scaleX = Math.max(0, Math.min(1, monster.hp / monster.maxHp));
          // Cada sala e um territorio: monstro so age dentro da propria sala.
          // Assim ninguem atravessa parede nem ataca atraves do tronco.
          if (monster.roomKey !== playerRoom && !(monster.isBoss && monster.hasAggro)) {
            monster.sprite.body.setVelocity(0, 0);
            continue;
          }
          const dx = this.player.x - monster.sprite.x;
          const dy = this.player.y - monster.sprite.y;
          const dist = Math.hypot(dx, dy);
          // V111: o boss persegue na sala inteira (sem o limite de 260px) —
          // parado longe, ele virava alvo parado de skill.
          if (dist > 260 && !monster.isBoss) {
            monster.sprite.body.setVelocity(0, 0);
            continue;
          }
          if (dist > 30) {
            // V112: perseguicao por CAMINHO (BFS no grid), nao cega. Antes o
            // monstro empurrava a linha de arvores pra sempre: deslizava de
            // lado mas nao saia de la. E um macaco travado e inalcançavel
            // deixava o portao da sala 2 fechado pra sempre — o jogo conta
            // macacos VIVOS, nao macacos visiveis. O caminho contorna as
            // arvores pelas brechas: o monstro sempre chega no jogador.
            const mTile = { x: Math.floor(monster.sprite.x / TILE_SIZE), y: Math.floor(monster.sprite.y / TILE_SIZE) };
            const pTile = this.playerBodyTile();
            if (!monster._path || !monster._path.length || now >= (monster._repathAt || 0)) {
              const found = (typeof dungeonFindPath === 'function') ? dungeonFindPath(this.layout.blocked, mTile, pTile) : [];
              monster._path = found || [];
              monster._repathAt = now + 600;
            }
            if (monster._path.length) {
              const wp = monster._path[0];
              const wx = (wp.x + 0.5) * TILE_SIZE, wy = (wp.y + 0.5) * TILE_SIZE - 3;
              const wdx = wx - monster.sprite.x, wdy = wy - monster.sprite.y;
              const wdist = Math.hypot(wdx, wdy);
              if (wdist < 6) { monster._path.shift(); monster.sprite.body.setVelocity(0, 0); }
              else monster.sprite.body.setVelocity((wdx / wdist) * monster.speed, (wdy / wdist) * monster.speed);
            } else {
              // Sem caminho (nao acontece numa sala conectada): perseguição direta.
              monster.sprite.body.setVelocity((dx / dist) * monster.speed, (dy / dist) * monster.speed);
            }
            continue;
          }
          monster.sprite.body.setVelocity(0, 0);
          if (now < monster.nextAttackAt) continue;
          // V109: Ensaboado (Rata) bloqueia o dano dos monstros da dungeon.
          const buffs = window.CONQUISTADOR_WAIFU_BUFFS;
          const immune = buffs && Date.now() < (buffs.ratImmuneUntil || 0);
          const damage = immune ? 0 : Math.max(1, Math.round(monster.attack - Math.max(0, playerDef - 0)));
          if (damage > 0) {
            this.statusSystem.applyDamage('player', damage, monster.id);
            this.cameras.main.shake(80, 0.006);
          }
          monster.nextAttackAt = now + 1000 / Math.max(0.1, monster.attackSpeed);
        }
      }

      updateBossSlam(now) {
        const boss = this.bossRecord;
        if (!boss || !boss.alive) return;
        if (!this.bossEnraged && boss.hp < boss.maxHp * (DUNGEON_SCENE_CONFIG.boss.slam.enrageBelowHpPercent / 100)) {
          this.bossEnraged = true;
          boss.sprite.setTint(0xff7777);
          this.showToast('🔴 BRUTAMONTE FICOU FURIOSO!', 2400);
        }
        // V114: com o agro travado, o boss casta mesmo que o tile do corpo
        // do jogador pisque pro corredor na beira da boca (o alcance do
        // cast ja limita: so dispara a 3.5 tiles).
        if (this.roomKeyOfTile(this.playerBodyTile()) !== 'room3' && !boss.hasAggro) return;
        const slam = DUNGEON_SCENE_CONFIG.boss.slam;
        if (this.slamPending) {
          // V114: o circulo SEGUE o boss durante o cast. Antes ele ficava
          // parado onde o cast comecou e o boss saia de dentro dele — o
          // dano ja era na posicao atual do boss, mas o visual mentia.
          if (this.slamTelegraph && this.slamTelegraph.active) {
            this.slamTelegraph.x = boss.sprite.x;
            this.slamTelegraph.y = boss.sprite.y;
          }
          if (now < this.slamPending.at) return;
          const dist = Math.hypot(this.player.x - boss.sprite.x, this.player.y - boss.sprite.y);
          if (this.slamTelegraph && this.slamTelegraph.active) this.slamTelegraph.destroy();
          this.slamTelegraph = null;
          this.slamPending = null;
          if (dist <= slam.radiusTiles * TILE_SIZE) {
            // V109: Ensaboado tambem bloqueia a Pancada Sismica.
            const buffs = window.CONQUISTADOR_WAIFU_BUFFS;
            const immune = buffs && Date.now() < (buffs.ratImmuneUntil || 0);
            if (!immune) this.statusSystem.applyDamage('player', slam.damage, boss.id);
            this.cameras.main.shake(160, 0.02);
            this.showToast('💥 PANCADA SÍSMICA!', 1400);
          }
          this.nextBossSlamAt = now + (this.bossEnraged ? slam.enrageCooldownMs : slam.cooldownMs);
          return;
        }
        if (now < this.nextBossSlamAt) return;
        const dist = Math.hypot(this.player.x - boss.sprite.x, this.player.y - boss.sprite.y);
        if (dist > slam.triggerTiles * TILE_SIZE) return;
        // Preparacao visivel: circulo vermelho no chao por 900ms.
        this.slamTelegraph = this.add.circle(
          boss.sprite.x, boss.sprite.y, slam.radiusTiles * TILE_SIZE, 0xff2222, 0.32
        );
        this.slamTelegraph.setStrokeStyle(2, 0xff2222, 0.9);
        this.slamTelegraph.setDepth(150);
        this.slamPending = { at: now + slam.windupMs };
      }

      killMonster(monster) {
        if (!monster || !monster.alive) return;
        monster.alive = false;
        monster.sprite.body.setVelocity(0, 0);
        const tile = {
          x: Math.floor(monster.sprite.x / TILE_SIZE),
          y: Math.floor(monster.sprite.y / TILE_SIZE)
        };
        // XP pelo mesmo evento que o mundo usa — LevelSystem e o unico ouvinte.
        this.eventBus.emit('entity:die', {
          entityId: monster.id, killerId: 'player', monsterId: monster.monsterId,
          level: monster.level, xp: monster.xpReward, tile
        });
        this.grantDrop(monster);
        this.tweens.add({
          targets: monster.sprite, alpha: 0, scaleX: 0.35, scaleY: 0.35, duration: 220,
          onComplete: () => {
            if (monster.sprite.active) monster.sprite.destroy();
            if (monster.label.active) monster.label.destroy();
            if (monster.hpBarBg.active) monster.hpBarBg.destroy();
            if (monster.hpBarFill.active) monster.hpBarFill.destroy();
          }
        });
        if (monster.isBoss) {
          // V113: matar o boss castando deixava a marca da skill pra sempre —
          // o updateBossSlam retorna cedo com o boss morto e ninguem limpava.
          this.clearBossSlam();
          this.unlockBossRoom();
          this.recordBossKill();
          this.showToast('🏆 BRUTAMONTE DERROTADO!', 3200);
          return;
        }
        this.checkRoomCleared(monster.roomKey);
      }

      grantDrop(monster) {
        try {
          const progress = this.saveSystem.getProgressData() || {};
          const items = Array.isArray(progress.items) ? progress.items.map(item => ({ ...item })) : [];
          const dropId = 'monkey_fur';
          const existing = items.find(item => item && item.id === dropId);
          if (existing) existing.quantity = Math.max(0, Number(existing.quantity) || 0) + 1;
          else items.push({ id: dropId, quantity: 1 });
          this.eventBus.emit('progress:changed', { section: 'items', data: items });
          const name = (GAME_RUNTIME.data.ITEMS && GAME_RUNTIME.data.ITEMS[dropId] && GAME_RUNTIME.data.ITEMS[dropId].name) || dropId;
          this.showToast(name + ' +1', 1800);
        } catch (error) { /* O drop nunca pode quebrar a dungeon. */ }
      }

      recordBossKill() {
        try {
          const progress = this.saveSystem.getProgressData() || {};
          const dungeons = (progress.dungeons && typeof progress.dungeons === 'object')
            ? { ...progress.dungeons } : {};
          const prev = dungeons['cidade-abandonada'] || {};
          dungeons['cidade-abandonada'] = {
            cleared: true,
            bossKills: (Number(prev.bossKills) || 0) + 1
          };
          this.eventBus.emit('progress:changed', { section: 'dungeons', data: dungeons });
        } catch (error) { /* O progresso nunca pode quebrar a dungeon. */ }
      }

      checkRoomCleared(roomKey) {
        const gate = this.layout.gates.find(g => g.roomKey === roomKey);
        if (!gate || gate.opened) return;
        const remaining = this.monsters.some(m => m.alive && m.roomKey === roomKey && !m.isBoss);
        if (remaining) return;
        gate.opened = true;
        for (const body of gate.bodies) if (body.active) body.destroy();
        if (gate.treeImage && gate.treeImage.active) {
          this.tweens.add({
            targets: gate.treeImage, alpha: 0, duration: 400,
            onComplete: () => { if (gate.treeImage.active) gate.treeImage.destroy(); }
          });
        }
        if (gate.label && gate.label.active) gate.label.destroy();
        // V141 — FRONTEIRA: escrita legítima. DungeonScene é a ÚNICA que escreve em layout.blocked (portão de tronco).
        for (const t of gate.tiles) this.layout.blocked[t.y][t.x] = 0;
        this.showToast('🪵 O tronco caiu! A passagem abriu.', 2600);
      }

      clearBossSlam() {
        if (this.slamTelegraph && this.slamTelegraph.active) this.slamTelegraph.destroy();
        this.slamTelegraph = null;
        this.slamPending = null;
      }

      updateBossRoomLock() {
        // V113: ao entrar na sala do boss, a porta bate atras do jogador —
        // nao da mais pra sair no meio da luta. O tronco do portao 2 volta
        // a bloquear o corredor; ao matar o boss, ele cai de novo.
        const boss = this.bossRecord;
        if (!boss || !boss.alive || this.bossGateLocked) return;
        if (this.roomKeyOfTile(this.playerBodyTile()) !== 'room3') return;
        const gate = this.layout.gates.find(g => g.roomKey === 'room2');
        if (!gate) return;
        this.bossGateLocked = true;
        // V114: ao trancar a sala, o boss pega o agro pra valer.
        if (this.bossRecord) this.bossRecord.hasAggro = true;
        const bodies = [];
        for (const t of gate.tiles) {
          const rect = this.add.rectangle(
            (t.x + 0.5) * TILE_SIZE, (t.y + 0.5) * TILE_SIZE, TILE_SIZE, TILE_SIZE, 0x6b4423, 0
          );
          rect.setDepth(50);
          this.physics.add.existing(rect, true);
          bodies.push(rect);
          // V141 — FRONTEIRA: escrita legítima. DungeonScene é a ÚNICA que escreve em layout.blocked (trava da sala do boss).
          this.layout.blocked[t.y][t.x] = 1;
        }
        this.physics.add.collider(this.player, bodies);
        const cx = (gate.tiles.reduce((sum, t) => sum + t.x, 0) / gate.tiles.length + 0.5) * TILE_SIZE;
        const cy = (gate.tiles.reduce((sum, t) => sum + t.y, 0) / gate.tiles.length + 0.5) * TILE_SIZE;
        const tree = this.add.image(cx, cy, 'v132-tree-leaf');
        tree.setOrigin(0.5, 0.5);
        tree.setScale(0.44);
        tree.setAngle(82);
        tree.setDepth((Math.max(...gate.tiles.map(t => t.y)) + 1) * TILE_SIZE);
        const label = this.add.text(cx, cy - 22, '🚪 A SALA TRANCOU!', {
          fontFamily: 'system-ui, sans-serif', fontSize: '8px', fontStyle: 'bold', color: '#ffe9b0',
          backgroundColor: 'rgba(20,14,8,.72)', padding: { x: 4, y: 2 }, align: 'center'
        }).setOrigin(0.5, 1).setDepth(200);
        this.bossGate = { bodies, treeImage: tree, label, tiles: gate.tiles };
        this.showToast('🚪 A sala trancou! Derrote o Brutamonte para sair.', 3000);
      }

      unlockBossRoom() {
        const g = this.bossGate;
        if (!g) return;
        this.bossGate = null;
        this.bossGateLocked = false;
        for (const body of g.bodies) if (body.active) body.destroy();
        // V141 — FRONTEIRA: escrita legítima. DungeonScene é a ÚNICA que escreve em layout.blocked (destrava sala do boss).
        for (const t of g.tiles) this.layout.blocked[t.y][t.x] = 0;
        if (g.treeImage && g.treeImage.active) {
          this.tweens.add({
            targets: g.treeImage, alpha: 0, duration: 400,
            onComplete: () => { if (g.treeImage.active) g.treeImage.destroy(); }
          });
        }
        if (g.label && g.label.active) g.label.destroy();
      }

      exitDungeon(defeated) {
        if (this.exiting) return;
        this.exiting = true;
        if (defeated) {
          // Morreu na dungeon: volta para a entrada com HP cheio.
          this.statusSystem.heal('player', 999999);
          this.showToast('Você caiu... voltou para a entrada.', 2000);
        }
        this.restoreOverworldHud();
        this.scene.resume('WorldScene');
        this.scene.setVisible(true, 'WorldScene');
        this.scene.stop();
      }

      // V110: regeneracao passa a rodar dentro da dungeon (antes era zero).
      update(time, delta) {
        if (this.exiting || !this.player) return;
        const now = this.time.now;
        this.statusSystem.updateRegeneration(Number(delta) || 0, Date.now());
        this.updatePlayerMovement();
        this.updatePlayerAttack(now);
        this.updateMonsters(now);
        this.updateBossRoomLock();
        this.updateBossSlam(now);
        this.refreshHud();
        const hp = this.statusSystem.getStat('player', 'hp');
        if (hp !== null && hp !== undefined && hp <= 0) this.exitDungeon(true);
      }
    }


    // ===== CACHE DO MUNDO RENDERIZADO (V122) =====
    // O mundo renderizado (chão, estruturas, objetos, colisão, estradas)
    // fica salvo no IndexedDB depois da primeira geração. Na próxima
    // abertura, o jogo usa o cache em vez de buscar o mapa-base e regenerar.
    // O cache é best-effort: qualquer falha (sem IndexedDB, cota, dado
    // inválido) cai de volta para a geração normal, sem travar o jogo.
    // A chave é renderCacheKey (não o worldId do save).
    function isValidCachedWorld(value) {
      if (!value || typeof value !== 'object') return false;
      if (value.width !== WORLD_WIDTH_TILES || value.height !== WORLD_HEIGHT_TILES) return false;
      const expected = WORLD_WIDTH_TILES * WORLD_HEIGHT_TILES;
      for (const key of ['ground', 'structures', 'upperObjects', 'blocked']) {
        if (!Array.isArray(value[key]) || value[key].length !== expected) return false;
      }
      if (!Array.isArray(value.roadCells)) return false;
      return true;
    }

    function openWorldCacheDB() {
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') {
          reject(new Error('IndexedDB indisponível.'));
          return;
        }
        const request = indexedDB.open('conquistador-world-cache', 1);
        request.onupgradeneeded = () => {
          try {
            if (!request.result.objectStoreNames.contains('worlds')) {
              request.result.createObjectStore('worlds', { keyPath: 'cacheKey' });
            }
          } catch (_) { /* o onerror trata */ }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Falha ao abrir o cache do mundo.'));
      });
    }

    function readWorldCache(cacheKey) {
      const timeout = new Promise(resolve => setTimeout(() => resolve(null), 1500));
      const read = (async () => {
        try {
          const db = await openWorldCacheDB();
          const value = await new Promise((resolve, reject) => {
            const tx = db.transaction('worlds', 'readonly');
            const request = tx.objectStore('worlds').get(cacheKey);
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error || new Error('Falha ao ler o cache do mundo.'));
          });
          try { db.close(); } catch (_) {}
          return isValidCachedWorld(value) ? value : null;
        } catch (_) {
          return null;
        }
      })();
      return Promise.race([read, timeout]);
    }

    function writeWorldCache(cacheKey, worldData) {
      // Fire-and-forget: nunca trava o jogo. Converte para arrays planos
      // na hora da chamada, antes de qualquer freeze posterior.
      try {
        const flattenRows = rows => {
          const out = [];
          for (const row of rows) for (const cell of row) out.push(cell);
          return out;
        };
        const record = {
          cacheKey,
          width: WORLD_WIDTH_TILES,
          height: WORLD_HEIGHT_TILES,
          ground: flattenRows(worldData.ground),
          structures: flattenRows(worldData.structures),
          upperObjects: flattenRows(worldData.upperObjects),
          blocked: flattenRows(worldData.blocked),
          roadCells: Array.from(worldData.roadCells || [])
        };
        (async () => {
          try {
            const db = await openWorldCacheDB();
            await new Promise((resolve, reject) => {
              const tx = db.transaction('worlds', 'readwrite');
              const request = tx.objectStore('worlds').put(record);
              request.onsuccess = () => resolve();
              request.onerror = () => reject(request.error || new Error('Falha ao gravar o cache do mundo.'));
            });
            try { db.close(); } catch (_) {}
          } catch (_) { /* cache é best-effort */ }
        })();
      } catch (_) { /* cache é best-effort */ }
    }

    function unflattenWorldRows(flat, width, height) {
      const rows = [];
      for (let y = 0; y < height; y += 1) rows.push(flat.slice(y * width, (y + 1) * width));
      return rows;
    }

class WorldScene extends Phaser.Scene {
      constructor() {
        super('WorldScene');
        this.path = [];
        this.currentDestinationKey = null;
        this.manualDestinationActive = false;
        this.lastStuckDestinationKey = null;
        this.lastStuckPosition = null;
        this.lastStuckAt = 0;
        this.invalidSavePreserved = false;
        this.invalidSaveNeedsBackup = false;
        this.invalidSaveFallbackPosition = null;
        this.invalidSaveSpawnPosition = null;
        this.invalidSaveHasCoordinate = false;
        this._hasCompletedPostSpawnFrame = false;
        this._pathRevalidatedThisFrame = false;
        this._lastPathRevalidationResult = null;
        this._currentUpdateToken = null;
        this._lastSuccessfulSaveUpdateToken = null;

      }

      initializeGameSystems() {
        this.eventBus = GAME_RUNTIME.eventBus;
        this.entityManager = GAME_RUNTIME.entityManager;
        this.statusSystem = GAME_RUNTIME.statusSystem;
        this.levelSystem = GAME_RUNTIME.levelSystem;
        this.saveSystem = GAME_RUNTIME.saveSystem;
        // V141 — FRONTEIRA CONGELADA: worldAPI é a ÚNICA porta de
        // entrada para colisão/navegação do mundo principal.
        // Sistemas NUNCA leem this.blocked / scene.blocked direto.
        // WorldScene é dona do `blocked`; core só gera; systems perguntam.
        this.worldAPI = Object.freeze({
          isWalkable: (tileX, tileY, profile = 'center') => {
            const grid = this.getNavigationGrid(profile === 'player' ? false : true);
            return Boolean(grid && grid[tileY] && grid[tileY][tileX] === 0);
          },
          findPath: (start, goal, options = {}) => {
            const profile = options.profile === 'center' ? 'center' : 'player';
            const navigation = this.getNavigationGrid(profile === 'center');
            if (!navigation) return [];
            const pathOptions = { ...options };
            delete pathOptions.profile;
            return core.findPath(navigation, start, goal, pathOptions);
          },
          getPlayerBodyTile: () => {
            const tile = this.getPlayerBodyTile();
            return tile ? { x: tile.x, y: tile.y } : null;
          },
          getRegionAt: (tileX, tileY) => {
            const gen = this.worldGenerator;
            return gen && core.getRegionAt ? core.getRegionAt(gen, tileX, tileY) : 'forest';
          },
          // V132 — respawn por regiao precisa distinguir ponte/rio, que o
          // getRegionAt sozinho nao distingue (ponte norte parece floresta).
          isBridgeCell: (tileX, tileY) => {
            const gen = this.worldGenerator;
            return Boolean(gen && core.isBridgeCell && core.isBridgeCell(gen, tileX, tileY));
          },
          isRiverCell: (tileX, tileY) => {
            const gen = this.worldGenerator;
            return Boolean(gen && core.isOceanCell && core.isOceanCell(gen, tileX, tileY));
          }
        });
        // Extension systems request persistence through events. They never
        // receive SaveSystem or LocalStorage access and cannot bypass the
        // protected player-position/save gate owned by this scene.
        this._extensionSaveQueued = false;
        this._extensionSaveRequested = false;
        this._systemSaveUnsubs = [
          this.eventBus.on('save:request', () => this.scheduleExtensionSave()),
          this.eventBus.on('status:changed', event => {
            if (event && event.entityId === 'player' && event.reason !== 'regeneration' && event.reason !== 'modifier-added') {
              this.scheduleExtensionSave();
            }
          }),
          this.eventBus.on('level:changed', event => {
            if (event && event.entityId === 'player') this.scheduleExtensionSave();
          }),
          this.eventBus.on('progress:changed', event => {
            if (!event || !['pets', 'waifus', 'flags', 'dungeons', 'items', 'monsters'].includes(event.section)) return;
            this.saveSystem.setProgressData({ [event.section]: event.data });
            this.scheduleExtensionSave();
          }),
          this.eventBus.on('progress:batch-changed', event => {
            if (!event || !event.data || typeof event.data !== 'object') return;
            this.saveSystem.setProgressData(event.data);
            this.scheduleExtensionSave();
          })
        ];
        this.events.once('shutdown', () => {
          for (const unsubscribe of this._systemSaveUnsubs || []) unsubscribe();
          this._systemSaveUnsubs = [];
          for (const unsubscribe of this._combatUnsubs || []) unsubscribe();
          this._combatUnsubs = [];
        });
        this._combatMoveRequestUnsub = this.eventBus.on('player:combat-move-request', request => {
          if (request && this.player) this.setCombatDestination(request);
        });
        this._combatStopUnsub = this.eventBus.on('player:combat-stop', () => {
          this.clearPlayerPath();
          this.player.anims.play(`idle-${this.facingRow}`, true);
        });
        this._combatAttackAnimationUnsub = this.eventBus.on('player:combat-attack-animation', event => {
          if (event) this.playCombatAttackAnimation(event);
        });
        this._combatUnsubs = [
          this._combatMoveRequestUnsub,
          this._combatStopUnsub,
          this._combatAttackAnimationUnsub
        ];
        this.extensionAPI = Object.freeze({
          events: this.eventBus,
          entities: this.entityManager,
          status: this.statusSystem,
          levels: this.levelSystem,
          save: Object.freeze({ request: reason => this.eventBus.emit('save:request', { reason: reason || 'extension' }) }),
          progress: Object.freeze({
            get: section => {
              const allowed = ['pets', 'waifus', 'flags', 'dungeons', 'items', 'monsters'];
              if (!allowed.includes(section)) return null;
              return this.saveSystem.getProgressData()[section];
            },
            update: (section, data) => {
              const allowed = ['pets', 'waifus', 'flags', 'dungeons', 'items', 'monsters'];
              if (!allowed.includes(section)) return false;
              const delivered = this.eventBus.emit('progress:changed', { section, data });
              return delivered > 0 ? 'pending' : false;
            },
            updateBatch: data => {
              const allowed = ['pets', 'waifus', 'flags', 'dungeons', 'items', 'monsters'];
              if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
              const entries = Object.entries(data);
              if (!entries.length || entries.some(([section]) => !allowed.includes(section))) return false;
              const delivered = this.eventBus.emit('progress:batch-changed', { data });
              return delivered > 0 ? 'pending' : false;
            }
          }),
          world: this.worldAPI,
          data: GAME_RUNTIME.data
        });
      }

      scheduleExtensionSave() {
        this._extensionSaveRequested = true;
        if (this._extensionSaveQueued) return true;
        this._extensionSaveQueued = true;
        // Coalesce synchronous event chains (entity:die -> level:changed ->
        // progress:changed) into one V4 write after every system has updated
        // its in-memory state. This avoids a same-frame position dedupe hiding
        // newer XP or inventory data.
        Promise.resolve().then(() => {
          this._extensionSaveQueued = false;
          if (!this._extensionSaveRequested || !this.scene || !this.sys || !this.sys.isActive()) return;
          this._extensionSaveRequested = false;
          const result = this.savePlayerPositionSafely(true);
          this._lastExtensionSaveResult = result === true || result === 'already-saved';
        });
        return true;
      }

      restoreProgressFromSave(data) {
        if (!data) return;
        if (data.status && data.status.player) this.statusSystem.restore('player', data.status.player);
        if (data.level) this.levelSystem.restore('player', data.level);
        this.saveSystem.setProgressData(data);
      }

        if (!this.entityManager || !this.playerEntityId || !this.player) return false;

                  if (result && typeof result.then === 'function') result.then(resolve, reject);
                  else resolve(result);

              }, 0);
            }));
            waifuWriteQueue = operation.catch(() => undefined);
            return operation;
          };
          const findCard = id => {

          const waifuTypeOf = card => String(card && (card.waifuId || card.waifuType || card.id) || 'slime');
          const removeEquippedWaifu = async slotIndex => {
            const latest = readWaifuData();

            while (equippedNow.length < 3) equippedNow.push(null);
            equippedNow[slotIndex] = null;

                  boxShadow: 'none', aspectRatio: '2 / 3', height: 'auto'

              }

          };
          const pickerPool = data => {
            // Galeria + Casa juntas, sem duplicar a mesma carta.
            const seen = new Set();
            const pool = [];
            for (const list of [data.cards, data.house]) {
              for (const c of (Array.isArray(list) ? list : [])) {
                if (c && c.instanceId && !seen.has(String(c.instanceId))) { seen.add(String(c.instanceId)); pool.push(c); }

            }
            return pool;
          };
          const renderPicker = () => {
            pickerGrid.replaceChildren();
            const data = readWaifuData();
            const cards = pickerPool(data);

            const equipped = Array.isArray(data.equipped) ? data.equipped : [];
            const qualityOrder = ['plebeia', 'dama', 'condessa', 'duquesa', 'rainha'];
            const qualityRank = card => Math.max(0, qualityOrder.indexOf(card && card.quality));
            const cardLevel = card => {

              const legacy = data.intimacy && data.intimacy[species] ? data.intimacy[species].level : 1;
              return Math.max(1, Math.min(100, Math.floor(Number(card && card.intimacy && card.intimacy.level) || Number(legacy) || 1)));
            };
            // V73: empilha cartas iguais (mesma especie + mesmo nivel + mesma qualidade) em 1 pilha com xN.

              art.alt = 'Carta completa da Donzela ' + (pickerSpecies === 'monkey' ? 'Macaca' : pickerSpecies === 'rat' ? 'Rata' : 'Slime');
              Object.assign(art.style, {

              Object.assign(stateLabel.style, {

            const mp = this.statusSystem.getStat('player', 'energy') ?? status.mp;
            const maxMp = this.statusSystem.getStat('player', 'maxEnergy') ?? status.maxMp;
            hpFill.style.width = `${Math.max(0, Math.min(100, hp / Math.max(1,maxHp) * 100))}%`;
            mpFill.style.width = `${Math.max(0, Math.min(100, mp / Math.max(1,maxMp) * 100))}%`;
            statNodes.level.textContent = String(level.level);
            statNodes.xp.textContent = `${level.xp} / ${level.xpToNext}`;
            statNodes.maxHp.textContent = String(this.statusSystem.getStat('player','maxHp'));
            statNodes.maxEnergy.textContent = String(this.statusSystem.getStat('player','maxEnergy'));
            statNodes.attack.textContent = String(this.statusSystem.getStat('player','attack'));
            statNodes.defense.textContent = String(this.statusSystem.getStat('player','defense'));
            statNodes.penetration.textContent = String(this.statusSystem.getStat('player','penetration'));
            statNodes.attackSpeed.textContent = `${this.statusSystem.getStat('player','attackSpeed')}x`;
            statNodes.moveSpeed.textContent = String(this.statusSystem.getStat('player','moveSpeed'));
            statNodes.hpRegenOutOfCombat.textContent = `${this.statusSystem.getStat('player','hpRegenOutOfCombat')} / s`;
            statNodes.energyRegen.textContent = `${this.statusSystem.getStat('player','energyRegen')} / s`;
            renderSlots();
          };
          // V84: silhueta = o proprio sprite do mapa, frame atual do jogador.
          // A imagem de anime embutida (base64) foi removida — era ela que deixava
          // a silhueta errada, estatica e borrada. Sem suavizacao: pixelado, nitido.
          const drawPlayerPortrait = () => {
            try {
              const ctx = portrait.getContext('2d');
              ctx.clearRect(0, 0, 192, 192);
              const frame = this.player && this.player.frame;
              const source = this.textures.get('hero').getSourceImage();
              if (!frame || !source) return;
              ctx.imageSmoothingEnabled = false;
              const scale = Math.min(192 / frame.cutWidth, 192 / frame.cutHeight);
              const w = frame.cutWidth * scale;
              const h = frame.cutHeight * scale;
              ctx.drawImage(source, frame.cutX, frame.cutY, frame.cutWidth, frame.cutHeight, (192 - w) / 2, 192 - h, w, h);
            } catch (error) { /* Retrato permanece neutro se a textura não estiver pronta. */ }

          // Um único botão MENU reúne os acessos aos sistemas já existentes.

          makeMenuItem('📖  BESTIÁRIO', () => this.bestiarySystem.setOpen(true));

          // V98: MINIMAPA REDONDO no canto superior direito, com o terreno real
          // (grama, estrada, rio, lava, montanha). Sem monstros, como pedido.
          // Canvas 2D: ponto amarelo = jogador, retangulo claro = visao da
          // camera. Nao intercepta toque e some junto com o HUD.
          const minimapRoot = document.createElement('div');
          minimapRoot.id = 'conquistador-minimap';
          Object.assign(minimapRoot.style, {
            position: 'fixed',
            top: 'max(6px, env(safe-area-inset-top))',
            right: 'max(6px, env(safe-area-inset-right))',
            zIndex: '110',
            width: '104px', height: '104px',
            border: '1px solid rgba(255,215,130,.85)',
            borderRadius: '50%',
            background: 'rgba(8,12,8,.82)',
            boxShadow: '0 2px 10px rgba(0,0,0,.6)',
            overflow: 'hidden',
            pointerEvents: 'none'
          });
          const minimapCanvas = document.createElement('canvas');
          minimapCanvas.width = 208; minimapCanvas.height = 208;
          Object.assign(minimapCanvas.style, { display: 'block', width: '104px', height: '104px' });
          minimapRoot.appendChild(minimapCanvas);
          document.body.appendChild(minimapRoot);
          // Terreno desenhado UMA vez num bitmap (1px por tile) e reutilizado:
          // grama verde, estrada terra escura, rio azul,
          // gelo azul-claro, montanha verde-escuro, transição verde-médio.
          let minimapTerrain = null;
          const buildMinimapTerrain = () => {
            try {
              const gen = this.worldGenerator;
              if (!gen || !gen.roadCells) return null;
              const tilesX = (typeof WORLD_WIDTH_TILES === 'number' && WORLD_WIDTH_TILES > 0) ? WORLD_WIDTH_TILES : 90;
              const tilesY = (typeof WORLD_HEIGHT_TILES === 'number' && WORLD_HEIGHT_TILES > 0) ? WORLD_HEIGHT_TILES : 120;
              const off = document.createElement('canvas');
              off.width = tilesX; off.height = tilesY;
              const tctx = off.getContext('2d');
              if (!tctx) return null;
              const img = tctx.createImageData(tilesX, tilesY);
              const data = img.data;
              for (let y = 0; y < tilesY; y += 1) {
                for (let x = 0; x < tilesX; x += 1) {
                  const idx = (y * tilesX + x) * 4;
                  let r = 127, g = 174, b = 78;
                  if (core.isOceanCell(gen, x, y)) { r = 29; g = 78; b = 143; }
                  else if (core.isSouthernIceBankCell && core.isSouthernIceBankCell(gen, x, y)) { r = 205; g = 228; b = 240; }
                 
                  else if (core.isBridgeCell && core.isBridgeCell(gen, x, y)) { r = 232; g = 200; b = 90; }
                  else if (gen.roadCells.has(x + ',' + y)) { r = 201; g = 169; b = 78; }
                  else if (core.getRegionAt) {
                    const region = core.getRegionAt(gen, x, y);
                    if (region === 'ice') { r = 205; g = 228; b = 240; }
                    else if (region === 'mountain') { r = 96; g = 148; b = 74; }
                    else if (region === 'transition') { r = 112; g = 162; b = 80; }
                    else if ((x + y) % 2 === 0) { r = 134; g = 184; b = 86; }
                  }
                  else if ((x + y) % 2 === 0) { r = 134; g = 184; b = 86; }
                  data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
                }
              }
              tctx.putImageData(img, 0, 0);
              return off;
            } catch (error) { return null; }
          };
          const drawMinimap = () => {
            try {
              const ctx = minimapCanvas.getContext('2d');
              if (!ctx) return;
              const W = 208, H = 208;
              ctx.clearRect(0, 0, W, H);
              ctx.save();
              ctx.beginPath();
              ctx.arc(W / 2, H / 2, W / 2, 0, Math.PI * 2);
              ctx.clip();
              const worldW = (typeof WORLD_WIDTH_PIXELS === 'number' && WORLD_WIDTH_PIXELS > 0) ? WORLD_WIDTH_PIXELS : 1;
              const worldH = (typeof WORLD_HEIGHT_PIXELS === 'number' && WORLD_HEIGHT_PIXELS > 0) ? WORLD_HEIGHT_PIXELS : 1;
              const scale = Math.min(W / worldW, H / worldH);
              const offX = (W - worldW * scale) / 2;
              const offY = (H - worldH * scale) / 2;
              if (!minimapTerrain) minimapTerrain = buildMinimapTerrain();
              if (minimapTerrain) ctx.drawImage(minimapTerrain, offX, offY, worldW * scale, worldH * scale);
              else { ctx.fillStyle = '#7fae4e'; ctx.fillRect(0, 0, W, H); }
              const toMap = (x, y) => [offX + x * scale, offY + y * scale];
              const cam = this.cameras && this.cameras.main;
              if (cam && cam.worldView) {
                const view = cam.worldView;
                const topLeft = toMap(view.x, view.y);
                const bottomRight = toMap(view.x + view.width, view.y + view.height);
                ctx.strokeStyle = 'rgba(255,255,255,.45)';
                ctx.lineWidth = 1;
                ctx.strokeRect(topLeft[0], topLeft[1], bottomRight[0] - topLeft[0], bottomRight[1] - topLeft[1]);
              }
              if (this.player && this.player.active) {
                const pos = toMap(this.player.x, this.player.y);
                ctx.fillStyle = '#ffe066';
                ctx.beginPath();
                ctx.arc(pos[0], pos[1], 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#201a08';
                ctx.lineWidth = 1;
                ctx.stroke();
              }
              ctx.restore();
            } catch (error) { /* O minimapa nunca pode quebrar o jogo. */ }
          };
          drawMinimap();
          const minimapTimer = window.setInterval(() => { if (!document.hidden && minimapRoot.style.display !== 'none') drawMinimap(); }, 200); // V134 — não redesenha com a aba em segundo plano ou minimapa oculto.
          this.minimapUI = { root: minimapRoot, destroy: () => { window.clearInterval(minimapTimer); minimapRoot.remove(); } };


          const modalBackdrops = [
            this.inventorySystem.backdrop,
            this.bestiarySystem.backdrop,
            this.waifuGallerySystem.backdrop,
            this.houseSystem.backdrop,
            statusBackdrop,
            pickerBackdrop
          ].filter(Boolean);
          // Todas as abas usam superfícies translúcidas; o mapa permanece visível
          // atrás do painel, sem fundos opacos que escondam o mundo.
          for (const backdrop of modalBackdrops) {
            backdrop.style.background = 'rgba(0,0,0,.30)';
            backdrop.style.backdropFilter = 'blur(2px)';
            const panel = backdrop.querySelector('section');
            if (panel) {
              // V87: era .78/.72 e anulava a opacidade da V86 (fantasma voltava). Agora igual a V86.
              panel.style.background = 'linear-gradient(180deg,rgba(31,25,21,.93),rgba(12,12,11,.88))';
              panel.style.backdropFilter = 'blur(8px)';
            }
          }
          const modalIsOpen = () => modalBackdrops.some(backdrop => backdrop.style.display !== 'none');
          const syncHudVisibility = () => {
            const hidden = modalIsOpen();
            menuRoot.style.display = hidden ? 'none' : 'flex';
            minimapRoot.style.display = hidden ? 'none' : 'block';
            statusRoot.style.display = hidden ? 'none' : 'flex';
            menuPanel.style.display = 'none';
            menuButton.setAttribute('aria-expanded', 'false');
          };
          const addPanelExit = (backdrop, system) => {
            if (!backdrop) return;
            const panel = backdrop.querySelector('section');
            if (!panel || panel.querySelector('[data-global-panel-exit]')) return;
            const footer = document.createElement('div');
            Object.assign(footer.style, {
