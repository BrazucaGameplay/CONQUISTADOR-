<script id="conquistador-systems-v44">
  (function (root) {
    'use strict';

    function cloneData(value) {
      if (value === undefined) return undefined;
      if (typeof structuredClone === 'function') {
        try { return structuredClone(value); } catch (error) { /* JSON-safe fallback below. */ }
      }
      return value === null ? null : JSON.parse(JSON.stringify(value));
    }

    // Event contracts for future systems:
    // entity:die { entityId, killerId, xp }; entity:moved { id, kind, tile };
    // status:changed { entityId, reason, status }; level:changed { entityId, level, xp };
    // progress:changed { section: pets|waifus|flags|dungeons|items, data };
    // save:request { reason }. LevelSystem is the only entity:die subscriber.
    class EventBus {
      constructor() { this.listeners = new Map(); }
      on(eventName, handler, options = {}) {
        if (typeof eventName !== 'string' || !eventName || typeof handler !== 'function') {
          throw new TypeError('EventBus.on exige nome de evento e função.');
        }
        const entry = { handler, once: options.once === true, active: true };
        if (!this.listeners.has(eventName)) this.listeners.set(eventName, new Set());
        this.listeners.get(eventName).add(entry);
        return () => this.off(eventName, handler, entry);
      }
      once(eventName, handler) { return this.on(eventName, handler, { once: true }); }
      off(eventName, handler, exactEntry = null) {
        const entries = this.listeners.get(eventName);
        if (!entries) return false;
        let removed = false;
        for (const entry of Array.from(entries)) {
          if ((exactEntry && entry === exactEntry) || (!exactEntry && entry.handler === handler)) {
            entry.active = false;
            entries.delete(entry);
            removed = true;
          }
        }
        if (!entries.size) this.listeners.delete(eventName);
        return removed;
      }
      emit(eventName, payload = {}) {
        const entries = this.listeners.get(eventName);
        if (!entries || !entries.size) return 0;
        let delivered = 0;
        for (const entry of Array.from(entries)) {
          if (!entry.active) continue;
          if (entry.once) this.off(eventName, entry.handler, entry);
          try {
            entry.handler(payload);
            delivered += 1;
          } catch (error) {
            console.error(`Erro em listener do evento ${eventName}:`, error);
          }
        }
        return delivered;
      }
      clear() { for (const entries of this.listeners.values()) for (const entry of entries) entry.active = false; this.listeners.clear(); }
    }

    class EntityManager {
      constructor(eventBus) {
        this.eventBus = eventBus;
        this.entities = new Map();
        this.nextId = 1;
      }
      create(definition) {
        if (!definition || typeof definition.kind !== 'string' || !definition.kind) {
          throw new TypeError('EntityManager.create exige kind.');
        }
        const id = definition.id || `entity-${this.nextId++}`;
        if (this.entities.has(id)) throw new Error(`Entidade duplicada: ${id}`);
        const tile = definition.tile && Number.isInteger(definition.tile.x) && Number.isInteger(definition.tile.y)
          ? { x: definition.tile.x, y: definition.tile.y } : null;
        const entity = Object.freeze({
          id,
          kind: definition.kind,
          tile,
          // HP/MP live only in StatusSystem; statusId is the sole association,
          // avoiding a second mutable copy of entity health here.
          statusId: definition.statusId || id,
          data: Object.freeze(cloneData(definition.data || {}))
        });
        this.entities.set(id, entity);
        this.eventBus.emit('entity:created', cloneData(entity));
        return cloneData(entity);
      }
      get(id) { const entity = this.entities.get(id); return entity ? cloneData(entity) : null; }
      getAll(kind = null) {
        return Array.from(this.entities.values())
          .filter(entity => !kind || entity.kind === kind)
          .map(entity => cloneData(entity));

    // Esquema único de atributos para jogador e monstros. Os aliases legados

    const STATUS_KEYS = [

      'penetration', 'attackSpeed', 'moveSpeed',
      'hpRegenOutOfCombat', 'energyRegen'
    ];

        const maxHp = this.numberOr(source.maxHp, 100, 1);
        const maxEnergy = this.numberOr(source.maxEnergy ?? source.maxMp, 50, 0);
        const record = {
          hp: this.numberOr(source.hp, maxHp, 0, maxHp), maxHp,
          energy: this.numberOr(source.energy ?? source.mp, maxEnergy, 0, maxEnergy),

          defense: this.numberOr(source.defense, 5, 0),
          penetration: this.numberOr(source.penetration, 0, 0),

    class LevelSystem {

          if (!event || event.killerId !== this.playerEntityId) return;

        // Normalize imported progression so saved XP can never remain above
        // the current level threshold after a curve revision.
        let guard = 0;
        while (xp >= this.xpToNext(level) && guard < 10000) {
          xp -= this.xpToNext(level);
          level += 1;
          guard += 1;
        }
        this.progress.set(entityId, { level, xp });
        this.eventBus.emit('level:changed', { entityId, ...this.snapshot(entityId), reason: 'restored' });
        return true;
      }

        return { level: value.level, xp: value.xp, xpToNext: this.xpToNext(value.level) };

        const current = this.progress.get(entityId) || { level: 1, xp: 0 };
        const previousLevel = current.level;
        let level = current.level;
        let xp = current.xp + amount;
        let needed = this.xpToNext(level);
        while (xp >= needed) { xp -= needed; level += 1; needed = this.xpToNext(level); }
        this.progress.set(entityId, { level, xp });
        this.eventBus.emit('level:changed', { entityId, ...this.snapshot(entityId), gainedXp: amount });

          this.progressData = { pets: cloneData(data.pets), waifus: cloneData(data.waifus), flags: cloneData(data.flags), dungeons: cloneData(data.dungeons), items: cloneData(data.items), monsters: cloneData(data.monsters || { list: [], respawns: [] }) };
          this.eventBus.emit('save:written', { version: 4, savedAt: data.savedAt });
          return true;
        } catch (error) {
          console.warn('SaveSystem: falha ao gravar save V4.', error);
          return false;
        }
      }
    }

    // MonsterSystem is an extension module: it can query the public world API,
    // use EntityManager/StatusSystem, and communicate through EventBus. It never
    // receives the collision grids, the SaveSystem, or mutable world internals.
    class MonsterSystem {
      constructor(api, options = {}) {
        if (!api || !api.events || !api.entities || !api.status || !api.world || !api.progress) {
          throw new TypeError('MonsterSystem exige a API pública completa.');
        }
        this.api = api;
        this.scene = options.scene;
        if (!this.scene || !this.scene.add || !this.scene.events) {
          throw new TypeError('MonsterSystem exige uma cena Phaser ativa.');
        }
        this.data = api.data;
        this.events = api.events;
        this.entities = api.entities;
        this.status = api.status;
        this.world = api.world;
        this.progress = api.progress;
        this.monsters = new Map();
        this.drops = new Map();
        this.now = 0;
        this.chunkGrid = Object.freeze({
          chunkSize: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.chunkSize || 30)),
          columns: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.columns || 1)),
          rows: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.rows || 1)),
          width: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.width || 30)),
          height: Math.max(1, Math.floor(options.chunkGrid && options.chunkGrid.height || 30))
        });
        this.maxMonstersPerChunk = Math.max(1, Math.floor(options.maxMonstersPerChunk || 10));
        this.maxPerMonsterType = Math.max(1, Math.floor(options.maxPerMonsterType || 2));
        this.monsterTypes = Object.freeze(['slime', 'monkey', 'rat', 'snake', 'wolf', 'eagle', 'spider', 'bear', 'goblin', 'orc', 'ogre']);
        // V140 — POOL DE MONSTROS: visuais (sprite + rótulo + barra HP) são
        // criados uma vez e reutilizados. Antes cada spawn criava 4 objetos
        // novos e cada morte destruía tudo (GC + queda de FPS no celular).
        // Pool cresce sob demanda, mas devolve ao pool em vez de destruir.
        this.monsterVisualPool = { slime: [], monkey: [], rat: [], snake: [], wolf: [], eagle: [], spider: [], bear: [], goblin: [], orc: [], ogre: [] };
        // V145 — teto por espécie: ogro, orc e urso são raros (1 por chunk).
        this.maxPerType = Object.freeze({ ogre: 1, orc: 1, bear: 1 });
        this.monsterVisualPoolMax = 30;
        // V141 — CULLING: monstro fora da câmera dorme. Sem movimento,
        // sem buscar jogador, sem ataque, sem pathfinding, sem rótulo.
        // Margem de 96px (~3 tiles) evita piscar na borda da tela.
        // Acorda sozinho quando a câmera chega perto: o teste é por
        // frame, sem estado travado — nenhum reset manual é preciso.
        this.cullMarginPx = 96;
        // V140 — POOL DE EFEITOS DE HIT: os 4 círculos do impacto também
        // são reutilizados em vez de criar/destruir a cada golpe.
        this.hitEffectPool = [];
        this.respawnDelayMs = Math.max(1000, Math.floor(options.respawnDelayMs || 5000));
        this.spawnRetryDelayMs = 5000;
        this.nextMonsterSequence = 1;
        this.chunkRespawns = new Map();
        this.chunkPopulation = new Map();
        this.lastPlayerAttackAt = -Infinity;
        this.playerAttackCooldownMs = Number.isFinite(options.playerAttackCooldownMs)
          ? Math.max(0, options.playerAttackCooldownMs) : 1000;
        this.attackRange = 48;
        this.playerApproachRange = 260;
        this.playerAttackWindupMs = 180;
        this.pendingPlayerAttack = null;
        this.approachTargetId = null;
        this.lastApproachRequestAt = -Infinity;
        this.manualDestinationActive = false;
        this.aggroRange = 260;
        this.monsterAttackRange = 24;
        this.monsterAttackCooldownMs = 1000;
        this.tileSize = Number.isFinite(options.tileSize) ? options.tileSize : 16;
        this.active = true;
        this.message = '';
        this.messageUntil = 0;
        this.texturesReady = false;
        this.createMonsterTextures();
        this.createUI();
        this.unsubscribers = [
          this.events.on('player:destination-set', () => {
            this.manualDestinationActive = true;
            // Discard only combat intent. Never send combat-stop here because
            // that event clears the WorldScene path, including the user's route.
            this.pendingPlayerAttack = null;
            this.approachTargetId = null;
          }),
          this.events.on('player:destination-cleared', () => {
            this.manualDestinationActive = false;
            this.approachTargetId = null;
            this.pendingPlayerAttack = null;
          }),
          this.events.on('status:changed', event => {
            if (event && (event.entityId === 'player' || this.monsters.has(event.entityId))) this.refreshUI();
          }),
          this.events.on('level:changed', event => {
            if (event && event.entityId === 'player') this.refreshUI();
          }),
          // V110: subir de nivel cura 100% do HP — subir no meio da dungeon vira recompensa.
          this.events.on('level:up', event => {
            if (event && event.entityId === 'player') this.status.heal('player', 999999);
          }),
          this.events.on('save:written', () => {
            this.finalizePendingDrops();
            this.refreshUI();
          })
        ];
        // V76: qualquer nascimento/morte/dano em monstro agenda save (debounce 800ms).
        this.monsterSaveTimer = null;
        this.unsubscribers.push(
          this.events.on('monster:spawned', () => this.scheduleMonsterSave()),
          this.events.on('monster:died', () => { try { if (this.progress && this.progress.update) this.progress.update('monsters', this.snapshotMonsters()); } catch (e) {} }),
          this.events.on('status:changed', event => { if (event && event.entityId && event.entityId !== 'player' && this.monsters.has(event.entityId)) { this.updateMonsterHpBar(this.monsters.get(event.entityId)); this.scheduleMonsterSave(); } })
        );
        if (typeof window !== 'undefined' && window.addEventListener) {
          this.monsterFlushOnHide = () => { try { if (this.monsterSaveTimer) { clearTimeout(this.monsterSaveTimer); this.monsterSaveTimer = null; } if (this.progress && this.progress.update) this.progress.update('monsters', this.snapshotMonsters()); } catch (e) {} };
          window.addEventListener('pagehide', this.monsterFlushOnHide);
          this.unsubscribers.push(() => window.removeEventListener('pagehide', this.monsterFlushOnHide));
        }
        this.boundUpdate = (time, delta) => this.update(time, delta);
        this.boundDestroy = () => this.destroy();
        this.scene.events.on('update', this.boundUpdate);
        this.scene.events.once('shutdown', this.boundDestroy);
        this.refreshUI();
      }

      createMonsterTextures() {
        // V145 — 11 monstros + 3 frames cada (andar/batalha/morte) + o chefe Brutamonte.
        const spriteSources = {
          slime: "assets/monsters/slime.png",
          monkey: "assets/monsters/monkey.png",
          rat: "assets/monsters/rat.png",
          snake: "assets/monsters/snake.png",
          wolf: "assets/monsters/wolf.png",
          eagle: "assets/monsters/eagle.png",
          spider: "assets/monsters/spider.png",
          bear: "assets/monsters/bear.png",
          goblin: "assets/monsters/goblin.png",
          orc: "assets/monsters/orc.png",
          ogre: "assets/monsters/ogre.png",
          brutamonte: root.CONQUISTADOR_BOSS_SPRITE || ''
        };
        root.CONQUISTADOR_MONSTER_ART = Object.freeze({ ...spriteSources });
        const versionedKeys = {
          slime: 'conquistador-monster-slime-v3',
          monkey: 'conquistador-monster-monkey-v3',
          rat: 'conquistador-monster-rat-v3',
          snake: 'conquistador-monster-snake-v3',
          wolf: 'conquistador-monster-wolf-v3',
          eagle: 'conquistador-monster-eagle-v3',
          spider: 'conquistador-monster-spider-v3',
          bear: 'conquistador-monster-bear-v3',
          goblin: 'conquistador-monster-goblin-v3',
          orc: 'conquistador-monster-orc-v3',
          ogre: 'conquistador-monster-ogre-v3',
          brutamonte: 'conquistador-boss-brutamonte-v1'
        };
        this.monsterTextureKeys = Object.freeze(versionedKeys);
        // Frames por estado: andar (idle/walk), batalha (attack), morte (death).
        const frameKeys = {};
        const toLoad = [];
        for (const type of Object.keys(spriteSources)) {
          toLoad.push({ type, key: versionedKeys[type], src: spriteSources[type] });
        }
        for (const type of ['slime', 'monkey', 'rat', 'snake', 'wolf', 'eagle', 'spider', 'bear', 'goblin', 'orc', 'ogre']) {
          frameKeys[type] = {
            walk: `conquistador-monster-${type}-v3-walk`,
            attack: `conquistador-monster-${type}-v3-attack`,
            death: `conquistador-monster-${type}-v3-death`
          };
          toLoad.push({ type, key: frameKeys[type].walk, src: `assets/monsters/${type}_walk.png` });
          toLoad.push({ type, key: frameKeys[type].attack, src: `assets/monsters/${type}_attack.png` });
          toLoad.push({ type, key: frameKeys[type].death, src: `assets/monsters/${type}_death.png` });
        }
        this.monsterFrameKeys = Object.freeze(frameKeys);
        let loaded = 0;
        const finish = () => {
          loaded += 1;
          if (loaded !== toLoad.length || !this.active) return;
          this.texturesReady = true;
          this.restoreOrPopulate();
          this.refreshUI();
        };
        for (const entry of toLoad) {
          const key = entry.key;
          if (this.scene.textures && this.scene.textures.exists(key)) {
            finish();
            continue;
          }
          const image = new Image();
          image.onload = () => {
            if (!this.active) return;
            if (!this.scene.textures.exists(key)) this.scene.textures.addImage(key, image);
            finish();
          };
          image.onerror = () => {
            this.message = `Falha ao carregar visual: ${entry.type}`;
            this.messageUntil = this.now + 5000;
            finish();
          };
          image.src = entry.src;
        }
      }

      updateAutoAttackIndicator() {
        if (!this.autoAttackBadge) return;
        const cooldown = this.status.getAttackCooldown('player');
        const elapsed = Math.max(0, this.now - this.lastPlayerAttackAt);
        const progress = Math.max(0, Math.min(1, elapsed / cooldown));
        const percent = (progress * 100).toFixed(1);
        const muted = progress >= 1;
        this.autoAttackBadge.style.background =
          `conic-gradient(from -90deg, #dfc47d ${percent}%, rgba(90,78,57,.38) ${percent}% 100%)`;
        this.autoAttackBadge.style.opacity = muted ? '1' : '0.96';
        if (this.autoAttackInner) {
          this.autoAttackInner.style.color = muted ? '#f4dfaa' : '#c8b98e';
          this.autoAttackInner.style.filter = muted ? 'none' : 'saturate(.72)';

      getChunkId(chunkX, chunkY) {
        return `${chunkX}:${chunkY}`;
      }

      getChunkForTile(tile) {
        if (!tile || !Number.isInteger(tile.x) || !Number.isInteger(tile.y) ||
            tile.x < 0 || tile.y < 0 ||
            tile.x >= this.chunkGrid.width || tile.y >= this.chunkGrid.height) return null;
        const chunkX = Math.floor(tile.x / this.chunkGrid.chunkSize);
        const chunkY = Math.floor(tile.y / this.chunkGrid.chunkSize);
        if (chunkX >= this.chunkGrid.columns || chunkY >= this.chunkGrid.rows) return null;
        return {
          chunkX,
          chunkY,
          id: this.getChunkId(chunkX, chunkY)
        };
      }

      getChunkPopulationState(chunkId) {
        let state = this.chunkPopulation.get(chunkId);
        if (!state) {
          state = {
            initialSpawnAttempted: false,
            initialFillPending: false,
            initialRetryAt: 0,
            totalSpawned: 0
          };
          this.chunkPopulation.set(chunkId, state);
        }
        return state;
      }

      getAliveCountForChunk(chunkId, monsterId = null) {
        let count = 0;
        for (const record of this.monsters.values()) {
          if (record.alive && record.originChunkId === chunkId &&
              (!monsterId || record.monsterId === monsterId)) count += 1;
        }
        return count;
      }

      getSpawnCandidates(chunkX, chunkY) {
        let startX = chunkX * this.chunkGrid.chunkSize;
        let startY = chunkY * this.chunkGrid.chunkSize;
        let endX = Math.min(startX + this.chunkGrid.chunkSize, this.chunkGrid.width);
        let endY = Math.min(startY + this.chunkGrid.chunkSize, this.chunkGrid.height);
        const playerTile = this.world.getPlayerBodyTile();
        const candidates = [];

        // Keep a one-tile margin inside chunk/world borders; the player-footprint
        // walkability API remains authoritative for every candidate.
        for (let y = startY + 1; y < endY - 1; y += 1) {
          for (let x = startX + 1; x < endX - 1; x += 1) {
            if (!this.world.isWalkable(x, y, 'player')) continue;
            // V132 — respawn por regiao: nasce em floresta, transicao,
            // montanha e gelo. Cada chunk povoa com a regiao dos proprios
            // tiles, em vez de so a floresta povoar o mundo inteiro.
            // Nunca nasce no rio, na ponte, nem na clareira da dungeon (23,88).
            if (this.world.isBridgeCell && this.world.isBridgeCell(x, y)) continue;
            if (this.world.isRiverCell && this.world.isRiverCell(x, y)) continue;
            if (Math.max(Math.abs(x - 23), Math.abs(y - 88)) <= 3) continue;
            if (this.world.getRegionAt) {
              const region = this.world.getRegionAt(x, y);
              if (region !== 'forest' && region !== 'transition' && region !== 'mountain' && region !== 'ice') continue;
            }
            if (playerTile && Math.max(Math.abs(playerTile.x - x), Math.abs(playerTile.y - y)) < 4) continue;

            // Avoid overlapping newly spawned groups and existing monsters,
            // including monsters that have wandered in from another chunk.
            let tooClose = false;
            for (const record of this.monsters.values()) {
              if (record.alive && Math.max(
                Math.abs(record.tile.x - x),
                Math.abs(record.tile.y - y)
              ) < 3) {
                tooClose = true;
                break;
              }
            }
            if (!tooClose) candidates.push({ x, y });
          }
        }

        // Deterministic per-chunk shuffle: repeatable placement without
        // Math.random(), making bugs and spawn patterns reproducible.
        let seed = (((chunkX + 1) * 73856093) ^ ((chunkY + 1) * 19349663) ^ 0x5f3759df) >>> 0;
        const random = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        for (let i = candidates.length - 1; i > 0; i -= 1) {
          const j = Math.floor(random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        return candidates;
      }

      getMonsterFacing(dx, dy) {
        // Eight sectors in the same clockwise convention used by the player.
        const angle = Math.atan2(dy, dx);
        return (Math.round((angle + Math.PI * 2) / (Math.PI / 4)) % 8);
      }

      setMonsterAnimation(record, state, dx = 0, dy = 0) {
        if (!record || !record.sprite || !record.sprite.active) return;
        const sprite = record.sprite;
        const animation = record.animation || (record.animation = {
          state: null, facing: 0, tween: null,
          baseScaleX: sprite.scaleX || 1, baseScaleY: sprite.scaleY || 1
        });
        const facing = (dx || dy) ? this.getMonsterFacing(dx, dy) : animation.facing;
        if (dx || dy) {
          animation.facing = facing;
          // The original monster art is a single-view sprite. Mirror it for
          // west-facing sectors and retain the eight-sector facing state.
          sprite.setFlipX(facing === 3 || facing === 4 || facing === 5);
        }
        if (animation.state === state) return;
        if (animation.tween && animation.tween.isPlaying()) animation.tween.stop();
        animation.tween = null;
        animation.state = state;
        // V145 — frame por estado (andar/batalha). A morte troca no killMonster.
        // Tamanho de exibição preservado: os frames têm dimensões diferentes.
        const frameKeys = this.monsterFrameKeys && this.monsterFrameKeys[record.monsterId];
        if (frameKeys && sprite && this.scene.textures) {
          const frameKey = state === 'attack' ? frameKeys.attack : frameKeys.walk;
          if (frameKey && this.scene.textures.exists(frameKey)) {
            const dw = sprite.displayWidth, dh = sprite.displayHeight;
            sprite.setTexture(frameKey);
            sprite.setDisplaySize(dw, dh);
          }
        }
        const baseX = animation.baseScaleX;
        const baseY = animation.baseScaleY;
        sprite.setScale(baseX, baseY);
        sprite.setAngle(0);

        if (state === 'idle') {
          // Idle cadence mirrors the hero's 2-frame / 2 FPS loop.
          animation.tween = this.scene.tweens.add({
            targets: sprite,
            scaleX: { from: baseX * 0.985, to: baseX * 1.015 },
            scaleY: { from: baseY * 0.96, to: baseY * 1.04 },
            duration: 500, yoyo: true, repeat: -1, ease: 'Sine.InOut'
          });
        } else if (state === 'walk') {
          // Walk cadence mirrors the hero's 3-frame / 8 FPS loop.
          animation.tween = this.scene.tweens.add({
            targets: sprite,
            scaleX: { from: baseX * 1.06, to: baseX * 0.94 },
            scaleY: { from: baseY * 0.90, to: baseY * 1.10 },
            angle: { from: -3, to: 3 },
            duration: 125, yoyo: true, repeat: -1, ease: 'Sine.InOut'
          });
        } else if (state === 'attack') {
          // Three visual beats (wind-up, strike, recovery), with no change
          // to damage, range, cooldown, or attack timing.
          animation.tween = this.scene.tweens.add({
            targets: sprite,
            scaleX: { from: baseX * 0.88, to: baseX * 1.22 },
            scaleY: { from: baseY * 1.12, to: baseY * 0.82 },
            angle: { from: -5, to: 5 },
            duration: 100, yoyo: true, repeat: 1, ease: 'Quad.Out',
            onComplete: () => {
              if (!sprite.active || !record.alive) return;
              animation.state = null;
              this.setMonsterAnimation(record, 'idle');
            }
          });
        }
      }

      // V140 — POOL: pega um conjunto visual pronto ou cria um novo.
      acquireMonsterVisual(monsterId, x, y, level, displayWidth, displayHeight) {
        const pool = this.monsterVisualPool[monsterId];
        if (pool && pool.length) {
          const v = pool.pop();
          const sprite = v.sprite;
          sprite.setTexture(this.monsterTextureKeys[monsterId]);
          sprite.setDisplaySize(displayWidth, displayHeight);
          sprite.setOrigin(0.5, 0.86);
          sprite.setPosition(x, y);
          sprite.setDepth(y + 10);
          sprite.setAlpha(1); sprite.setAngle(0); sprite.clearTint();
          sprite.setScale(1, 1);
          sprite.setVisible(true);
          const levelLabel = v.levelLabel;
          levelLabel.setText(String(level));
          levelLabel.setPosition(x, y - displayHeight * 0.86 - 4);
          levelLabel.setDepth(sprite.depth + 20);
          levelLabel.setVisible(true);
          const hpBarWidth = Math.max(30, displayWidth + 6);
          const hpBarBg = v.hpBarBg;
          hpBarBg.setPosition(x, y + 6);
          hpBarBg.setDepth(sprite.depth + 21);
          hpBarBg.setVisible(true);
          const hpBarFill = v.hpBarFill;
          hpBarFill.setPosition(x - hpBarWidth / 2, y + 6);
          hpBarFill.setDepth(sprite.depth + 22);
          hpBarFill.setVisible(true);
          return { sprite, levelLabel, hpBarBg, hpBarFill, hpBarWidth };
        }
        const sprite = this.scene.add.image(x, y, this.monsterTextureKeys[monsterId]);
        sprite.setDisplaySize(displayWidth, displayHeight);
        sprite.setOrigin(0.5, 0.86);
        sprite.setDepth(y + 10);
        const levelLabel = this.scene.add.text(x, y - displayHeight * 0.86 - 4, String(level), {
          fontFamily: 'system-ui, sans-serif', fontSize: '8px', fontStyle: 'normal',
          color: '#f1f4ed', stroke: '#17251b', strokeThickness: 2, align: 'center'
        });
        levelLabel.setOrigin(0.5, 1);
        levelLabel.setDepth(sprite.depth + 20);
        const hpBarWidth = Math.max(30, displayWidth + 6);
        const hpBarBg = this.scene.add.rectangle(x, y + 6, hpBarWidth, 5, 0x1a0f0f, 1);
        hpBarBg.setDepth(sprite.depth + 21);
        hpBarBg.setStrokeStyle(1, 0x000000, 0.85);
        const hpBarFill = this.scene.add.rectangle(x - hpBarWidth / 2, y + 6, hpBarWidth, 3, 0x3ddc5f, 1);
        hpBarFill.setOrigin(0, 0.5);
        hpBarFill.setDepth(sprite.depth + 22);
        return { sprite, levelLabel, hpBarBg, hpBarFill, hpBarWidth };
      }

      // V140 — POOL: devolve o visual ao pool em vez de destruir.
      releaseMonsterVisual(monsterId, visual) {
        if (!visual || !visual.sprite) return;
        const pool = this.monsterVisualPool[monsterId];
        if (!pool) { if (visual.sprite.destroy) visual.sprite.destroy(); return; }
        if (pool.length >= this.monsterVisualPoolMax) {
          if (visual.sprite.destroy) visual.sprite.destroy();
          if (visual.levelLabel && visual.levelLabel.destroy) visual.levelLabel.destroy();
          if (visual.hpBarBg && visual.hpBarBg.destroy) visual.hpBarBg.destroy();
          if (visual.hpBarFill && visual.hpBarFill.destroy) visual.hpBarFill.destroy();
          return;
        }
        const s = visual.sprite;
        s.setAlpha(1); s.setAngle(0); s.clearTint(); s.setScale(1, 1); s.setVisible(false);
        if (visual.levelLabel) visual.levelLabel.setVisible(false);
        if (visual.hpBarBg) visual.hpBarBg.setVisible(false);
        if (visual.hpBarFill) visual.hpBarFill.setVisible(false);
        pool.push(visual);
      }

      // V140 — POOL de efeitos: pega um círculo pronto ou cria novo.
      acquireHitCircle(x, y, radius, color, alpha, depth) {
        let c = null;
        if (this.hitEffectPool.length) {
          c = this.hitEffectPool.pop();
          c.setPosition(x, y); c.setRadius(radius); c.setFillStyle(color, alpha);
          c.setDepth(depth); c.setAlpha(alpha); c.setScale(1, 1); c.setVisible(true);
        } else {
          c = this.scene.add.circle(x, y, radius, color, alpha);
          c.setDepth(depth);
        }
        return c;
      }
      releaseHitCircle(c) {
        if (!c) return;
        if (this.hitEffectPool.length >= 24) { if (c.destroy) c.destroy(); return; }
        c.setVisible(false); c.setAlpha(0);
        this.hitEffectPool.push(c);
      }

      spawnOneMonsterForChunk(chunkX, chunkY, monsterId, saved) {
        const chunkId = this.getChunkId(chunkX, chunkY);
        const definition = this.data.MONSTERS[monsterId];
        if (!definition || !this.monsterTextureKeys[monsterId]) return false;
        if (this.getAliveCountForChunk(chunkId) >= this.maxMonstersPerChunk) return false;
        if (this.getAliveCountForChunk(chunkId, monsterId) >= ((this.maxPerType && this.maxPerType[monsterId]) || this.maxPerMonsterType)) return false;

        // V76: se veio do save, reusa tile/nivel/HP salvos; senao rola novo.
        const savedTile = saved && saved.tile && Number.isInteger(saved.tile.x) && Number.isInteger(saved.tile.y) ? { x: saved.tile.x, y: saved.tile.y } : null;
        const candidates = this.getSpawnCandidates(chunkX, chunkY);
        const tile = savedTile || candidates[0];
        if (!tile) return false;

        const sequence = this.nextMonsterSequence++;
        const id = `monster-${monsterId}-${chunkX}-${chunkY}-${String(sequence).padStart(4, '0')}`;
        const x = (tile.x + 0.5) * this.tileSize;
        const y = (tile.y + 0.5) * this.tileSize;
        // Every new spawn, including respawns, rolls only level 1 or 2.
        // Level 2 is less common and gains durability, damage, defense and XP.
        // V76: restauracao usa o nivel salvo, sem re-rolar.
        const level = saved && (saved.level === 1 || saved.level === 2) ? saved.level : (Math.random() < 0.30 ? 2 : 1);
        const levelMultiplier = level === 2 ? {
          hp: 1.5, attack: 1.25, defense: 1, xp: 1.5
        } : { hp: 1, attack: 1, defense: 0, xp: 1 };
        let maxHp = Math.max(1, Math.round(definition.hp * levelMultiplier.hp));
        let attack = Math.max(0, Math.round((definition.attack ?? definition.damage ?? 0) * levelMultiplier.attack));
        let defense = Math.max(0, (definition.defense || 0) + levelMultiplier.defense);
        let xpReward = Math.max(0, Math.round(definition.xp * levelMultiplier.xp));
        this.entities.create({
          id,
          kind: 'monster',
          tile,
          statusId: id,
          data: {
            monsterId,
            level,
            originChunkId: chunkId,
            originChunkX: chunkX,
            originChunkY: chunkY
          }
        });
        this.status.register(id, {
          hp: saved && Number.isFinite(Number(saved.hp)) ? Math.max(1, Math.min(maxHp, Math.floor(Number(saved.hp)))) : maxHp, maxHp,
          energy: 0, maxEnergy: 0,
          attack,
          defense,
          penetration: definition.penetration || 0,
          attackSpeed: definition.attackSpeed || 1,
          moveSpeed: definition.moveSpeed ?? definition.speed ?? 0,
          hpRegenOutOfCombat: definition.hpRegenOutOfCombat || 0,
          energyRegen: definition.energyRegen || 0
        });

        const displayWidth = definition.displayWidth || 30;
        const displayHeight = definition.displayHeight || 24;
        // V140 — POOL: reusa sprite + rótulo + barra em vez de criar 4 novos.
        const _visual = this.acquireMonsterVisual(monsterId, x, y, level, displayWidth, displayHeight);
        const sprite = _visual.sprite;
        const levelLabel = _visual.levelLabel;
        // V77: barra de HP embaixo do monstro, proporcional ao tamanho do sprite.
        const hpBarWidth = _visual.hpBarWidth;
        const hpBarBg = _visual.hpBarBg;
        const hpBarFill = _visual.hpBarFill;
        const record = {
          id,
          monsterId,
          displayHeight,
          level,
          xpReward,
          definition,
          tile: { x: tile.x, y: tile.y },
          sprite,
          levelLabel,
          hpBarBg,
          hpBarFill,
          hpBarWidth,
          animation: {
            state: null, facing: 0, tween: null,
            baseScaleX: sprite.scaleX || 1, baseScaleY: sprite.scaleY || 1
          },
          path: [],
          targetKey: null,
          nextPathAt: 0,
          nextAttackAt: 0,
          alive: true,
          lastEntityTileKey: `${tile.x},${tile.y}`,
          // Immutable ownership: never recompute from the monster's current tile.
          originChunkId: chunkId,
          originChunkX: chunkX,
          originChunkY: chunkY
        };
        this.monsters.set(id, record);
        this.updateMonsterHpBar(record);
        this.setMonsterAnimation(record, 'idle');
        const population = this.getChunkPopulationState(chunkId);
        population.totalSpawned += 1;
        this.events.emit('monster:spawned', {
          entityId: id,
          monsterId,
          level,
          tile,
          originChunkId: chunkId,
          originChunkX: chunkX,
          originChunkY: chunkY
        });
        return id;
      }

      // V76: monstros passam a fazer parte do save.
      snapshotMonsters() {
        const list = [];
        for (const record of this.monsters.values()) {
          if (!record || !record.alive) continue;
          const hp = this.status ? this.status.getStat(record.id, 'hp') : null;
          list.push({
            monsterId: record.monsterId, level: record.level,
            tile: { x: record.tile.x, y: record.tile.y },
            hp: Number.isFinite(Number(hp)) ? Math.max(0, Math.floor(Number(hp))) : null,
            originChunkId: record.originChunkId || this.getChunkId(record.originChunkX, record.originChunkY),
            originChunkX: record.originChunkX, originChunkY: record.originChunkY,
            xpReward: record.xpReward
          });
        }
        const respawns = [];
        for (const [chunkId, queue] of this.chunkRespawns.entries()) {
          if (!queue || !queue.pending) continue;
          respawns.push({ chunkId, chunkX: queue.chunkX, chunkY: queue.chunkY, pending: queue.pending, pendingByMonster: { ...(queue.pendingByMonster || {}) } });
        }
        return { list, respawns };
      }
      scheduleMonsterSave() {
        if (!this.active) return;
        if (this.monsterSaveTimer) return;
        this.monsterSaveTimer = setTimeout(() => {
          this.monsterSaveTimer = null;
          try { if (this.progress && this.progress.update) this.progress.update('monsters', this.snapshotMonsters()); } catch (e) { /* save de monstro nao pode quebrar o jogo */ }
        }, 800);
      }
      restoreOrPopulate() {
        let saved = null;
        try { saved = this.progress ? this.progress.get('monsters') : null; } catch (e) { saved = null; }
        const list = saved && Array.isArray(saved.list) ? saved.list.filter(m => m && this.monsterTypes.includes(m.monsterId)) : [];
        if (list.length) {
          // Restaura monstros salvos nas posicoes exatas, sem re-rolar nivel/HP.
          for (const m of list) {
            const fallback = (m.tile && this.getChunkForTile(m.tile)) || { chunkX: 0, chunkY: 0 };
            const cx = Number.isInteger(m.originChunkX) ? m.originChunkX : fallback.chunkX;
            const cy = Number.isInteger(m.originChunkY) ? m.originChunkY : fallback.chunkY;
            this.spawnOneMonsterForChunk(cx, cy, m.monsterId, m);
          }
          // Respawns pendentes: recria a fila (timer recomeça em 5s, posicao/tipo preservados).
          if (Array.isArray(saved.respawns)) {
            for (const r of saved.respawns) {
              if (!r || !Number.isInteger(r.pending) || r.pending <= 0) continue;
              const q = { chunkX: r.chunkX, chunkY: r.chunkY, pending: r.pending, pendingByMonster: { slime: 0, monkey: 0, rat: 0, ...(r.pendingByMonster || {}) }, nextAt: this.now + this.respawnDelayMs };
              this.chunkRespawns.set(r.chunkId || this.getChunkId(r.chunkX, r.chunkY), q);
            }
          }
          // Completa chunks que ficaram abaixo do minimo (ex.: monstro morto sem respawn salvo).
          this.populateAllChunks();
          return;
        }
        this.populateAllChunks();
        this.scheduleMonsterSave();
      }
      populateAllChunks() {
        for (let chunkY = 0; chunkY < this.chunkGrid.rows; chunkY += 1) {
          for (let chunkX = 0; chunkX < this.chunkGrid.columns; chunkX += 1) {
            const chunkId = this.getChunkId(chunkX, chunkY);
            const population = this.getChunkPopulationState(chunkId);
            if (population.initialSpawnAttempted) continue;
            population.initialSpawnAttempted = true;
            // V145 — rodízio por chunk: a ordem de spawn gira com o chunk, senão
            // as 5 primeiras espécies lotariam o chunk (teto 10) e as outras nunca nasceriam.
            const rotation = (chunkX + chunkY * this.chunkGrid.columns) % this.monsterTypes.length;
            const orderedTypes = this.monsterTypes.slice(rotation).concat(this.monsterTypes.slice(0, rotation));
            for (const monsterId of orderedTypes) {
              for (let count = 0; count < this.maxPerMonsterType; count += 1) {
                if (!this.spawnOneMonsterForChunk(chunkX, chunkY, monsterId)) break;
              }
            }
            if (this.getAliveCountForChunk(chunkId) < this.maxMonstersPerChunk) {
              population.initialFillPending = true;
              population.initialRetryAt = this.now + this.spawnRetryDelayMs;
            }
          }
        }
      }

      updateInitialChunkFill() {
        for (const [chunkId, population] of this.chunkPopulation.entries()) {
          if (!population.initialFillPending || this.now < population.initialRetryAt) continue;
          const [chunkX, chunkY] = chunkId.split(':').map(Number);
          const queue = this.chunkRespawns.get(chunkId);
          let needsRetry = false;

          const rotation = (chunkX + chunkY * this.chunkGrid.columns) % this.monsterTypes.length;
          const orderedTypes = this.monsterTypes.slice(rotation).concat(this.monsterTypes.slice(0, rotation));
          for (const monsterId of orderedTypes) {
            const queued = queue && queue.pendingByMonster ? (queue.pendingByMonster[monsterId] || 0) : 0;
            let available = this.maxPerMonsterType -
              this.getAliveCountForChunk(chunkId, monsterId) - queued;
            while (available > 0) {
              if (!this.spawnOneMonsterForChunk(chunkX, chunkY, monsterId)) {
                needsRetry = true;
                break;
              }
              available -= 1;
            }
          }

          const totalAlive = this.getAliveCountForChunk(chunkId);
          const totalQueued = queue ? queue.pending : 0;
          if (totalAlive + totalQueued >= this.maxMonstersPerChunk) {
            population.initialFillPending = false;
          } else {
            population.initialRetryAt = this.now + this.spawnRetryDelayMs;
          }
        }
      }

      scheduleChunkRespawn(record) {
        if (!record || !record.originChunkId || !this.monsterTypes.includes(record.monsterId)) return false;
        const chunkId = record.originChunkId;
        let queue = this.chunkRespawns.get(chunkId);
        if (!queue) {
          queue = {
            chunkX: record.originChunkX,
            chunkY: record.originChunkY,
            pending: 0,
            pendingByMonster: { slime: 0, monkey: 0, rat: 0 },
            nextAt: this.now + this.respawnDelayMs
          };
          this.chunkRespawns.set(chunkId, queue);
        }
        const currentAlive = this.getAliveCountForChunk(chunkId);
        const reserved = queue.pending;
        if (currentAlive + reserved >= this.maxMonstersPerChunk) return false;
        queue.pending += 1;
        queue.pendingByMonster[record.monsterId] =
          (queue.pendingByMonster[record.monsterId] || 0) + 1;
        this.events.emit('monster:respawn-queued', {
          originChunkId: chunkId,
          monsterId: record.monsterId,
          pending: queue.pending,
          respawnAt: queue.nextAt
        });
        return true;
      }

      updateChunkRespawns() {
        for (const [chunkId, queue] of Array.from(this.chunkRespawns.entries())) {
          if (!queue || queue.pending <= 0) {
            this.chunkRespawns.delete(chunkId);
            continue;
          }
          if (this.now < queue.nextAt) continue;
          if (this.getAliveCountForChunk(chunkId) >= this.maxMonstersPerChunk) {
            // The chunk is temporarily full: preserve the death reservation
            // and its species, then retry when a slot may become available.
            queue.nextAt = this.now + this.spawnRetryDelayMs;
            continue;
          }

          const monsterId = this.monsterTypes.find(type =>
            queue.pendingByMonster && queue.pendingByMonster[type] > 0
          );
          if (!monsterId) {
            this.chunkRespawns.delete(chunkId);
            continue;
          }

          const spawned = this.spawnOneMonsterForChunk(queue.chunkX, queue.chunkY, monsterId, null);
          if (!spawned) {
            // Retain the species reservation and retry later if no safe tile exists.
            queue.nextAt = this.now + this.spawnRetryDelayMs;
            continue;
          }

          queue.pending -= 1;
          queue.pendingByMonster[monsterId] -= 1;
          if (queue.pending <= 0) {
            this.chunkRespawns.delete(chunkId);
          } else {
            queue.nextAt = this.now + this.respawnDelayMs;
          }
          this.events.emit('monster:respawned', {
            originChunkId: chunkId,
            monsterId,
            pending: queue.pending
          });
        }
      }

      getPlayerPoint() {
        const tile = this.world.getPlayerBodyTile();
        if (!tile) return null;
        return { tile, x: (tile.x + 0.5) * this.tileSize, y: (tile.y + 0.5) * this.tileSize };
      }

      getLivingMonster() {
        for (const record of this.monsters.values()) if (record.alive) return record;
        return null;
      }

      effectiveAttackRange() {
        const buffs = window.CONQUISTADOR_WAIFU_BUFFS;
        const ranged = buffs && Date.now() < (buffs.monkeyRangedUntil || 0);
        return this.attackRange + (ranged ? 120 : 0);
      }

      getNearestMonsterInRange(playerPoint) {
        if (!playerPoint) return null;
        let nearest = null;
        let nearestDistance = Infinity;
        for (const record of this.monsters.values()) {
          if (!record.alive || !record.sprite || !record.sprite.active) continue;
          const distance = Math.hypot(
            record.sprite.x - playerPoint.x,
            record.sprite.y - playerPoint.y
          );
          if (distance <= this.effectiveAttackRange() && distance < nearestDistance) {
            nearest = record;
            nearestDistance = distance;
          }
        }
        return nearest;
      }

      getNearestMonsterForApproach(playerPoint) {
        if (!playerPoint) return null;
        let nearest = null;
        let nearestDistance = Infinity;
        for (const record of this.monsters.values()) {
          if (!record.alive || !record.sprite || !record.sprite.active) continue;
          const distance = Math.hypot(
            record.sprite.x - playerPoint.x,
            record.sprite.y - playerPoint.y
          );
          if (distance <= this.playerApproachRange && distance < nearestDistance) {
            nearest = record;
            nearestDistance = distance;
          }
        }
        return nearest;
      }

      autoAttackNearbyMonster() {
        if (!this.active) return false;
        if (this.manualDestinationActive) {
          this.pendingPlayerAttack = null;
          this.approachTargetId = null;
          return false;
        }
        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return false;

        const target = this.getNearestMonsterForApproach(playerPoint);
        if (!target) {
          if (this.approachTargetId) {
            this.events.emit('player:combat-stop', { targetId: this.approachTargetId });
            this.approachTargetId = null;
          }
          return false;
        }

        const distance = Math.hypot(
          target.sprite.x - playerPoint.x,
          target.sprite.y - playerPoint.y
        );

        if (distance > this.effectiveAttackRange() - 5) {
          this.pendingPlayerAttack = null;
          if (this.approachTargetId !== target.id ||
              this.now - this.lastApproachRequestAt >= 700) {
            this.approachTargetId = target.id;
            this.lastApproachRequestAt = this.now;
            this.events.emit('player:combat-move-request', {
              targetId: target.id,
              tileX: target.tile.x,
              tileY: target.tile.y
            });
          }
          return false;
        }

        if (this.approachTargetId) {
          this.events.emit('player:combat-stop', { targetId: this.approachTargetId });
          this.approachTargetId = null;
        }
        const currentAttackCooldown = this.status.getAttackCooldown('player');
        if (this.pendingPlayerAttack || this.now - this.lastPlayerAttackAt < currentAttackCooldown) {
          return false;
        }
        return this.playerAttack(target);
      }

      playerAttack(targetRecord = null) {
        if (!this.active || this.pendingPlayerAttack) return false;
        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return false;
        const record = targetRecord || this.getNearestMonsterInRange(playerPoint);
        if (!record || !record.alive || !record.sprite || !record.sprite.active) return false;
        const distance = Math.hypot(record.sprite.x - playerPoint.x, record.sprite.y - playerPoint.y);
        if (distance > this.effectiveAttackRange()) return false;

        this.lastPlayerAttackAt = this.now;
        this.pendingPlayerAttack = {
          targetId: record.id,
          hitAt: this.now + this.playerAttackWindupMs
        };
        this.events.emit('player:combat-attack-animation', {
          targetId: record.id,
          x: record.sprite.x,
          y: record.sprite.y
        });
        return true;
      }

      resolvePendingPlayerAttack() {
        const pending = this.pendingPlayerAttack;
        if (!pending || this.now < pending.hitAt) return false;
        this.pendingPlayerAttack = null;
        const record = this.monsters.get(pending.targetId);
        if (!record || !record.alive || !record.sprite || !record.sprite.active) return false;

        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return false;
        const distance = Math.hypot(record.sprite.x - playerPoint.x, record.sprite.y - playerPoint.y);
        if (distance > this.effectiveAttackRange() + 8) return false;

        const baseDamage = this.status.calculateDamage('player', record.id);
        if (baseDamage === null) return false;
        // V80: Chuva de Sinos ativa — ataque básico causa 1,1x do dano.
        const buffs = window.CONQUISTADOR_WAIFU_BUFFS;
        const ranged = buffs && Date.now() < (buffs.monkeyRangedUntil || 0);
        const damage = Math.max(1, Math.floor(baseDamage * (ranged ? 1.1 : 1)));
        const result = this.status.applyDamage(record.id, damage, 'player');
        if (!result) return false;

        this.showMonsterHitEffect(record);
        this.events.emit('combat:hit', {
          attackerId: 'player',
          targetId: record.id,
          damage,
          remainingHp: result.hp
        });
        if (result.defeated) this.killMonster(record, 'player');
        this.refreshUI();
        return true;
      }

      showMonsterHitEffect(record) {
        if (!record || !record.sprite || !record.sprite.active) return;
        const sprite = record.sprite;
        sprite.setTintFill(0xff6666);
        this.scene.time.delayedCall(65, () => {
          if (sprite.active) sprite.clearTint();
        });

        // Small, localized impact burst: three tiny red sparks and a brief
        // warm flash, visually contained within the monster's sprite bounds.
        // V140 — POOL: círculo do impacto reutilizado.
        const burst = this.acquireHitCircle(sprite.x, sprite.y - 5, 3, 0xffd18a, 0.9, sprite.depth + 5);
        this.scene.tweens.add({
          targets: burst,
          scale: 1.7,
          alpha: 0,
          duration: 115,
          ease: 'Quad.Out',
          onComplete: () => this.releaseHitCircle(burst)
        });

        for (let i = 0; i < 3; i += 1) {
          const angle = (-Math.PI * 0.8) + (i / 2) * (Math.PI * 0.6);
          // V140 — POOL: partícula reutilizada.
          const particle = this.acquireHitCircle(sprite.x, sprite.y - 5, 1.25, i === 1 ? 0xf06a62 : 0xc83e42, 0.95, sprite.depth + 6);
          this.scene.tweens.add({
            targets: particle,
            x: sprite.x + Math.cos(angle) * 5,
            y: sprite.y - 5 + Math.sin(angle) * 5,
            alpha: 0,
            scale: 0.45,
            duration: 135,
            ease: 'Quad.Out',
            onComplete: () => this.releaseHitCircle(particle)
          });
        }

        // Minimal recoil: only a 2px nudge, without shifting the entity tile.
        this.scene.tweens.killTweensOf(sprite);
        const playerPoint = this.getPlayerPoint();
        const dx = sprite.x - (playerPoint ? playerPoint.x : sprite.x);
        const dy = sprite.y - (playerPoint ? playerPoint.y : sprite.y);
        const length = Math.max(1, Math.hypot(dx, dy));
        this.scene.tweens.add({
          targets: sprite,
          x: sprite.x + (dx / length) * 2,
          y: sprite.y + (dy / length) * 2,
          duration: 45,
          yoyo: true,
          ease: 'Quad.Out'
        });
      }

      killMonster(record, killerId) {
        if (!record || !record.alive) return false;
        record.alive = false;
        if (record.animation && record.animation.tween && record.animation.tween.isPlaying()) {
          record.animation.tween.stop();
        }
        if (this.approachTargetId === record.id) {
          this.events.emit('player:combat-stop', { targetId: record.id });
          this.approachTargetId = null;
        }
        if (this.pendingPlayerAttack && this.pendingPlayerAttack.targetId === record.id) {
          this.pendingPlayerAttack = null;
        }
        const tile = { x: record.tile.x, y: record.tile.y };
        this.scheduleChunkRespawn(record);
        // LevelSystem is the only entity:die subscriber that awards XP.
        this.events.emit('entity:die', {
          entityId: record.id,
          killerId,
          monsterId: record.monsterId,
          level: record.level,
          xp: record.xpReward,
          tile
        });
        this.events.emit('monster:died', { entityId: record.id, monsterId: record.monsterId, level: record.level, killerId, tile });
        this.createDrop(record);
        this.entities.remove(record.id); // StatusSystem cleans up this entity's status.
        this.monsters.delete(record.id);
        // V140 — POOL: esconde rótulo/barra na hora e devolve o conjunto
        // ao pool ao fim da animação de morte, em vez de destruir tudo.
        if (record.levelLabel) record.levelLabel.setVisible(false);
        if (record.hpBarBg) record.hpBarBg.setVisible(false);
        if (record.hpBarFill) record.hpBarFill.setVisible(false);
        if (record.sprite && record.sprite.active) {
          const deathSprite = record.sprite;
          const deathVisual = { sprite: deathSprite, levelLabel: record.levelLabel, hpBarBg: record.hpBarBg, hpBarFill: record.hpBarFill, hpBarWidth: record.hpBarWidth };
          const deathMonsterId = record.monsterId;
          // V145 — frame de morte antes do fade.
          const deathKeys = this.monsterFrameKeys && this.monsterFrameKeys[deathMonsterId];
          if (deathKeys && this.scene.textures && this.scene.textures.exists(deathKeys.death)) {
            const dw = deathSprite.displayWidth, dh = deathSprite.displayHeight;
            deathSprite.setTexture(deathKeys.death);
            deathSprite.setDisplaySize(dw, dh);
          }
          this.scene.tweens.killTweensOf(deathSprite);
          this.scene.tweens.add({
            targets: deathSprite,
            alpha: 0,
            scaleX: 0.35,
            scaleY: 0.35,
            angle: (deathSprite.x % 2 ? 12 : -12),
            duration: 260,
            ease: 'Back.In',
            onComplete: () => this.releaseMonsterVisual(deathMonsterId, deathVisual)
          });
        }

        return true;
      }

      createDrop(record) {
        const itemId = record.definition.dropId;
        const dropDefinition = itemId && this.data.ITEMS[itemId];
        if (!dropDefinition) return false;
        const dropId = `drop-${record.id}-${itemId}`;
        const glyphByMonster = { slime: '◆', monkey: '✦', rat: '●' };
        const colorByMonster = { slime: '#a8f3d1', monkey: '#e7bd83', rat: '#d2c9d8' };
        const sprite = this.scene.add.text(
          record.sprite.x, record.sprite.y - 8, glyphByMonster[record.monsterId] || '◆', {
            fontFamily: 'system-ui, sans-serif', fontSize: '18px',
            color: colorByMonster[record.monsterId] || '#ffffff',
            stroke: '#30251c', strokeThickness: 3
          }
        );
        sprite.setDepth(record.sprite.y + 20);
        this.drops.set(dropId, {
          id: dropId,
          itemId,
          quantity: 1,
          x: record.sprite.x,
          y: record.sprite.y,
          sprite
        });
        this.events.emit('item:dropped', {
          dropId, itemId, quantity: 1, tile: record.tile, sourceMonsterId: record.monsterId
        });
        this.collectNearbyDrops();
        return true;
      }

      collectNearbyDrops() {
        const playerPoint = this.getPlayerPoint();
        if (!playerPoint) return;
        for (const drop of this.drops.values()) {
          if (drop.pendingCommit || this.now < (drop.retryAt || 0)) continue;
          if (Math.hypot(drop.x - playerPoint.x, drop.y - playerPoint.y) > 48) continue;
          const currentItems = this.progress.get('items') || [];
          const items = Array.isArray(currentItems) ? currentItems.map(item => ({ ...item })) : [];
          const existing = items.find(item => item && item.id === drop.itemId);
          if (existing) existing.quantity = Math.max(0, Number(existing.quantity) || 0) + drop.quantity;
          else items.push({ id: drop.itemId, quantity: drop.quantity });
          // Keep the ground drop until SaveSystem V4 confirms the inventory write.
          // If the protected save gate is closed, the drop remains available.
          const result = this.progress.update('items', items);
          if (result === 'pending' || result === true) {
            drop.pendingCommit = true;
            drop.pendingSince = this.now;
          } else {
            drop.retryAt = this.now + 1000;
            this.setMessage('Drop aguardando salvamento seguro.', 1800);
          }
        }
      }

      finalizePendingDrops() {
        for (const [dropId, drop] of Array.from(this.drops.entries())) {
          if (!drop.pendingCommit) continue;
          if (drop.sprite && drop.sprite.destroy) drop.sprite.destroy();
          this.drops.delete(dropId);
          this.events.emit('item:collected', {
            itemId: drop.itemId, quantity: drop.quantity, source: 'monster-drop'
          });
          const item = this.data.ITEMS[drop.itemId];
          this.setMessage(`${item ? item.name : drop.itemId} +${drop.quantity}`, 2400);
        }
      }

      setMessage(message, duration = 1800) {
        this.message = String(message || '');
        this.messageUntil = this.now + Math.max(0, duration);
        this.refreshUI();
      }

      refreshUI() {
        if (!this.playerLine || !this.monsterLine) return;
        const hp = this.status.getStat('player', 'hp') ?? 0;
        const maxHp = this.status.getStat('player', 'maxHp') ?? 0;
        const level = this.api.levels.snapshot('player');
        this.playerLine.textContent = `HP ${Math.ceil(hp)}/${Math.ceil(maxHp)}  •  Nv ${level.level}  •  XP ${level.xp}/${level.xpToNext}`;
        const livingMonsters = Array.from(this.monsters.values()).filter(record => record.alive);
        if (livingMonsters.length) {
          const target = livingMonsters[0];
          const targetHp = this.status.getStat(target.id, 'hp') ?? 0;
          this.monsterLine.textContent = `MONSTROS ${livingMonsters.length}  •  ALVO ${Math.ceil(targetHp)}/${target.definition.hp} HP`;
        } else {
          const pendingDrop = Array.from(this.drops.values()).some(drop => drop.pendingCommit);
          this.monsterLine.textContent = pendingDrop
            ? 'SEM MONSTROS  •  salvando drops…'
            : 'SEM MONSTROS  •  aguardando respawn';
        }
        this.messageLine.textContent = this.now <= this.messageUntil ? this.message : '';
      }

      updateMonsterLevelLabel(record) {
        const label = record && record.levelLabel;
        const sprite = record && record.sprite;
        if (!label || !label.active || !sprite || !sprite.active) return;
        const height = record.displayHeight || record.definition.displayHeight || 24;
        label.setPosition(sprite.x, sprite.y - height * 0.86 - 4);
        label.setDepth(sprite.depth + 20);
        this.updateMonsterHpBar(record);
      }
      // V77: barra de HP embaixo do monstro, segue o sprite e muda de cor com o HP.
      updateMonsterHpBar(record) {
        const sprite = record && record.sprite;
        const bg = record && record.hpBarBg;
        const fill = record && record.hpBarFill;
        if (!sprite || !sprite.active || !bg || !bg.active || !fill || !fill.active) return;
        const maxHp = Math.max(1, Number(this.status.getStat(record.id, 'maxHp')) || 1);
        const hp = Math.max(0, Math.min(maxHp, Number(this.status.getStat(record.id, 'hp')) || 0));
        const pct = hp / maxHp;
        const w = record.hpBarWidth || 36;
        const y = sprite.y + 6;
        bg.setPosition(sprite.x, y);
        bg.setDepth(sprite.depth + 21);
        fill.setPosition(sprite.x - w / 2, y);
        fill.setDepth(sprite.depth + 22);
        fill.width = Math.max(0, w * pct);

      updateMonster(record, playerPoint, time, delta) {

        const dyToPlayer = playerPoint.y - record.sprite.y;
        const distance = Math.hypot(dxToPlayer, dyToPlayer);

          record.targetKey = null;

        }

          }

            record.nextAttackAt = time + cooldown;

        if (record.targetKey !== targetKey || time >= record.nextPathAt) {
          const start = {
            x: Math.floor(record.sprite.x / this.tileSize),
            y: Math.floor(record.sprite.y / this.tileSize)
          };
          const route = this.world.findPath(start, playerPoint.tile, { profile: 'player' });
          record.path = Array.isArray(route) ? route.map(tile => ({ x: tile.x, y: tile.y })) : [];
          record.targetKey = targetKey;
          record.nextPathAt = time + 650;
        }
        const stepSeconds = Math.max(0, Math.min(delta, 100)) / 1000;
        let target = record.path[0];
        while (target) {
          const targetX = (target.x + 0.5) * this.tileSize;
          const targetY = (target.y + 0.5) * this.tileSize;
          const dx = targetX - record.sprite.x;
          const dy = targetY - record.sprite.y;
          const distanceToWaypoint = Math.hypot(dx, dy);
          if (distanceToWaypoint <= 2) {
            record.path.shift();
            target = record.path[0];
            continue;
          }
          const monsterSpeed = this.status.getStat(record.id, 'speed') ?? record.definition.speed;
          const travel = Math.min(distanceToWaypoint, monsterSpeed * stepSeconds);
          record.sprite.setPosition(
            record.sprite.x + dx / distanceToWaypoint * travel,
            record.sprite.y + dy / distanceToWaypoint * travel
          );
          this.setMonsterAnimation(record, 'walk', dxToPlayer, dyToPlayer);
          record.sprite.setDepth(record.sprite.y + 10);
          break;
        }
        if (!target && record.animation && record.animation.state !== 'attack') {
          this.setMonsterAnimation(record, 'idle');
        }
        const tile = {
          x: Math.floor(record.sprite.x / this.tileSize),
          y: Math.floor(record.sprite.y / this.tileSize)

      // V120 — monstro só renderiza no chunk carregado. Antes, o monstro
      // continuava visível no chunk descarregado e flutuava sobre o vazio
      // (a área sem render era verde, então parecia chão). O chunk vem do
      // tile atual (record.tile atualiza quando o monstro anda). A IA não
      // muda: monstro em chunk descarregado está a 2+ chunks do jogador,
      // fora do alcance de agro (260px) — não ataca invisível.
      syncMonsterChunkVisibility() {
        const active = this.scene && this.scene.activeChunkIds;
        if (!active) return;
        const size = this.chunkGrid.chunkSize || 30;
        for (const record of this.monsters.values()) {
          if (!record || !record.alive || !record.sprite) continue;
          const tile = record.tile;
          if (!tile) continue;
          const chunkId = this.getChunkId(Math.floor(tile.x / size), Math.floor(tile.y / size));
          const visible = active.has(chunkId);
          if (record.sprite.visible !== visible) {
            record.sprite.visible = visible;
            if (record.levelLabel) record.levelLabel.visible = visible;
            if (record.hpBarBg) record.hpBarBg.visible = visible;
            if (record.hpBarFill) record.hpBarFill.visible = visible;
          }

      }

      // V141 — CULLING: fora da câmera + margem = dormindo. Retorna true
      // e o update() pula TODO o trabalho do monstro (IA, path, rótulo).
      // Sem câmera (teste / cena sem render) = nunca dorme, jogo igual.

        const view = cam && cam.worldView;
        if (!view) return false;
        const m = this.cullMarginPx || 96;
        return record.sprite.x < view.x - m || record.sprite.x > view.x + view.width + m ||
          record.sprite.y < view.y - m || record.sprite.y > view.y + view.height + m;
      }

      update(time, delta) {
        if (!this.active) return;
        this.now = Number.isFinite(time) ? time : this.now + (Number(delta) || 0);
        this.status.updateRegeneration(Number(delta) || 0, Date.now());
        this.updateAutoAttackIndicator();
        this.updateInitialChunkFill();
        this.updateChunkRespawns();
        const playerPoint = this.getPlayerPoint();
        if (playerPoint) {
          for (const record of Array.from(this.monsters.values())) {
            // V141 — CULLING: dorme antes de qualquer custo. Limpa o
            // caminho para não retomar rota velha ao acordar; animação
            // idle só é aplicada 1x (evita re-setar anim todo frame).
            if (this.isMonsterCulled(record)) {
              if (record.path && record.path.length) { record.path = []; record.targetKey = null; }
              if (!record.animation || record.animation.state !== 'idle') this.setMonsterAnimation(record, 'idle');
              continue;
            }
            this.updateMonster(record, playerPoint, this.now, Number(delta) || 0);
            this.updateMonsterLevelLabel(record);
          }
          this.resolvePendingPlayerAttack();
          this.autoAttackNearbyMonster();
          this.collectNearbyDrops();
        }
        this.syncMonsterChunkVisibility();
        if (this.now > this.messageUntil && this.message) {
          this.message = '';
          this.refreshUI();
        }
      }

      destroy() {
        if (!this.active) return;
        this.active = false;
        if (this.monsterSaveTimer) { clearTimeout(this.monsterSaveTimer); this.monsterSaveTimer = null; }
        for (const unsubscribe of this.unsubscribers || []) unsubscribe();
        this.unsubscribers = [];
        if (this.scene && this.scene.events) {
          this.scene.events.off('update', this.boundUpdate);
          this.scene.events.off('shutdown', this.boundDestroy);
        }
        for (const record of this.monsters.values()) {
          if (record.levelLabel && record.levelLabel.destroy) record.levelLabel.destroy();
          if (record.hpBarBg && record.hpBarBg.destroy) record.hpBarBg.destroy();
          if (record.hpBarFill && record.hpBarFill.destroy) record.hpBarFill.destroy();
          if (record.sprite && record.sprite.destroy) record.sprite.destroy();
          this.entities.remove(record.id);
        }
        // V140 — POOL: destrói também os visuais guardados no pool.
        for (const key of Object.keys(this.monsterVisualPool || {})) {
          for (const v of this.monsterVisualPool[key]) {
            if (v.sprite && v.sprite.destroy) v.sprite.destroy();
            if (v.levelLabel && v.levelLabel.destroy) v.levelLabel.destroy();
            if (v.hpBarBg && v.hpBarBg.destroy) v.hpBarBg.destroy();
            if (v.hpBarFill && v.hpBarFill.destroy) v.hpBarFill.destroy();
          }
          this.monsterVisualPool[key] = [];
        }
        for (const c of this.hitEffectPool || []) { if (c && c.destroy) c.destroy(); }
        this.hitEffectPool = [];
        for (const drop of this.drops.values()) if (drop.sprite && drop.sprite.destroy) drop.sprite.destroy();
        this.monsters.clear();
        this.drops.clear();
        this.pendingPlayerAttack = null;
        this.approachTargetId = null;
        if (this.uiRoot && this.uiRoot.remove) this.uiRoot.remove();
        if (this.autoAttackBadge && this.autoAttackBadge.remove) this.autoAttackBadge.remove();
      }
    }

    const GameData = Object.freeze({
      // V140 — MONSTERS vem de data/monsters.json (window.CONQUISTADOR_DATA).
      // A cópia embutida abaixo é fallback: se data/ ainda não foi subida,
      // o jogo usa estes valores idênticos aos da V140 e continua igual.
      MONSTERS: Object.freeze((function () {
        const fromData = root.CONQUISTADOR_DATA && root.CONQUISTADOR_DATA.monsters && root.CONQUISTADOR_DATA.monsters.monsters;
        const src = fromData || {
          slime: { id: 'slime', name: 'Slime', hp: 30, damage: 5, defense: 0, xp: 12, speed: 50, dropId: 'slime_gel', displayWidth: 30, displayHeight: 24 },
          monkey: { id: 'monkey', name: 'Macaco', hp: 45, damage: 5, defense: 1, xp: 25, speed: 65, attackSpeed: 0.8, dropId: 'monkey_fur', displayWidth: 30, displayHeight: 32 },
          rat: { id: 'rat', name: 'Rato', hp: 20, damage: 4, defense: 0, xp: 8, speed: 75, dropId: 'rat_tail', displayWidth: 32, displayHeight: 22 }
        };
        const out = {};
        for (const k of Object.keys(src)) out[k] = Object.freeze({ ...src[k] });
        return out;
      })()),
      PETS: Object.freeze({}),
      WAIFUS: Object.freeze({}),
      DUNGEONS: Object.freeze({}),
      // V140 — ITEMS / LEVEL_CURVE também vêm de data/monsters.json, mesmo fallback V140.
      ITEMS: Object.freeze((function () {
        const fromData = root.CONQUISTADOR_DATA && root.CONQUISTADOR_DATA.monsters && root.CONQUISTADOR_DATA.monsters.items;
        const src = fromData || {
          slime_gel: { id: 'slime_gel', name: 'Gel de Slime', category: 'material' },
          monkey_fur: { id: 'monkey_fur', name: 'Pelo de Macaco', category: 'material' },
          rat_tail: { id: 'rat_tail', name: 'Cauda de Rato', category: 'material' },
          rose: { id: 'rose', name: 'Rosa', category: 'presente' }
        };
        const out = {};
        for (const k of Object.keys(src)) out[k] = Object.freeze({ ...src[k] });
        return out;
      })()),
      LEVEL_CURVE: Object.freeze((function () {
        const fromData = root.CONQUISTADOR_DATA && root.CONQUISTADOR_DATA.monsters && root.CONQUISTADOR_DATA.monsters.levelCurve;
        return { ...(fromData || { baseXp: 60, exponent: 1.25 }) };
      })())
    });

    root.CONQUISTADOR_V13_SYSTEMS = Object.freeze({
      EventBus, EntityManager, StatusSystem, LevelSystem, SaveSystem, MonsterSystem, GameData,
      schemaVersion: 4

  })(window);
